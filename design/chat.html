<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화 · 둘 디자인 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F43C4}a:hover{color:#2D3098}
</style>
<style>html{background:#E9E8F7}body>div{margin:0 auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3FF; font-family: 'Noto Sans KR', sans-serif; color: #1F2147; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #FFFFFF; border-radius: 0 0 26px 26px; padding: 14px 14px 14px 8px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(91,95,224,0.06)">
    <a href="home.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F2147">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="width: 42px; height: 42px; border-radius: 15px; background: #E7E6FB; color: #5B5FE0; display: flex; align-items: center; justify-content: center" role="img" aria-label="프로필 사진 자리">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
      <span style="font-size: 16px; font-weight: 800">[이름]</span>
      <span style="font-size: 12px; color: #6B6E8F">서로 1순위로 자동 매칭됐어요</span>
    </div>
    <a href="match.html" style="font-size: 12px; font-weight: 700; color: #3F43C4; background: #EEEDFB; padding: 7px 12px; border-radius: 999px; text-decoration: none">궁합 92점</a>
  </div>

  <div style="flex-grow: 1; padding: 18px 16px 10px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="align-self: center; font-size: 12px; color: #6B6E8F; background: #E9E8FA; padding: 4px 12px; border-radius: 999px; margin-bottom: 6px">10월 31일 토요일</span>

    <div style="display: flex; gap: 8px; align-items: flex-start">
      <div style="width: 34px; height: 34px; border-radius: 12px; background: #E7E6FB; flex-shrink: 0" role="img" aria-label="상대 프로필 사진"></div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 250px">
        <span style="background: #FFFFFF; border-radius: 4px 18px 18px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.5">안녕하세요! 프로필에 전시 좋아하신다고 해서 반가웠어요</span>
        <span style="background: #FFFFFF; border-radius: 18px; padding: 10px 14px; font-size: 15px; line-height: 1.5">최근에 다녀온 곳 있으세요?</span>
      </div>
      <span style="align-self: flex-end; font-size: 11px; color: #6B6E8F">오후 2:10</span>
    </div>

    <div style="display: flex; gap: 6px; justify-content: flex-end; align-items: flex-end; margin-top: 4px">
      <span style="font-size: 11px; color: #6B6E8F">오후 2:14</span>
      <span style="background: #FFD3E2; color: #1F2147; border-radius: 18px 4px 18px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.5; max-width: 250px">네! 지난주에 사진전 다녀왔어요. 혹시 어떤 전시 좋아하세요?</span>
    </div>

    <div style="margin-top: auto; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(91,95,224,0.10)">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 30px; height: 30px; border-radius: 10px; background: #5B5FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
        </span>
        <span style="font-size: 14px; font-weight: 800; flex-grow: 1">AI 대화 도우미</span>
        <button aria-label="도우미 닫기" style="width: 44px; height: 44px; margin: -8px -10px -8px 0; border: none; background: transparent; color: #8A8DAA; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <span style="font-size: 13px; color: #4A4D6E; line-height: 1.5">둘 다 전시를 좋아해요. 다음 약속으로 이어지게 물어보면 좋아요.</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button style="min-height: 44px; text-align: left; border: 1.5px solid #E3E2F7; background: #F8F8FF; color: #1F2147; border-radius: 14px; padding: 10px 14px; font-family: inherit; font-size: 14px">요즘 보고 싶은 전시 있으세요?</button>
        <button style="min-height: 44px; text-align: left; border: 1.5px solid #E3E2F7; background: #F8F8FF; color: #1F2147; border-radius: 14px; padding: 10px 14px; font-family: inherit; font-size: 14px">사진전이면 저도 꼭 가보고 싶었어요!</button>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; padding: 10px 12px 26px 12px; display: flex; align-items: center; gap: 8px">
    <button aria-label="AI 도우미" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #EEEDFB; color: #5B5FE0; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
    </button>
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">메시지</label>
    <input id="msg" type="text" placeholder="메시지 보내기" style="flex-grow: 1; min-width: 0; height: 46px; box-sizing: border-box; border: none; background: #F4F3FF; border-radius: 23px; padding: 0 18px; font-family: inherit; font-size: 15px; color: #1F2147">
    <button aria-label="보내기" style="width: 46px; height: 46px; border: none; border-radius: 23px; background: #FF9FC0; color: #7A1338; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4z"></path></svg>
    </button>
  </div>
</div>
</body>
</html>
