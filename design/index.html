<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>둘 디자인 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEDFB;--ink:#1F2147;--muted:#5D6082;--indigo:#5B5FE0;--pink:#FFD3E2;--pink-ink:#A3214F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
header{max-width:2200px;margin:0 auto;padding:40px 16px 8px}
.logo{font-family:'Dancing Script',cursive;font-size:40px;color:var(--indigo)}
h1{margin:6px 0 8px;font-size:26px;font-weight:800;letter-spacing:-.5px}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff}
.dot{width:12px;height:12px;border-radius:6px}
.row{display:flex;gap:28px;overflow-x:auto;padding:24px 16px 48px;max-width:2200px;margin:0 auto}
figure{margin:0;flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
figcaption{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
figcaption a{font-size:13px;color:var(--indigo);text-decoration:none;font-weight:700}
figcaption a:hover{text-decoration:underline}
iframe{width:390px;height:844px;border:0;border-radius:34px;background:#fff;box-shadow:0 18px 40px rgba(91,95,224,.18)}
@media (max-width:480px){.row{gap:16px}iframe{width:320px;height:693px}}
</style>
</head>
<body>
<header>
  <div class="logo">dul ♡</div>
  <h1>둘 — 앱 화면 리디자인 시안</h1>
  <p>파스텔 핑크 × 인디고 파스텔. 화면 안 버튼을 누르면 다른 화면으로 이동하고, 취향 설문은 직접 골라 볼 수 있어요.</p>
  <div class="chips">
    <span class="chip"><span class="dot" style="background:#5B5FE0"></span>인디고 #5B5FE0</span>
    <span class="chip"><span class="dot" style="background:#FFD3E2"></span>파스텔 핑크 #FFD3E2</span>
    <span class="chip"><span class="dot" style="background:#FF9FC0"></span>핑크 #FF9FC0</span>
    <span class="chip"><span class="dot" style="background:#F4F3FF;border:1px solid #ccc"></span>바탕 #F4F3FF</span>
  </div>
</header>
<main class="row">
  <figure><figcaption>로그인 <a href="login.html">크게 보기 ›</a></figcaption><iframe src="login.html" title="로그인 화면"></iframe></figure>
  <figure><figcaption>홈 · 오늘의 추천 <a href="home.html">크게 보기 ›</a></figcaption><iframe src="home.html" title="홈 화면"></iframe></figure>
  <figure><figcaption>궁합 리포트 <a href="match.html">크게 보기 ›</a></figcaption><iframe src="match.html" title="궁합 리포트 화면"></iframe></figure>
  <figure><figcaption>취향 설문 <a href="survey.html">크게 보기 ›</a></figcaption><iframe src="survey.html" title="취향 설문 화면"></iframe></figure>
  <figure><figcaption>대화 · AI 도우미 <a href="chat.html">크게 보기 ›</a></figcaption><iframe src="chat.html" title="대화 화면"></iframe></figure>
</main>
</body>
</html>
