<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취향 설문 · 둘 디자인 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F43C4}a:hover{color:#2D3098}
</style>
<style>html{background:#E9E8F7}body>div{margin:0 auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5B5FE0; font-family: 'Noto Sans KR', sans-serif; color: #1F2147; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 18px 24px 30px 24px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF; position: relative">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="login.html" aria-label="뒤로" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.25); position: relative" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="12" aria-label="설문 진행">
        <div style="width: 25%; height: 8px; border-radius: 4px; background: #FFD3E2"></div>
      </div>
      <span style="font-size: 13px; font-weight: 700">3 / 12</span>
    </div>
    <h1 style="margin: 6px 0 0 0; font-size: 26px; font-weight: 800; line-height: 1.4; letter-spacing: -0.5px">어떤 데이트를<br>좋아하세요?</h1>
    <span style="font-size: 14px">취향이 가까운 사람을 찾는 데만 써요</span>
    <div style="position: absolute; right: 26px; bottom: 26px; width: 74px; height: 74px; border-radius: 37px; background: #FFFFFF; box-shadow: 0 10px 22px rgba(31,33,71,0.2)" aria-hidden="true">
      <div style="position: absolute; left: 22px; top: 30px; width: 8px; height: 11px; border-radius: 4px; background: #1F2147"></div>
      <div style="position: absolute; left: 44px; top: 30px; width: 8px; height: 11px; border-radius: 4px; background: #1F2147"></div>
      <div style="position: absolute; left: 12px; top: 44px; width: 14px; height: 7px; border-radius: 4px; background: #FFC2D6"></div>
      <div style="position: absolute; left: 48px; top: 44px; width: 14px; height: 7px; border-radius: 4px; background: #FFC2D6"></div>
    </div>
  </div>

  <div style="flex-grow: 1; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 26px 22px 24px 22px; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 16px; font-weight: 800; margin-bottom: 10px; padding: 0">1. 첫 만남 장소로 좋은 곳은?</legend>
      <div id="opts" style="display: contents"></div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 16px; font-weight: 800">2. 주말엔 주로…</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #F4F3FF; border-radius: 18px; padding: 6px">
        <div id="weekend" style="display: contents"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 16px; font-weight: 800">3. 관심사 <span style="font-size: 13px; font-weight: 500; color: #6B6E8F">여러 개 골라도 돼요</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div id="chips" style="display: contents"></div>
      </div>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
      <a href="login.html" style="height: 54px; border-radius: 18px; background: #EEEDFB; color: #3F43C4; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">이전</a>
      <a href="home.html" style="height: 54px; border-radius: 18px; background: #5B5FE0; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">다음</a>
    </div>
  </div>
</div>
<script>
(function(){
var st={pick:'cafe',weekend:1,chips:{'운동':true,'전시':true}};
var check='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
var base='display:flex;align-items:center;gap:12px;height:54px;box-sizing:border-box;border-radius:16px;padding:0 16px;font-family:inherit;font-size:15px;text-align:left;cursor:pointer;';
function btn(style,html,pressed,fn){var b=document.createElement('button');b.type='button';b.setAttribute('style',style);b.setAttribute('aria-pressed',pressed?'true':'false');b.innerHTML=html;b.onclick=fn;return b;}
function render(){
var o=document.getElementById('opts');o.innerHTML='';
[['cafe','조용한 카페에서 이야기'],['walk','동네 산책하면서 가볍게'],['food','맛집에서 같이 밥 먹기']].forEach(function(x){var on=st.pick===x[0];
o.appendChild(btn(base+(on?'border:2px solid #FF9FC0;background:#FFE9F0;color:#1F2147;font-weight:700':'border:1.5px solid #E3E2F7;background:#FFFFFF;color:#4A4D6E;font-weight:500'),
'<span style="width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:'+(on?'#E8608F':'#E3E2F7')+'">'+check+'</span>'+x[1],on,function(){st.pick=x[0];render();}));});
var w=document.getElementById('weekend');w.innerHTML='';
['집콕','반반','밖으로'].forEach(function(l,i){var on=st.weekend===i;
w.appendChild(btn('height:44px;border:none;border-radius:14px;font-family:inherit;font-size:15px;cursor:pointer;'+(on?'background:#5B5FE0;color:#FFFFFF;font-weight:700;box-shadow:0 4px 12px rgba(91,95,224,0.25)':'background:transparent;color:#4A4D6E;font-weight:500'),l,on,function(){st.weekend=i;render();}));});
var c=document.getElementById('chips');c.innerHTML='';
['운동','음악','전시','여행','요리','게임','독서','반려동물'].forEach(function(l){var on=!!st.chips[l];
c.appendChild(btn('height:44px;padding:0 18px;border-radius:999px;font-family:inherit;font-size:14px;cursor:pointer;'+(on?'border:none;background:#FFD3E2;color:#A3214F;font-weight:700':'border:1.5px solid #E3E2F7;background:#F8F8FF;color:#4A4D6E;font-weight:500'),l,on,function(){st.chips[l]=!on;render();}));});
}
render();
})();
</script>
</body>
</html>
