<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>둘 홈 · 둘 디자인 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A4ED0}a:hover{color:#3236A8}
</style>
<style>html{background:#E9E8F7}body>div{margin:0 auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3FF; font-family: 'Noto Sans KR', sans-serif; color: #1F2147; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 0 20px; flex-grow: 1">
  <div style="display: flex; justify-content: space-between; align-items: center; height: 48px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px">홈</h1>
    <button aria-label="알림 3개" style="position: relative; width: 44px; height: 44px; border: none; background: transparent; color: #1F2147; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: #FFD3E2; color: #A3214F; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>
    </button>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 16px 18px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 20px rgba(91,95,224,0.08)">
    <div style="width: 48px; height: 48px; border-radius: 16px; background: #FFE6EF; color: #D6336C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <span style="font-size: 13px; color: #6B6E8F">오늘의 추천이 도착했어요</span>
      <span style="font-size: 16px; font-weight: 700; line-height: 1.4">서로 1순위인 사람이 1명 있어요</span>
    </div>
    <button aria-label="알림 닫기" style="width: 44px; height: 44px; border: none; background: transparent; color: #8A8DAA; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="background: #5B5FE0; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 28px rgba(91,95,224,0.22)">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 4px 20px">
      <span style="font-size: 20px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.3px">dul</span>
      <span style="font-size: 12px; font-weight: 700; color: #1F2147; background: #FFD3E2; padding: 4px 10px; border-radius: 999px">강서구 · 데이트</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 14px 16px 22px 16px">
      <a href="survey.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        </span>
        <span style="font-size: 13px; font-weight: 500">내 프로필</span>
      </a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        </span>
        <span style="font-size: 13px; font-weight: 500">마음함</span>
      </a>
      <a href="chat.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </span>
        <span style="font-size: 13px; font-weight: 500">대화</span>
      </a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none">
        <span style="position: relative; width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 17v4M17 19h4"></path></svg>
          <span style="position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 5px; background: #FF9FC0; border: 2px solid #5B5FE0"></span>
        </span>
        <span style="font-size: 13px; font-weight: 500">데이트 코스</span>
      </a>
    </div>

    <div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 22px 20px 20px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 15px; color: #6B6E8F; font-weight: 500">오늘의 추천</span>
          <span style="font-size: 12px; font-weight: 700; color: #A3214F; background: #FFE6EF; padding: 3px 9px; border-radius: 999px">서로 1순위</span>
        </div>
        <span style="font-size: 13px; color: #6B6E8F">1 / 5</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 64px; height: 64px; border-radius: 22px; background: #E7E6FB; color: #5B5FE0; display: flex; align-items: center; justify-content: center; flex-shrink: 0" role="img" aria-label="프로필 사진 자리">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
          <span style="font-size: 18px; font-weight: 700">[이름], 26</span>
          <span style="font-size: 13px; color: #6B6E8F">강서구 | 3km 이내</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end">
          <span style="font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1">92<span style="font-size: 18px; font-weight: 700">점</span></span>
          <span style="font-size: 12px; font-weight: 700; color: #3F43C4; margin-top: 4px">궁합 S</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; background: #F6F5FF; border-radius: 18px; padding: 14px 16px">
        <span style="font-size: 13px; font-weight: 700; color: #3F43C4">이 사람을 고른 이유</span>
        <div style="display: grid; grid-template-columns: 74px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 13px">
          <span style="color: #4A4D6E">관심사</span>
          <span style="height: 8px; border-radius: 4px; background: #E3E2F7; overflow: hidden; display: block"><span style="display: block; width: 95%; height: 8px; background: #5B5FE0; border-radius: 4px"></span></span>
          <span style="text-align: right; font-weight: 700">95</span>
          <span style="color: #4A4D6E">생활 패턴</span>
          <span style="height: 8px; border-radius: 4px; background: #E3E2F7; overflow: hidden; display: block"><span style="display: block; width: 88%; height: 8px; background: #8E91EE; border-radius: 4px"></span></span>
          <span style="text-align: right; font-weight: 700">88</span>
          <span style="color: #4A4D6E">대화 스타일</span>
          <span style="height: 8px; border-radius: 4px; background: #E3E2F7; overflow: hidden; display: block"><span style="display: block; width: 84%; height: 8px; background: #FF9FC0; border-radius: 4px"></span></span>
          <span style="text-align: right; font-weight: 700">84</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 52px; border: none; border-radius: 16px; background: #EEEDFB; color: #3F43C4; font-family: inherit; font-size: 16px; font-weight: 700">넘기기</button>
        <a href="match.html" style="height: 52px; border-radius: 16px; background: #FFD3E2; color: #A3214F; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          좋아요
        </a>
      </div>
      <div style="display: flex; justify-content: center; gap: 6px" aria-hidden="true">
        <span style="width: 16px; height: 6px; border-radius: 3px; background: #5B5FE0"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #D5D4EE"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #D5D4EE"></span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #D5D4EE"></span>
      </div>
    </div>
  </div>
</div>

<nav style="background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -4px 20px rgba(91,95,224,0.08); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px 8px; margin-top: 16px">
  <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F43C4; text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#5B5FE0" stroke="#5B5FE0" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    홈
  </a>
  <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B6E8F; text-decoration: none; font-size: 12px; padding: 6px 0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A9ABC6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>
    발견
  </a>
  <a href="chat.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B6E8F; text-decoration: none; font-size: 12px; padding: 6px 0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A9ABC6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    대화
  </a>
  <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B6E8F; text-decoration: none; font-size: 12px; padding: 6px 0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A9ABC6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    전체
  </a>
</nav>
</div>
