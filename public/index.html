<style>

</style>
<!-- Firebase 연결
     - Firebase Hosting(*.web.app)에서 열면: Hosting이 자동으로 넣어주는 설정을 씀 (따로 넣을 것 없음)
     - GitHub Pages 등 다른 곳에서 열면: firebase-config.js에 적힌 설정을 씀 (비어 있으면 서버 없이 미리보기) -->
<script src="firebase-config.js"></script>
<script>
(function () {
  var onFb = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
  var cfg = window.DUL_FIREBASE_CONFIG;
  if (!onFb && !(cfg && cfg.apiKey)) return;
  var base = onFb ? "/__/firebase/10.12.2/" : "https://www.gstatic.com/firebasejs/10.12.2/";
  var tags = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"]
    .map(function (f) { return '<script src="' + base + f + '"><\/script>'; }).join("");
  tags += onFb ? '<script src="/__/firebase/init.js"><\/script>' : '<script>firebase.initializeApp(window.DUL_FIREBASE_CONFIG);<\/script>';
  document.write(tags);
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 파스텔 핑크 바탕 위에 흰 "게시물 카드"를 쌓는 휴대폰 폭 앱. 선은 코발트 손그림, 로고는 민트 테두리 글자 */
:root {
  --bg: #F7CFDC;
  --app: #FDE6EE;
  --surface: #FFFFFF;
  --paper: #FFF6F9;
  --ink: #6E3A55;
  --muted: #B2809A;
  --line: #F7D3DF;
  --stroke: #F4A3C0;
  --rose: #E5638F;
  --accent: #E5638F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE8F0;
  --heart: #FF6F9C;
  --heart-soft: #FFE1EB;
  --mint: #F9B4CB;
  --mint-deep: #D2557F;
  --accent2: #C0628A;
  --accent2-soft: #FCE6EF;
  --lilac: #EBDDFB;
  --strip: #FFEDF3;
  --chip: #FFEFF4;
  --good: #4FA67A;
  --bad: #D9486F;
  --bad-soft: #FFE4EB;
  --scrim: rgba(110, 58, 85, .35);
  --shadow: 0 8px 22px rgba(229, 99, 143, .18);
  --font-logo: "Black Han Sans", "Do Hyeon", sans-serif;
  --font-display: "Do Hyeon", "Gowun Dodum", sans-serif;
  --font-hand: "Gaegu", "Gowun Dodum", cursive;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2B1722; --app: #34202B; --surface: #3F2935; --paper: #3A2530; --ink: #FFE8F1; --muted: #D8A9BF; --line: #533645;
    --stroke: #F59BBD; --rose: #FF8DB5; --accent: #FF8DB5; --accent-ink: #3A1424; --accent-soft: #4E2C3C; --heart: #FF85AC; --heart-soft: #5A2A3E;
    --mint: #F59BBD; --mint-deep: #FFB3CD; --accent2: #FFB3CD; --accent2-soft: #4A2B39; --lilac: #43304F; --strip: #48303D; --chip: #48303D;
    --good: #7FD4A4; --bad: #FF8FA8; --bad-soft: #552634; --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 22px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2B1722; --app: #34202B; --surface: #3F2935; --paper: #3A2530; --ink: #FFE8F1; --muted: #D8A9BF; --line: #533645;
  --stroke: #F59BBD; --rose: #FF8DB5; --accent: #FF8DB5; --accent-ink: #3A1424; --accent-soft: #4E2C3C; --heart: #FF85AC; --heart-soft: #5A2A3E;
  --mint: #F59BBD; --mint-deep: #FFB3CD; --accent2: #FFB3CD; --accent2-soft: #4A2B39; --lilac: #43304F; --strip: #48303D; --chip: #48303D;
  --good: #7FD4A4; --bad: #FF8FA8; --bad-soft: #552634; --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 22px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stroke); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
b { font-weight: 700; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#app { max-width: 520px; min-height: 100%; margin: 0 auto; background: var(--app); position: relative; display: flex; flex-direction: column; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 로고: 흰 글자 + 민트 테두리 */
.logo { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.logo small { font-family: var(--font-mono); font-size: 9px; letter-spacing: .32em; color: var(--rose); margin-bottom: 3px; }
.logo span { font-family: var(--font-logo); font-size: 32px; color: var(--surface); -webkit-text-stroke: 1.6px var(--rose); paint-order: stroke fill; text-shadow: 0 2px 0 var(--stroke); letter-spacing: .02em; }

/* 상단바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--app); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.devsw { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink); cursor: pointer; border: 1.5px solid var(--stroke); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 5px; }
.devsw .track { width: 26px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
.devsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--stroke); transition: left .15s; }
.devsw[aria-pressed="true"] { background: var(--accent2-soft); }
.devsw[aria-pressed="true"] .track { background: var(--rose); }
.devsw[aria-pressed="true"] .track::after { left: 12px; }

main { flex: 1; padding-block: 6px 104px; display: flex; flex-direction: column; gap: 16px; }
.screen-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.screen-title h2 { font-family: var(--font-hand); font-weight: 700; font-size: 28px; line-height: 1.1; position: relative; padding-bottom: 6px; }
.screen-title h2::after { content: ""; position: absolute; left: 0; right: 8%; bottom: 0; height: 6px; background: var(--surface); border-radius: 3px; opacity: .8; z-index: -1; }
.screen-title .muted { font-size: 13px; }
.screen-title h2 { z-index: 0; }

/* 탭바 */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; background: var(--surface); border-top: 1.5px solid var(--stroke); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar button { border: 0; background: none; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--muted); cursor: pointer; position: relative; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="true"] { color: var(--rose); font-weight: 700; }
.tabbar button[aria-current="true"] svg { fill: var(--heart-soft); stroke: var(--rose); }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--heart); color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* 공통 */
.btn { border: 1.5px solid var(--rose); border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: var(--rose); color: var(--accent-ink); transition: transform .08s; }
.btn:active { transform: translateY(1px); }
.btn.alt { background: var(--surface); color: var(--rose); }
.btn.line { background: transparent; color: var(--rose); }
.btn.heart { background: var(--heart); border-color: var(--heart); color: #FFFFFF; }
.btn.sm { padding: 6px 13px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.panel { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.notice { border-radius: 14px; padding: 12px 14px; font-size: 14px; background: var(--paper); border: 1.5px dashed var(--stroke); }
.notice.warn { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.notice.ok { background: var(--heart-soft); border-color: var(--heart); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--chip); }
.chip.hit { background: var(--accent-soft); color: var(--rose); font-weight: 700; box-shadow: inset 0 0 0 1px var(--stroke); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tgl { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.tgl.on { background: var(--rose); border-color: var(--rose); color: var(--accent-ink); font-weight: 700; }
.tgl.lv1 { background: var(--accent-soft); color: var(--rose); border-color: var(--stroke); }
.tgl.lv3 { background: var(--heart); border-color: var(--heart); color: #FFFFFF; }
.tgl .stars { font-size: 11px; letter-spacing: -1px; }
.grade { display: inline-block; font-family: var(--font-hand); font-weight: 700; font-size: 15px; padding: 0 10px; border-radius: 999px; background: var(--lilac); color: var(--ink); }
.grade.top { background: var(--heart-soft); color: var(--heart); }

/* 손그림 장식 */
.doodle { stroke: var(--stroke); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.doodle .fillh { fill: var(--heart-soft); }
.doodle .fillm { fill: var(--lilac); }

/* 사진 */
.ph { position: relative; overflow: hidden; background: var(--paper); display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .ini { font-family: var(--font-logo); color: var(--surface); -webkit-text-stroke: 1.5px var(--stroke); paint-order: stroke fill; }
.ph.noimg { background: repeating-linear-gradient(-45deg, var(--paper) 0 10px, var(--strip) 10px 20px); }
.av { width: 46px; height: 46px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px var(--stroke); }
.av .ini { font-size: 20px; -webkit-text-stroke-width: 1px; }

/* 인증 화면 */
.auth { padding-block: 28px 40px; display: flex; flex-direction: column; gap: 18px; }
.auth-brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.auth-brand .logo { align-items: center; }
.auth-brand .logo small { font-size: 11px; }
.auth-brand .logo span { font-size: 96px; line-height: 1.05; -webkit-text-stroke-width: 2.4px; text-shadow: 0 4px 0 var(--stroke); }
.auth-brand p { margin: 0; font-family: var(--font-hand); font-size: 22px; font-weight: 700; color: var(--rose); }
.auth-art { width: 100%; max-width: 320px; background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.auth-art svg { display: block; width: 100%; height: auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 9px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--rose); color: var(--accent-ink); }
form.f { display: flex; flex-direction: column; gap: 14px; }
.auth form.f { background: var(--surface); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 700; }
.fld > span small { font-weight: 400; color: var(--muted); }
.fld input[type=text], .fld input[type=password], .fld input[type=number], .fld input[type=date], .fld select, .fld textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--stroke); outline: none; }
.fld textarea { resize: vertical; min-height: 70px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radios { display: flex; gap: 8px; flex-wrap: wrap; }
.radios label { display: flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.radios input { accent-color: var(--stroke); }
.err { color: var(--bad); font-size: 13px; margin: 0; font-weight: 700; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.demo { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 14px; padding: 8px 10px; cursor: pointer; text-align: left; min-width: 0; box-shadow: var(--shadow); }
.demo .av { width: 32px; height: 32px; }
.demo .av .ini { font-size: 14px; }
.demo b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.photo-pick { display: flex; gap: 14px; align-items: center; }
.photo-pick .ph { width: 84px; height: 105px; border-radius: 6px; flex: none; box-shadow: 0 0 0 1.5px var(--stroke); }
.photo-pick .ph .ini { font-size: 34px; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* 게시물 카드 */
.card { background: var(--surface); border-radius: 6px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.card .frame { padding: 14px 14px 0; }
.card .ph { aspect-ratio: 1 / 1; max-width: 100%; box-shadow: 0 0 0 1.5px var(--stroke); }
.card .ph .ini { font-size: 96px; }
.card-body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.card-name { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card-name b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.reasons li { padding-left: 22px; position: relative; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 12px; height: 10px; border: 2px solid var(--heart); border-top: 0; border-right: 0; transform: rotate(-45deg) scale(.8); }
.post-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--strip); padding: 8px 14px; }
.post-strip .ico { border: 0; background: none; padding: 4px; cursor: pointer; color: var(--rose); display: grid; place-items: center; border-radius: 8px; }
.post-strip .ico svg { width: 22px; height: 22px; }
.post-strip .ico.on svg { fill: var(--heart); stroke: var(--heart); }
.post-strip .right { display: flex; gap: 2px; align-items: center; }
.post-strip .dots { color: var(--rose); letter-spacing: 2px; font-weight: 700; padding: 0 4px; }
.acts { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.devline { font-family: var(--font-mono); font-size: 12px; color: var(--mint-deep); background: var(--accent2-soft); border-radius: 8px; padding: 6px 10px; }
.state { font-size: 14px; font-weight: 700; color: var(--heart); }

.match-banner { border-radius: 18px; padding: 16px; background: var(--surface); box-shadow: var(--shadow); border: 2px solid var(--heart); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.match-banner .pair { display: flex; align-items: center; gap: 8px; }
.match-banner .heart { color: var(--heart); font-size: 20px; }
.match-banner h3 { font-family: var(--font-hand); font-weight: 700; font-size: 24px; }

/* 목록 */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px dashed var(--line); cursor: pointer; min-width: 0; }
.item:last-child { border-bottom: 0; }
.item .meta { flex: 1; min-width: 0; }
.item .meta b { display: block; }
.item .meta > span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .side { font-size: 12px; color: var(--muted); text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .unread { background: var(--heart); color: #FFFFFF; border-radius: 9px; min-width: 18px; padding: 0 6px; font-size: 11px; font-weight: 700; text-align: center; }
.sec h3 { font-family: var(--font-hand); font-weight: 700; font-size: 20px; margin-bottom: 2px; }
.via { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.via.auto { background: var(--heart-soft); color: var(--heart); }
.sigtag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--rose); white-space: nowrap; }
.sigtag.warm { background: var(--heart-soft); color: var(--heart); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-family: var(--font-hand); font-size: 21px; margin-bottom: 2px; }
.empty svg { width: 90px; height: auto; margin: 0 auto 8px; display: block; }

/* 시트 (상세, 채팅) */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--app); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet.full { height: calc(100% - env(safe-area-inset-top, 0px)); max-height: none; border-radius: 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 10px; background: var(--surface); border-bottom: 1.5px solid var(--stroke); }
.sheet-head b { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 10px; display: grid; place-items: center; color: var(--rose); }
.icon-btn svg { width: 22px; height: 22px; }
.sheet-body { overflow-y: auto; padding-block: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.detail-frame { background: var(--surface); padding: 14px 14px 0; }
.detail-ph { aspect-ratio: 4 / 5; max-width: 100%; max-height: 52vh; width: 100%; box-shadow: 0 0 0 1.5px var(--stroke); }
.detail-ph .ini { font-size: 120px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.facts .k { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.facts .v { font-size: 14px; }
.sheet-foot { background: var(--surface); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1.5px dashed var(--line); }

table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 11px; color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
td.note { color: var(--muted); }
tr.sum td { font-weight: 700; border-bottom: 0; }
tr.pen td { color: var(--bad); }

<script>
// ---------------- 매칭 엔진 (matching.py와 같은 규칙, 가입자가 늘어도 계산되게 일반화) ----------------
function createEngine(cfg) {
  const W0 = cfg.weights;
  const KEYS = Object.keys(W0);
  const ORD = {
    marriage_view: ["negative", "neutral", "positive"],
    drinking: ["none", "sometimes", "often"],
    spending: ["saver", "balanced", "spender"],
  };
  const LABEL = {
    interests: "관심사", marriage_view: "결혼관", contact_style: "연락 스타일", distance: "거리", appearance: "외모",
    chronotype: "활동 시간대", weekend: "주말 방식", drinking: "음주", spending: "소비 성향", pet: "반려동물",
    smoking: "흡연", religion: "종교",
  };
  const REL = new Set();
  for (const [x, y] of cfg.related) { REL.add(x + "|" + y); REL.add(y + "|" + x); }
  const CAT_OF = {};
  for (const [c, ts] of Object.entries(cfg.categories)) for (const t of ts) CAT_OF[t] = c;
  // 태그 유사도: 같음 1.0 / 관련 있음 0.5 / 같은 분류 cfg.category_sim / 다름 0
  const tagSim = (x, y) => {
    if (x === y) return 1;
    if (REL.has(x + "|" + y)) return 0.5;
    if (CAT_OF[x] && CAT_OF[x] === CAT_OF[y]) return cfg.category_sim;
    return 0;
  };
  // 취향 좌표: 사람 = Σ(중요도 배율 × 관심사 좌표), 비교는 코사인 유사도
  const DIM = cfg.axes.length;
  function vecOfTags(tags, levels) {
    const v = new Array(DIM).fill(0);
    for (const t of tags) {
      const m = levels ? cfg.level_mult[levels[t] ?? 2] : 1;
      (cfg.tag_vec[t] || []).forEach((x, i) => { v[i] += m * x; });
    }
    return v;
  }
  const personVec = p => vecOfTags(p.interests, Object.fromEntries(p.interests.map(t => [t, levelOf(p, t)])));
  function cosine(a, b) {
    let d = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    return na && nb ? d / Math.sqrt(na * nb) : 0;
  }
  const spread = c => Math.min(1, Math.max(0, (c - cfg.cos_floor) / (1 - cfg.cos_floor)));
  // 여러 사람의 8차원 좌표를 2차원으로 펼치기 (주성분 분석, 화면 지도용)
  function project2D(vecs) {
    const n = vecs.length, mean = new Array(DIM).fill(0);
    vecs.forEach(v => v.forEach((x, i) => { mean[i] += x / n; }));
    const C = vecs.map(v => v.map((x, i) => x - mean[i]));
    const cov = Array.from({ length: DIM }, (_, i) => Array.from({ length: DIM }, (_, j) => C.reduce((s, r) => s + r[i] * r[j], 0)));
    const comps = [];
    for (let c = 0; c < 2; c++) {
      let v = Array.from({ length: DIM }, (_, i) => 1 + i * 0.1);
      for (let it = 0; it < 60; it++) {
        let w = cov.map(row => row.reduce((s, x, j) => s + x * v[j], 0));
        for (const u of comps) { const d = w.reduce((s, x, i) => s + x * u[i], 0); w = w.map((x, i) => x - d * u[i]); }
        const nrm = Math.sqrt(w.reduce((s, x) => s + x * x, 0)) || 1;
        v = w.map(x => x / nrm);
      }
      comps.push(v);
    }
    return { points: C.map(r => comps.map(u => r.reduce((s, x, i) => s + x * u[i], 0))), mean, comps };
  }
  const levelOf = (p, t) => p.interest_level?.[t] ?? (t === p.favorite_tag ? 3 : 2);
  // 거르기 태그: "cat:운동"처럼 분류 전체도 고를 수 있음
  const tagHit = (want, u, related) => want.startsWith("cat:") ? CAT_OF[u] === want.slice(4) : (u === want || (related && tagSim(want, u) >= 0.5));
  const ordSim = (f, x, y) => {
    const i = ORD[f].indexOf(x), j = ORD[f].indexOf(y);
    if (i < 0 || j < 0) return 0;
    return ({ 0: 1, 1: 0.5 })[Math.abs(i - j)] ?? 0;
  };
  const petSim = (x, y) => {
    const fond = v => v === "has" || v === "likes";
    if ((fond(x) && fond(y)) || (x === "dislikes" && y === "dislikes")) return 1;
    if ([x, y].includes("has") && [x, y].includes("dislikes")) return 0;
    return 0.5;
  };
  const satisfies = (f, actual, wanted) => (f === "pet" && wanted === "likes") ? (actual === "has" || actual === "likes") : actual === wanted;

  function dist(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const la1 = a.lat * rad, la2 = b.lat * rad, dla = la2 - la1, dlo = (b.lng - a.lng) * rad;
    const h = Math.sin(dla / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // 희귀도: 지금 가입한 사람 전체 기준으로 다시 계산 (가장 흔한 태그 = 1.0, 상한 cfg.rarity_cap)
  function buildRarity(list) {
    const n = list.length, cnt = {};
    for (const p of list) for (const t of p.interests) cnt[t] = (cnt[t] || 0) + 1;
    const idf = Object.fromEntries(Object.entries(cnt).map(([t, c]) => [t, Math.log(n / c)]));
    const base = Math.min(...Object.values(idf));
    return Object.fromEntries(Object.entries(idf).map(([t, v]) => [t, Math.min(base > 0 ? v / base : 1 + v, cfg.rarity_cap)]));
  }

  function normWeights(w) {
    const s = KEYS.reduce((t, k) => t + (w?.[k] || 0), 0);
    if (s <= 0) return { ...W0 };
    return Object.fromEntries(KEYS.map(k => [k, (w[k] || 0) * 100 / s]));
  }

  // 실제로 쓰는 가중치: (직접 조절한 값 또는 만남 목적별 기본값) × 마음 표현으로 학습한 배율 → 합계 100
  function baseWeights(p, s) { return (s && s.weights) || (cfg.purpose_weights && cfg.purpose_weights[p.purpose]) || W0; }
  function effWeights(p, s) {
    const b = baseWeights(p, s), L = (s && s.learned) || {};
    return normWeights(Object.fromEntries(KEYS.map(k => [k, (b[k] || 0) * (L[k] ?? 1)])));
  }

  function filterOne(a, b, d, tagOpt) {
    const pr = a.preference;
    if (!b.nickname || !b.has_photo) return { code: "R1", text: "프로필 미완성 (사진 없음)" };
    if (!pr.gender.includes(b.gender)) return { code: "R2", text: "성별" };
    if (b.age < pr.age_min || b.age > pr.age_max) return { code: "R3", text: "나이" };
    if (d > pr.max_distance_km && (pr.distance_importance === 3 || d > pr.max_distance_km * 2)) return { code: "R4", text: "거리" };
    if (a.purpose !== b.purpose) return { code: "R5", text: "목적" };
    for (const [f, c] of Object.entries(pr.conditions || {}))
      if (c.importance === 3 && !satisfies(f, b[f], c.value)) return { code: "R6", text: `절대 조건 (${LABEL[f] ?? f})` };
    if (tagOpt && tagOpt.tags && tagOpt.tags.length) {
      const ok = b.interests.some(u => tagOpt.tags.some(tg => tagHit(tg, u, tagOpt.related)));
      if (!ok) return { code: "R7", text: "태그" };
    }
    return null;
  }

  // detail=false: 점수 숫자만 (500명 전체 계산용). detail=true: 화면에 보여줄 근거까지
  function scoreOne(a, b, d, W, rarity, va, vb, detail) {
    let total = 0;
    const reasons = [], parts = [], pens = [];
    const part = detail
      ? (key, pts, note) => { total += pts; parts.push({ key, label: LABEL[key], w: W[key], pts, note: typeof note === "function" ? note() : note }); }
      : (key, pts) => { total += pts; };

    let k = 0; const hits = [];
    for (const tg of a.interests) {
      let bestTag = null, best = 0;
      for (const u of b.interests) { const s = tagSim(tg, u); if (s > best) { best = s; bestTag = u; } }
      if (best > 0) {
        k += best * (rarity[tg] ?? 1) * cfg.level_mult[levelOf(a, tg)];
        if (detail) hits.push({ mine: tg, theirs: bestTag, sim: best });
      }
    }
    const cos = cosine(va, vb);
    let pts = (cfg.overlap_share * (1 - 0.5 ** k) + (1 - cfg.overlap_share) * spread(cos)) * W.interests;
    part("interests", pts, () => (hits.length ? hits.map(h => h.sim === 1 ? h.mine : h.sim >= 0.5 ? `${h.mine}≈${h.theirs}` : `${h.mine}~${h.theirs}(${CAT_OF[h.mine]})`).join(", ") : "겹침 없음") + ` · 좌표 유사도 ${cos.toFixed(2)}`);
    if (detail) { if (hits.length) reasons.push({ key: "interests", pts, hits }); else if (cos >= 0.85) reasons.push({ key: "taste", pts, cos }); }

    for (const f of ["marriage_view", "drinking", "spending"]) {
      const s = ordSim(f, a[f], b[f]); pts = s * W[f];
      part(f, pts, () => `${a[f]} / ${b[f]}`);
      if (detail && s === 1) reasons.push({ key: f, pts, value: a[f] });
    }
    for (const f of ["contact_style", "chronotype", "weekend"]) {
      const s = a[f] === b[f] ? 1 : 0; pts = s * W[f];
      part(f, pts, () => `${a[f]} / ${b[f]}`);
      if (detail && s) reasons.push({ key: f, pts, value: a[f] });
    }
    part("pet", petSim(a.pet, b.pet) * W.pet, () => `${a.pet} / ${b.pet}`);

    const maxD = Math.min(a.preference.max_distance_km, b.preference.max_distance_km);
    let s = Math.max(0, 1 - d / maxD); pts = s * W.distance;
    part("distance", pts, () => `${d.toFixed(1)}km / 기준 ${maxD}km`);
    if (detail && s >= 0.5) reasons.push({ key: "distance", pts, value: d });

    const wanted = Object.entries(a.preference.appearance || {}).filter(([, v]) => v !== "any" && Array.isArray(v) && v.length);
    const matched = wanted.filter(([kk, v]) => v.includes(b.appearance?.[kk]));
    s = wanted.length ? matched.length / wanted.length : 1; pts = s * W.appearance;
    part("appearance", pts, () => wanted.length ? `원하는 ${wanted.length}개 중 ${matched.length}개 일치` : "상관없음");
    if (detail && wanted.length && s > 0) reasons.push({ key: "appearance", pts });

    for (const [f, c] of Object.entries(a.preference.conditions || {})) {
      const pen = cfg.penalty[c.importance];
      if (pen !== undefined && !satisfies(f, b[f], c.value)) { total += pen; if (detail) pens.push({ pts: pen, text: `${LABEL[f] ?? f} 조건 어김` }); }
    }
    const over = d - a.preference.max_distance_km;
    if (over > 0) { const p = cfg.dist_penalty * Math.ceil(over / 5); total += p; if (detail) pens.push({ pts: p, text: `최대 거리 ${over.toFixed(1)}km 초과` }); }

    if (detail) reasons.sort((x, y) => y.pts - x.pts);
    return { total: Math.max(total, 0), reasons, parts, pens };
  }

  // 전체 계산: 사람마다 추천 목록 + 자동 매칭
  // opts.isBlocked(a, b): 둘 중 한 명이라도 차단했으면 true
  function computeAll(list, settingsOf, opts) {
    opts = opts || {};
    const rarity = buildRarity(list);
    const lists = {};
    // 사람별로 한 번만 계산해서 재사용
    const VEC = {}, WN = {}, SET = {};
    for (const p of list) { VEC[p.id] = personVec(p); SET[p.id] = settingsOf(p.id); WN[p.id] = effWeights(p, SET[p.id]); }
    for (const a of list) {
      const sa = SET[a.id];
      const recs = [], rejected = { R1: 0, R2: 0, R3: 0, R4: 0, R5: 0, R6: 0, R7: 0, nearestR4: null };
      for (const b of list) {
        if (b.id === a.id) continue;
        if (opts.isBlocked && opts.isBlocked(a.id, b.id)) continue;
        if (!a.preference.gender.includes(b.gender)) continue;
        if (!b.preference.gender.includes(a.gender)) { rejected.R2++; continue; }
        const d = dist(a, b);
        const why = filterOne(a, b, d, sa) || filterOne(b, a, d, null);
        if (why) { rejected[why.code]++; if (why.code === "R4" && (rejected.nearestR4 === null || d < rejected.nearestR4)) rejected.nearestR4 = d; continue; }
        const ab = scoreOne(a, b, d, WN[a.id], rarity, VEC[a.id], VEC[b.id], false).total;
        const ba = scoreOne(b, a, d, WN[b.id], rarity, VEC[b.id], VEC[a.id], false).total;
        const raw = Math.sqrt(ab * ba);
        recs.push({ id: b.id, distance: d, score: raw, raw, ab, ba, pop: 1 });
      }
      recs.sort((x, y) => (y.score - x.score) || (x.distance - y.distance));
      lists[a.id] = { recs, rejected };
    }
    // 인기 쏠림 완화: 여러 사람의 상위 3명에 자주 드는 사람은 점수를 조금씩 낮춰서 고르게 노출
    const popCount = {};
    for (const p of list) for (const r of lists[p.id].recs.slice(0, 3)) popCount[r.id] = (popCount[r.id] || 0) + 1;
    const free = cfg.pop_free ?? 3, damp = cfg.pop_damp ?? 0;
    const popFactor = id => 1 / (1 + damp * Math.max(0, (popCount[id] || 0) - free));
    if (damp > 0) for (const p of list) {
      const recs = lists[p.id].recs;
      for (const r of recs) { r.pop = popFactor(r.id); r.score = r.raw * r.pop; }
      recs.sort((x, y) => (y.score - x.score) || (x.distance - y.distance));
    }
    // 자동 매칭: 서로가 1순위면 연결, 연결된 사람을 빼고 반복
    const auto = {};
    const N = cfg.auto_top_n || 3;
    const inTop = {};
    for (const p of list) inTop[p.id] = new Set(lists[p.id].recs.slice(0, N).map(r => r.id));
    for (let round = 1; ; round++) {
      const top = {};
      for (const p of list) if (!auto[p.id]) top[p.id] = lists[p.id].recs.find(r => !auto[r.id] && inTop[p.id].has(r.id)) || null;
      let found = false;
      for (const [a, r] of Object.entries(top)) {
        if (r && String(a) < String(r.id) && top[r.id] && top[r.id].id === a) {
          auto[a] = { partner: r.id, round, score: r.score };
          auto[r.id] = { partner: a, round, score: r.score };
          found = true;
        }
      }
      if (!found) break;
    }
    return { lists, auto, rarity, popCount, ctx: { rarity, VEC, WN } };
  }
  // 조건을 바꾸면 내 후보가 몇 명이 되는지 (조건 완화 제안용)
  function countFor(list, me, settings, opts) {
    opts = opts || {};
    let n = 0;
    for (const b of list) {
      if (b.id === me.id) continue;
      if (opts.isBlocked && opts.isBlocked(me.id, b.id)) continue;
      if (!me.preference.gender.includes(b.gender) || !b.preference.gender.includes(me.gender)) continue;
      const d = dist(me, b);
      if (!filterOne(me, b, d, settings) && !filterOne(b, me, d, null)) n++;
    }
    return n;
  }
  // 두 사람 사이 항목별 유사도 (0~1), 마음 표현 학습용
  function itemSims(ctx, a, b) {
    const d = dist(a, b);
    const ones = Object.fromEntries(KEYS.map(k => [k, 10]));
    const sc = scoreOne(a, b, d, ones, ctx.rarity, ctx.VEC[a.id] || personVec(a), ctx.VEC[b.id] || personVec(b), true);
    return Object.fromEntries(sc.parts.map(p => [p.key, Math.max(0, Math.min(1, p.pts / 10))]));
  }
  // 화면에 보이는 한 쌍만 근거까지 자세히 계산
  function explain(ctx, a, b) {
    const d = dist(a, b);
    const ab = scoreOne(a, b, d, ctx.WN[a.id], ctx.rarity, ctx.VEC[a.id], ctx.VEC[b.id], true);
    const ba = scoreOne(b, a, d, ctx.WN[b.id], ctx.rarity, ctx.VEC[b.id], ctx.VEC[a.id], true);
    return {
      reasons: ab.reasons, penA: ab.pens, penB: ba.pens,
      parts: ab.parts.map((p, i) => ({ ...p, wB: ba.parts[i].w, ptsB: ba.parts[i].pts, noteB: ba.parts[i].note })),
    };
  }

  return { computeAll, explain, countFor, itemSims, baseWeights, effWeights, KEYS, LABEL, W0, tagSim, dist, CAT_OF, levelOf, vecOfTags, personVec, cosine, project2D, AXES: cfg.axes };
}

function parseQuery(q) {
  const flat = q.toLowerCase().replace(/\s+/g, "");
  const tags = new Set(), cats = new Set(), via = {};
  for (const t of ALL_TAGS) {
    if (flat.includes(t.toLowerCase())) { tags.add(t); via[t] = t; continue; }
    const hit = (SYN[t] || []).find(w => flat.includes(w));
    if (hit) { tags.add(t); via[t] = hit; }
  }
  for (const c of CAT_NAMES) for (const part of c.split("·")) if (flat.includes(part)) cats.add(c);
  if (flat.includes("운동")) cats.add("운동");
  return { tags: [...tags], cats: [...cats], via };
}

function queryVec(tags, cats) {
  const v = E.vecOfTags(tags);
  for (const c of cats) {
    const cv = E.vecOfTags(CATS[c]);
    cv.forEach((x, i) => { v[i] += x / CATS[c].length; });
  }
  return v;
}
function searchPeople(me, q) {
  const w = world(), { tags, cats, via } = parseQuery(q);

  const qv = queryVec(tags, cats);
  const recIds = Object.fromEntries(w.lists[me.id].recs.map(r => [r.id, r]));
  const pool = w.list.filter(o => o.id !== me.id && o.searchable && o.has_photo && me.preference.gender.includes(o.gender) && !isBlocked(me.id, o.id));

function poseFor(uid) { let h = 0; for (const c of uid + today()) h = (h * 31 + c.charCodeAt(0)) | 0; return POSES[Math.abs(h) % POSES.length]; }

async function hash(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return "x" + h;
  }
}
function shrinkPhoto(file) { return resizeImage(file, { crop: [360, 450], quality: 0.8 }); }
function resizeImage(file, opt) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject(new Error("type"));
    const r = new FileReader();
    r.onerror = () => reject(new Error("read"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode"));
      img.onload = () => {
        const c = document.createElement("canvas");
        let W, H;
        if (opt.crop) { [W, H] = opt.crop; } else { const k = Math.min(1, opt.max / Math.max(img.width, img.height)); W = Math.round(img.width * k); H = Math.round(img.height * k); }
        c.width = W; c.height = H;
        const s = Math.max(W / img.width, H / img.height);
        const w = img.width * s, h = img.height * s;
        c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        let url = c.toDataURL("image/jpeg", opt.quality);
        if (url.length > 230000) url = c.toDataURL("image/jpeg", 0.5);
        resolve(url);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
function batchim(word) {
  const ch = String(word).trim().slice(-1), code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) return (code - 0xAC00) % 28 !== 0;
  return false;
}
const josa = (w, a, b) => w + (batchim(w) ? a : b);

    : `<span class="muted" style="font-size:13px">아래 분류에서 골라주세요</span>`;
  const cats = CAT_NAMES.map(c => {

  }).join("");

    return `<button type="button" class="tgl${lv ? " on lv" + lv : ""}" data-act="tag-${scope}" data-tag="${esc(t)}" aria-pressed="${!!lv}">${esc(t)}${lv ? ` <span class="stars">${STARS[lv]}</span>` : ""}</button>`;
  }).join("");
  return `<div class="picker">
    <div class="picked"><span class="pk-k">고른 관심사 ${st.tags.length}/5</span><div class="chips">${picked}</div></div>
    <div class="cats">${cats}</div>

    <p class="hint">누를 때마다 <b>★★ 좋아해요</b> → <b>★★★ 진짜 좋아해요</b>(최대 ${MAX_TOP}개) → <b>★ 가끔 해요</b> → 빼기</p></div>`;
}
function cycleTag(st, tag) {
  const lv = st.tags.includes(tag) ? st.lv[tag] : 0;
  const tops = st.tags.filter(t => st.lv[t] === 3 && t !== tag).length;
  if (!lv) { if (st.tags.length >= 5) return toast("관심사는 5개까지 고를 수 있어요"); st.tags.push(tag); st.lv[tag] = 2; }
  else if (lv === 2) st.lv[tag] = tops >= MAX_TOP ? 1 : 3;
  else if (lv === 3) st.lv[tag] = 1;
  else { st.tags = st.tags.filter(x => x !== tag); delete st.lv[tag]; }
  if (lv === 2 && tops >= MAX_TOP) toast(`★★★는 ${MAX_TOP}개까지라서 ★로 바꿨어요`);
  render();
}
const favOf = st => st.tags.find(t => st.lv[t] === 3) || st.tags[0] || null;

}

function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function hashStr(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function prefSig(me) { const s = settingsOf(me.id); return hashStr(JSON.stringify([me.preference, me.purpose, me.gender, s.tags, s.related, s.weights])); }
function dailyPicks(me) {
  const recs = world().lists[me.id].recs, valid = new Set(recs.map(r => r.id));
  const d = privOf(me.id).daily, t = today(), sig = prefSig(me);
  if (d && d.date === t && d.sig === sig) return { ...d, ids: d.ids.filter(id => valid.has(id)), passed: d.passed || [], extra: d.extra || 0 };
  const seen = { ...((d && d.seen) || {}) };

  const order = [...recs.filter(r => !seen[r.id]), ...recs.filter(r => seen[r.id]).sort((a, b) => (seen[a.id] < seen[b.id] ? -1 : 1))];
  const ids = order.filter(r => !passed.includes(r.id)).slice(0, REC_LIMIT).map(r => r.id);
  for (const id of ids) seen[id] = t;
  const next = { date: t, sig, ids, passed, seen, extra: 0 };

  return next;
}

// ---------- 조건 완화 제안: 조건을 바꾸면 후보가 몇 명 늘어나는지 실제로 세어봄 ----------
function relaxOptions(me) {
  const w = world(), s = settingsOf(me.id), pr = me.preference;
  const base = E.countFor(w.list, me, s, { isBlocked });
  const out = [];
  const tryOpt = (label, prefPatch, setPatch) => {
    const n = E.countFor(w.list, { ...me, preference: { ...pr, ...(prefPatch || {}) } }, { ...s, ...(setPatch || {}) }, { isBlocked });
    if (n > base) out.push({ label, n: n - base, prefPatch, setPatch });
  };
  if (pr.max_distance_km < 100) { const nd = Math.min(100, Math.max(pr.max_distance_km * 2, pr.max_distance_km + 10)); tryOpt(`최대 거리 ${pr.max_distance_km}km → ${nd}km`, { max_distance_km: nd }); }
  if (pr.distance_importance === 3) tryOpt("거리를 '가까우면 좋아요'로 바꾸기", { distance_importance: 2 });
  { const lo = Math.max(19, pr.age_min - 3), hi = pr.age_max + 3; tryOpt(`나이 ${pr.age_min}~${pr.age_max}세 → ${lo}~${hi}세`, { age_min: lo, age_max: hi }); }
  if (s.tags.length) tryOpt("관심사 거르기 풀기", null, { tags: [] });
  const hard = Object.entries(pr.conditions || {}).filter(([, c]) => c.importance === 3);
  if (hard.length) {
    const conds = Object.fromEntries(Object.entries(pr.conditions).map(([k, c]) => [k, c.importance === 3 ? { ...c, importance: 2 } : c]));
    tryOpt(`꼭 지킬 조건(${hard.map(([k]) => FIELD_KO[k] || k).join(", ")})을 '중요'로 낮추기`, { conditions: conds });
  }

}

}

// ---------- 마음 표현으로 학습: 좋게 본 사람과 잘 맞은 항목은 무게를 올리고, 아니었던 사람과 맞은 항목은 내림 ----------
const SIG_W = { like: 0.5, interest: 0.7, meet: 1, again: 1.3, fun: 0.8, pass: -1 };
function computeLearned(me) {
  const w = world();
  const mine = Object.values(S.signals).filter(x => x.from === me.id && x.kind && SIG_W[x.kind] !== undefined && w.byId[x.to]);
  if (mine.length < 2) return null;
  const pool = w.lists[me.id].recs.slice(0, 60).map(r => E.itemSims(w.ctx, me, w.byId[r.id]));
  const avg = k => pool.length ? pool.reduce((t, x) => t + x[k], 0) / pool.length : 0.5;
  const acc = Object.fromEntries(E.KEYS.map(k => [k, 0])); let tot = 0;
  for (const sg of mine) {
    const sim = E.itemSims(w.ctx, me, w.byId[sg.to]), sw = SIG_W[sg.kind];
    for (const k of E.KEYS) acc[k] += sw * (sim[k] - avg(k));
    tot += Math.abs(sw);
  }
  return { mult: Object.fromEntries(E.KEYS.map(k => [k, Math.round(Math.min(1.6, Math.max(0.6, 1 + 1.2 * acc[k] / tot)) * 100) / 100])), n: mine.length };
}
let learnTimer;

function updateLearning() {
  if (!S.uid || !S.canWrite) return;
  const me = world().byId[S.uid]; if (!me) return;
  const L = computeLearned(me), cur = settingsOf(S.uid);
  const next = L ? L.mult : null;
  if (JSON.stringify(next) === JSON.stringify(cur.learned || null)) return;
  const st = plain(cur);
  if (next) { st.learned = next; st.learnedN = L.n; } else { delete st.learned; delete st.learnedN; }
  saveUser(S.uid, { settings: st });
}

// 점수 = 관심사 겹침 + 1.2 × 취향 좌표 가까움 + 생활 패턴 보정
function courseScore(c, me, o, vec) {
  const all = me.interests.concat(o.interests);
  let s = 0;
  for (const t of c.tags) {
    const a = me.interests.includes(t), b = o.interests.includes(t);
    if (a && b) s += 1;
    else if (a || b) s += 0.3 * E.levelOf(a ? me : o, t);
    else if (all.some(u => E.CAT_OF[u] === E.CAT_OF[t])) s += 0.1;
  }
  s += 1.2 * E.cosine(E.vecOfTags(c.tags), vec);
  const both = (f, v) => me[f] === v && o[f] === v, either = (f, v) => me[f] === v || o[f] === v;
  if (c.drink && either("drinking", "none")) s -= 1.5;
  if (c.cost === 3 && either("spending", "saver")) s -= 0.4;
  if (c.out && both("weekend", "home")) s -= 0.3;
  if (c.out && both("weekend", "out")) s += 0.3;
  if (c.m.includes("cozy") && both("weekend", "home")) s += 0.3;
  return s;
}
function courseWhy(c, me, o) {
  const common = c.tags.filter(t => me.interests.includes(t) && o.interests.includes(t));
  if (common.length) return `둘 다 ${josa(common.join(", "), "을", "를")} 좋아해서`;
  const mine = c.tags.find(t => me.interests.includes(t)), theirs = c.tags.find(t => o.interests.includes(t));
  if (mine && theirs) return `내 ${mine} 취향과 ${o.nickname}님의 ${theirs} 취향을 섞어서`;
  if (theirs) return `${o.nickname}님이 ${josa(theirs, "을", "를")} 좋아해서`;
  if (mine) return `내가 좋아하는 ${mine} 취향에 맞춰서`;
  return "두 분 취향 좌표와 가까운 코스";
}
function meetPlan(me, o, mood = "auto") {
  const mid = { lat: (me.lat + o.lat) / 2, lng: (me.lng + o.lng) / 2 };
  const near = REGIONS.map(r => ({ r: r[0], d: E.dist(mid, { lat: r[1], lng: r[2] }) })).sort((a, b) => a.d - b.d)[0].r;
  const area = near.replace(/^(서울|경기|인천) /, "");
  const ov = E.personVec(o), vec = E.personVec(me).map((x, i) => x + ov[i]);
  const both = (f, v) => me[f] === v && o[f] === v;
  const courses = COURSES.filter(c => mood === "auto" || c.m.includes(mood))
    .map(c => ({ ...c, score: courseScore(c, me, o, vec) })).sort((a, b) => b.score - a.score)
    .map(c => ({ ...c, why: courseWhy(c, me, o),
      time: c.dur === "하루" || c.dur === "반나절" ? "주말 오전 10시" : c.drink ? "금요일 저녁 7시" : c.out ? (both("chronotype", "night") ? "주말 오후 2시" : "주말 오전 11시")

  return { near, area, courses, noDrink: me.drinking === "none" || o.drinking === "none" };
}

// 8차원 좌표를 2차원 지도로: 점 사이 거리가 가까울수록 취향이 비슷해요
function tasteMap(me, qv, pool, topIds) {
  const people = [me, ...pool];
  const pr = E.project2D(people.map(E.personVec));
  const qp = pr.comps.map(u => qv.reduce((s2, x, i) => s2 + (x - pr.mean[i]) * u[i], 0));
  const all = [...pr.points, qp];
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const W = 340, H = 220, P = 28;
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sx = x => P + (x - minX) / ((maxX - minX) || 1) * (W - 2 * P);
  const sy = y => P + (y - minY) / ((maxY - minY) || 1) * (H - 2 * P);
  const Q = [sx(qp[0]), sy(qp[1])];
  let lines = "", dots = "", labels = "";
  people.forEach((o, i) => {
    const [x, y] = [sx(pr.points[i][0]), sy(pr.points[i][1])];
    const isMe = i === 0, top = topIds.includes(o.id);
    if (top) lines += `<line x1="${Q[0].toFixed(1)}" y1="${Q[1].toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="m-line"/>`;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isMe || top ? 6 : 4}" class="${isMe ? "m-me" : top ? "m-top" : "m-dot"}"/>`;
    if (isMe || top) labels += `<text x="${(x + 9).toFixed(1)}" y="${(y + 4).toFixed(1)}" class="m-lab${isMe ? " me" : ""}">${esc(isMe ? "나" : o.nickname)}</text>`;
  });
  const star = `<path d="M${Q[0]} ${Q[1] - 9} l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6-4.6-4.1 6.1-.6z" class="m-q"/><text x="${(Q[0] + 11).toFixed(1)}" y="${(Q[1] + 4).toFixed(1)}" class="m-lab q">검색어</text>`;
  return `<section class="panel map"><div class="map-head"><b>취향 지도</b><span class="muted">가까울수록 비슷한 취향 · 관심사 8개 축을 2차원으로 펼친 그림</span></div>
    <div class="map-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="검색어와 가까운 사람들의 취향 지도">${lines}${dots}${star}${labels}</svg></div>
    <div class="legend"><span><i class="lg m-q"></i>검색어</span><span><i class="lg m-top"></i>가장 가까운 3명</span><span><i class="lg m-me"></i>나</span><span><i class="lg m-dot"></i>공개한 다른 사람</span></div></section>`;
}
// 개발자 화면: 검색어와 1위의 좌표를 축별로 비교
function axisTable(qv, o) {
  const pv = E.personVec(o);
  const norm = v => { const m = Math.max(...v) || 1; return v.map(x => x / m); };
  const a = norm(qv), b = norm(pv);
  return `<div class="devbox"><h4>개발자 화면 · 좌표 비교 (가장 큰 값을 1로 맞춤)</h4>
    <div class="axes">${E.AXES.map((ax, i) => `<span class="ax-l">${ax}</span><span class="ax-b q"><i style="width:${Math.round(a[i] * 100)}%"></i></span><span class="ax-b p"><i style="width:${Math.round(b[i] * 100)}%"></i></span>`).join("")}</div>
    <div class="legend"><span><i class="lg m-q"></i>검색어</span><span><i class="lg m-top"></i>${esc(o.nickname)}</span></div>
    <div class="formula">코사인 유사도 = (검색어 · 사람) ÷ (|검색어| × |사람|) = ${E.cosine(qv, pv).toFixed(3)}</div></div>`;
}

function emptyRecs(total, rej) {

}

async function deleteAccount() {
  const uid = S.uid;
  const mine = col => Object.entries(col).filter(([, d]) => d && d.from === uid).map(([id]) => id);
  const likeIds = mine(S.likes), sigIds = mine(S.signals), blockIds = mine(S.blocks);
  try {
    if (S.db) {
      for (const id of likeIds) await S.db.doc("likes/" + id).delete();
      for (const id of sigIds) await S.db.doc("signals/" + id).delete();
      for (const id of blockIds) await S.db.doc("blocks/" + id).delete();
      if (myVerif()) await S.db.doc("verifications/" + uid).delete().catch(() => {});
      if (S.fb) await S.db.doc("priv/" + uid).delete().catch(() => {});
      await S.db.doc("users/" + uid).delete();
    }
    if (S.fb) {
      try { await S.fb.auth().currentUser.delete(); }
      catch (e) { await S.fb.auth().signOut().catch(() => {}); }
    }
  } catch (e) { toast("탈퇴하지 못했어요. 잠시 뒤 다시 해주세요"); return; }
  for (const id of likeIds) delete S.likes[id];
  for (const id of sigIds) delete S.signals[id];
  for (const id of blockIds) delete S.blocks[id];
  delete S.verifs[uid]; S.myVerif = null;
  delete S.users[uid]; ver++;
  if (!S.fb) try { localStorage.removeItem("gm-priv:" + uid); } catch (e) {}
  S.confirmDel = false; S.uid = null; ls.set("gm-uid", null); S.authTab = "login"; S.draft = null; S.tab = "home";
  if (S.fb) { location.reload(); return; }
  render(); toast("탈퇴했어요. 그동안 고마웠어요");
}
function filterPicker(s) {
  const cur = S.pickCat.f;
  const label = v => v.startsWith("cat:") ? `${v.slice(4)} 전체` : v;
  const picked = s.tags.length ? s.tags.map(v => `<button type="button" class="tgl on" data-act="ftag" data-tag="${esc(v)}">${esc(label(v))} ✕</button>`).join("") : `<span class="muted" style="font-size:13px">모든 관심사</span>`;
  const cats = CAT_NAMES.map(c => `<button type="button" class="cat${c === cur ? " on" : ""}" data-act="pcat" data-scope="f" data-v="${esc(c)}" aria-pressed="${c === cur}">${esc(c)}</button>`).join("");
  const whole = "cat:" + cur, wOn = s.tags.includes(whole);
  const tags = [`<button type="button" class="tgl${wOn ? " on" : ""}" data-act="ftag" data-tag="${esc(whole)}" aria-pressed="${wOn}">${esc(cur)} 전체</button>`]
    .concat(CATS[cur].map(t => { const on = s.tags.includes(t); return `<button type="button" class="tgl${on ? " on" : ""}" data-act="ftag" data-tag="${esc(t)}" aria-pressed="${on}">${esc(t)}</button>`; })).join("");
  return `<div class="picker"><div class="picked"><span class="pk-k">고른 조건</span><div class="chips">${picked}</div></div><div class="cats">${cats}</div><div class="chips">${tags}</div></div>`;
}
function weightLabel(v, sum) {
  const p = v * 100 / sum;
  if (S.dev) return `${Math.round(p)}점`;
  return p < 4 ? "안 봐요" : p < 9 ? "조금" : p < 16 ? "보통" : "많이";
}

// ---------------- 렌더 ----------------
let lastScreen = "";
function render() {
  const app = document.getElementById("app");
  const authed = S.uid && world().byId[S.uid];
  const screen = authed ? `${S.tab}|${S.detail}|${S.chat}` : `auth|${S.authTab}`;
  const keep = {};
  if (screen === lastScreen) for (const el of app.querySelectorAll("input[id], textarea[id], select[id]")) {
    if (el.type === "file") continue;
    keep[el.id] = el.type === "checkbox" || el.type === "radio" ? { c: el.checked } : { v: el.value };
  }
  const active = document.activeElement?.id;
  const log = document.getElementById("chat-log");
  const nearBottom = log ? log.scrollHeight - log.scrollTop - log.clientHeight < 80 : true;
  const scrollY = window.scrollY;
  S.enter = screen !== lastScreen;
  app.innerHTML = (authed ? (isSuspended(S.uid) ? suspendedView() : shell()) : authView()) + (S.legal ? legalView() : "");
  if (authed && !isSuspended(S.uid)) browserNotify(world().byId[S.uid]);
  if (screen === lastScreen) {
    for (const [id, st] of Object.entries(keep)) { const el = document.getElementById(id); if (!el) continue; if ("c" in st) el.checked = st.c; else el.value = st.v; }
    window.scrollTo(0, scrollY);
  }
  if (active) { const el = document.getElementById(active); if (el && el.type !== "file") el.focus({ preventScroll: true }); }
  const nlog = document.getElementById("chat-log");
  if (nlog && (nearBottom || screen !== lastScreen)) nlog.scrollTop = nlog.scrollHeight;
  if (S.chat && authed) markRead(pk(S.uid, S.chat));
  lastScreen = screen;
}
let toastTimer;
function toast(t) { S.toast = t; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600); }

function login(uid) {
  S.uid = uid; ls.set("gm-uid", uid);
  if (S.fb && !S.subscribed) subscribeFB(uid);
  S.tab = "home"; S.detail = null; S.chat = null; S.draft = null; S.authError = ""; S.sigOpen = false; S.q = "";
  render();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const me = S.uid;
  switch (act) {
    case "authtab": S.authTab = t.dataset.v; S.authError = ""; render(); break;
    case "demo": if (REAL) break;
      if (S.fb && S.fb.auth().currentUser && !S.fb.auth().currentUser.isAnonymous) { ls.set("gm-uid", id); S.fb.auth().signOut().finally(() => location.reload()); break; }
      login(id); break;
    case "tab": S.tab = t.dataset.v; S.detail = null; S.chat = null; S.sigOpen = false; if (t.dataset.v === "home" && S.tab === "home") S.q = S.q; render(); window.scrollTo(0, 0); break;
    case "dev": S.dev = !S.dev; ls.set("gm-dev", S.dev); render(); break;
    case "open": S.detail = id; render(); break;
    case "close": S.detail = null; render(); break;
    case "openchat": S.chat = id; S.detail = null; S.sigOpen = false; render(); break;
    case "closechat": S.chat = null; S.sigOpen = false; S.planOpen = false; S.planMood = "auto"; S.planPage = 0; render(); break;
    case "lightbox": { const im = S.imgs[t.dataset.img]; if (im) { S.lightbox = im.src; render(); } break; }
    case "closelb": S.lightbox = null; render(); break;
    case "sigopen": S.sigOpen = !S.sigOpen; render(); break;
    case "sig": {
      if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      if (!isMatched(me, id)) return toast("매칭된 사람에게만 마음을 표현할 수 있어요");
      const k = t.dataset.k, cur = sigOf(me, id)?.kind;
      if (cur === k) { setSignal(me, id, { kind: null }); scheduleLearning(); toast("마음 표현을 취소했어요"); break; }
      setSignal(me, id, { kind: k }); scheduleLearning();
      sendMsg(pk(me, id), me, "", { sig: k });
      const th = sigOf(id, me)?.kind;
      toast(th === k && (k === "again" || k === "meet") ? (k === "again" ? "애프터 성사! 다시 만나요" : "두 분 모두 만나보고 싶어해요") : `'${SIG[k]}'를 전했어요`);
      break;
    }
    case "like": {

      if (on && liked(id, me)) toast(`${world().byId[id].nickname}님과 서로 좋아요! 매칭됐어요`);
      else if (on) toast("좋아요를 보냈어요");

    }
    case "pass": { const dp = dailyPicks(world().byId[me]); S.detail = null; saveDaily({ passed: [...dp.passed, id] }); break; }
    case "unpass": saveDaily({ passed: [] }); break;
    case "more": {
      const meP = world().byId[me], dp = dailyPicks(meP), recs = world().lists[me].recs;
      const nx = recs.find(r => !dp.ids.includes(r.id) && !dp.passed.includes(r.id));
      if (nx && dp.extra < 3) saveDaily({ ids: [...dp.ids, nx.id], extra: dp.extra + 1, seen: { ...dp.seen, [nx.id]: today() } });
      break;
    }
    case "relax": applyRelax(+t.dataset.i); break;
    case "notif": S.notifOpen = true; ls.set("gm-nseen:" + me, Date.now()); render(); break;
    case "closenotif": S.notifOpen = false; render(); break;

      if (ev.act === "openchat") { S.chat = ev.id; S.detail = null; S.sigOpen = false; } else { S.tab = ev.v; S.chat = null; S.detail = null; } render(); break; }
    case "notifperm": try { Notification.requestPermission().then(() => render(), () => render()); } catch (e) { toast("이 화면에서는 브라우저 알림을 쓸 수 없어요"); } break;
    case "menu": S.menu = id; render(); break;

    case "block": { const on = !blockedByMe(me, id); if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      setBlock(id, on); S.menu = null; if (on) { if (S.chat === id) S.chat = null; if (S.detail === id) S.detail = null; } toast(on ? "차단했어요. 서로 보이지 않아요" : "차단을 풀었어요"); break; }

    case "planopen": S.planOpen = !S.planOpen; render(); break;

    case "clearq": S.q = ""; render(); document.getElementById("q")?.focus(); break;
    case "logout": if (S.fb && S.fb.auth().currentUser && !S.fb.auth().currentUser.isAnonymous) { ls.set("gm-uid", null); S.fb.auth().signOut().finally(() => location.reload()); break; }
      S.uid = null; ls.set("gm-uid", null); S.authTab = "login"; S.draft = null; render(); window.scrollTo(0, 0); break;
    case "tag-su": case "tag-me": cycleTag(act === "tag-su" ? S.signup : S.draft, t.dataset.tag); break;
    case "pcat": S.pickCat[t.dataset.scope] = t.dataset.v; render(); break;
    case "ap-hair": case "ap-style": {
      const k = act.slice(3), v = t.dataset.v, arr = S.draft[k];
      S.draft[k] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
      render(); break;
    }
    case "ftag": {
      const s = settingsOf(me), tag = t.dataset.tag;
      const tags = s.tags.includes(tag) ? s.tags.filter(x => x !== tag) : [...s.tags, tag];
      saveUser(me, { settings: { ...plain(s), tags } }); break;
    }
    case "preset": saveUser(me, { settings: { ...plain(settingsOf(me)), weights: presetWeights(t.dataset.v, world().byId[me]) } }); break;
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "login-form") {
    const idv = document.getElementById("login-id").value.trim().toLowerCase(), pw = document.getElementById("login-pw").value;
    const base = BASE.profiles.find(p => p.login_id === idv);
    if (base) { if (pw === "1234") return login(base.id); S.authError = "비밀번호가 맞지 않아요. 가상 회원의 비밀번호는 1234예요."; return render(); }
    if (S.fb) {
      try {
        const cred = await S.fb.auth().signInWithEmailAndPassword(emailOf(idv), pw);
        if (!(await ownDocExists(cred.user.uid))) {   // 데이터 초기화로 프로필이 없어진 옛 계정
          try { await cred.user.delete(); } catch (e2) { await S.fb.auth().signOut().catch(() => {}); }
          S.authTab = "signup"; S.authError = "서비스가 새로 시작돼서 예전 계정 정보가 없어졌어요. 같은 아이디로 다시 가입해주세요.";
          return render();
        }
        return login(cred.user.uid);
      } catch (e) { S.authError = authErr(e); return render(); }
    }
    const found = Object.entries(S.users).find(([, u]) => u.custom && u.login_id === idv);
    if (!found) { S.authError = S.mode === "connecting" ? "저장소에 연결하는 중이에요. 잠시 뒤 다시 해주세요." : "없는 아이디예요."; return render(); }
    if (found[1].pw_hash !== await hash(idv + ":" + pw)) { S.authError = "비밀번호가 맞지 않아요."; return render(); }
    return login(found[0]);
  }
  if (f.id === "signup-form") {
    if (!S.canWrite) { S.authError = "보기 전용 화면이라 가입할 수 없어요."; return render(); }
    const v = id => document.getElementById(id).value.trim();
    const loginId = v("su-id").toLowerCase(), pw = document.getElementById("su-pw").value, nick = v("su-nick");
    const gender = document.getElementById("su-g-f").checked ? "F" : "M";
    const wantSel = document.getElementById("su-w-s").checked ? "same" : document.getElementById("su-w-b").checked ? "both" : "other";
    const birth = v("su-birth"), region = REGIONS.find(r => r[0] === v("su-region")), su = S.signup;
    let err = "";
    if (!/^[a-z0-9]{4,16}$/.test(loginId)) err = "아이디는 영문 소문자와 숫자 4~16자로 만들어주세요.";
    else if (BASE.profiles.some(p => p.login_id === loginId) || Object.values(S.users).some(u => u.custom && u.login_id === loginId)) err = "이미 있는 아이디예요.";
    else if (pw.length < (S.fb ? 6 : 4)) err = `비밀번호는 ${S.fb ? 6 : 4}자 이상이어야 해요.`;
    else if (!nick) err = "닉네임을 입력해주세요.";
    else if (!birth || calcAge(birth) < 19) err = "만 19세 이상만 가입할 수 있어요.";
    else if (!su.tags.length) err = "관심사를 1개 이상 골라주세요.";
    else if (LIFE.some(f => !v("su-" + f))) err = "생활 패턴을 모두 골라주세요. (" + LIFE.filter(f => !v("su-" + f)).map(f => FIELD_KO[f]).join(", ") + ")";
    else if (!document.getElementById("su-pub-y").checked && !document.getElementById("su-pub-n").checked) err = "검색 공개 여부를 골라주세요.";
    else if (!document.getElementById("su-agree").checked) err = "이용약관과 개인정보 처리방침에 동의해야 가입할 수 있어요.";
    if (err) { S.authError = err; return render(); }
    const age = calcAge(birth), other = gender === "M" ? "F" : "M";
    const amin = Math.max(19, +v("su-amin") || age - 4), amax = Math.max(amin, +v("su-amax") || age + 4);
    let uid = "n" + Date.now().toString(36);
    if (S.fb) {
      try { const cred = await S.fb.auth().createUserWithEmailAndPassword(emailOf(loginId), pw); uid = cred.user.uid; }
      catch (e) {
        let reused = false;
        if (String(e && e.code).includes("email-already-in-use")) {
          try {
            const cred = await S.fb.auth().signInWithEmailAndPassword(emailOf(loginId), pw);
            if (!(await ownDocExists(cred.user.uid))) { uid = cred.user.uid; reused = true; }
            else await S.fb.auth().signOut();
          } catch (e2) { /* 다른 사람 아이디 */ }
        }
        if (!reused) { S.authError = authErr(e); return render(); }
      }
    }
    const profile = {
      nickname: nick, gender, birth_date: birth, region: region[0], lat: region[1], lng: region[2],
      job: v("su-job") || "비공개", height: +v("su-height") || null, bio: "", interests: [...su.tags], interest_level: { ...su.lv }, favorite_tag: favOf(su), mbti: "",
      ...Object.fromEntries(LIFE.map(f => [f, v("su-" + f)])),
      purpose: v("su-purpose"), searchable: document.getElementById("su-pub-y").checked,
      appearance: { hair: "medium", eyelid: "double", glasses: false, style: "casual" },
      preference: { gender: wantSel === "same" ? [gender] : wantSel === "both" ? ["M", "F"] : [other], age_min: amin, age_max: amax,
        max_distance_km: +v("su-dist") || 15, distance_importance: +v("su-dimp") || 2, conditions: {}, appearance: {} },
    };
    saveUser(uid, { custom: true, ...(S.fb ? {} : { login_id: loginId, pw_hash: await hash(loginId + ":" + pw) }), profile, photo: su.photo, created: Date.now(), agreed: { terms: TERMS_DATE, at: Date.now() } });
    const hadPhoto = !!su.photo;
    S.signup = { tags: [], lv: {}, photo: null };
    login(uid);
    if (!hadPhoto) { S.tab = "me"; render(); }
    toast(hadPhoto ? "가입했어요. 오늘의 추천을 확인해보세요" : "가입했어요. 사진을 올리면 다른 사람 추천에도 나와요");
    return;
  }
  if (f.id === "me-form") {
    if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
    const me = world().byId[S.uid], d = S.draft;
    if (!d.tags.length) return toast("관심사를 1개 이상 골라주세요");
    const g = id => document.getElementById(id).value;
    const amin = Math.max(19, +g("me-amin") || 19), amax = Math.max(amin, +g("me-amax") || amin);
    const region = REGIONS.find(r => r[0] === g("me-region"));
    const conditions = { ...(me.preference.conditions || {}) };
    if (document.getElementById("me-nosmoke").checked) conditions.smoking = { value: "no", importance: 3 };
    else if (conditions.smoking?.importance === 3) delete conditions.smoking;
    const app = {};
    if (d.hair.length) app.hair = d.hair;
    if (d.style.length) app.style = d.style;
    const edits = {
      bio: g("me-bio").trim(), job: g("me-job").trim() || me.job, interests: [...d.tags], interest_level: { ...d.lv }, favorite_tag: favOf(d),
      ...(region ? { region: region[0], lat: region[1], lng: region[2] } : {}),
      ...Object.fromEntries(["purpose", "marriage_view", "contact_style", "chronotype", "weekend", "drinking", "smoking", "pet", "spending", "religion"].map(k => [k, g("me-" + k)])),
      appearance: { hair: g("me-hair"), eyelid: g("me-eyelid"), glasses: g("me-glasses") === "1", style: g("me-style") },
      preference: { ...me.preference, age_min: amin, age_max: amax, max_distance_km: Math.max(1, +g("me-dist") || 10), distance_importance: +g("me-dimp"), conditions, appearance: app },
    };
    saveUser(S.uid, { edits: { ...(S.users[S.uid]?.edits || {}), ...edits } });
    toast("프로필을 저장했어요");
    return;
  }
  if (f.id === "report-form") {
    const sel = [...document.querySelectorAll('input[name="rp-reason"]')].find(x => x.checked);
    if (!sel) { S.authError = "어떤 문제인지 골라주세요."; return render(); }
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    const target = S.report, alsoBlock = document.getElementById("rp-block").checked;
    sendReport(target, sel.value, document.getElementById("rp-detail").value.trim());
    if (alsoBlock && !blockedByMe(S.uid, target)) { setBlock(target, true); if (S.chat === target) S.chat = null; if (S.detail === target) S.detail = null; }
    S.report = null; S.authError = "";
    toast("신고를 접수했어요. 운영자가 확인할게요"); return;
  }
  if (f.id === "search-form") { S.q = document.getElementById("q").value; document.getElementById("q").blur(); render(); return; }
  if (f.id === "chat-form") {
    const inp = document.getElementById("chat-input"), text = inp.value.trim();
    if (!text) return;
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    inp.value = "";
    sendMsg(pk(S.uid, S.chat), S.uid, text);
    document.getElementById("chat-input")?.focus();
  }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "verif-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    try { const url = await resizeImage(file, { max: 720, quality: 0.72 }); setVerif(S.uid, { uid: S.uid, src: url, pose: poseFor(S.uid), at: Date.now(), status: "pending" }); toast("인증 사진을 보냈어요. 운영자가 확인할게요"); }
    catch (err) { toast("이미지 파일만 올릴 수 있어요"); }
    return;
  }
  if (el.id === "chat-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    try { const url = await resizeImage(file, { max: 720, quality: 0.72 }); sendImage(pk(S.uid, S.chat), S.uid, url); }
    catch (err) { toast("이미지 파일만 보낼 수 있어요"); }
    return;
  }
  if (el.dataset && el.dataset.met) {
    if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
    setSignal(S.uid, el.dataset.met, { met: el.checked });
    toast(el.checked ? "만난 뒤의 마음을 표현할 수 있어요" : "만나기 전 단계로 돌렸어요");
    return;
  }
  if (el.id === "su-photo" || el.id === "me-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      const url = await shrinkPhoto(file);
      if (el.id === "su-photo") { S.signup.photo = url; render(); }
      else { if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요"); saveUser(S.uid, { photo: url }); toast("사진을 등록했어요"); }
    } catch (err) { toast("이미지 파일만 올릴 수 있어요"); }
    return;
  }
  if (el.id === "me-pub") {
    if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
    saveUser(S.uid, { edits: { ...(S.users[S.uid]?.edits || {}), searchable: el.checked } });
    toast(el.checked ? "검색에 공개했어요" : "검색에서 숨겼어요");
    return;
  }
  if (el.id === "set-related") { saveUser(S.uid, { settings: { ...plain(settingsOf(S.uid)), related: el.checked } }); return; }
  if (el.dataset.w) {
    const s = plain(settingsOf(S.uid));
    s.weights = { ...E.baseWeights(world().byId[S.uid], s) };
    s.weights[el.dataset.w] = +el.value;
    saveUser(S.uid, { settings: s });
  }
});
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") { const v = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = v; render(); }, 180); return; }
  const k = e.target.dataset?.w;
  if (!k) return;
  const ws = { ...E.baseWeights(world().byId[S.uid], settingsOf(S.uid)), [k]: +e.target.value };
  const sum = E.KEYS.reduce((t, kk) => t + ws[kk], 0) || 1;
  for (const kk of E.KEYS) { const lab = document.querySelector(`[data-wv="${kk}"]`); if (lab) lab.textContent = weightLabel(ws[kk], sum); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.legal || S.report || S.menu || S.notifOpen) { S.legal = S.report = S.menu = null; S.notifOpen = false; render(); } else if (S.lightbox) { S.lightbox = null; render(); } else if (S.admin && !S.chat && !S.detail) { S.admin = false; render(); } else if (S.chat) { S.chat = null; render(); } else if (S.detail) { S.detail = null; render(); } }
});

// ---------------- 시작 ----------------
function subscribe(db, fail) {
  const watch = (name, apply) => db.collection(name).onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    apply(m); changed(name === "users" || name === "blocks" || name === "moderation");
    if (name === "signals") scheduleLearning();
  }, fail);
  watch("users", m => { S.users = m; S.usersLoaded = true; });
  watch("likes", m => { S.likes = m; });
  watch("chatimgs", m => { S.imgs = { ...S.imgs, ...m }; });
  watch("signals", m => { S.signals = m; });
  watch("chats", m => { S.chats = m; });
  watch("blocks", m => { S.blocks = m; ver++; });
  watch("reports", m => { S.reports = m; });
  watch("moderation", m => { S.mod = m; ver++; });
  watch("verifications", m => { S.verifs = m; });
}
// Firebase: 회원 프로필은 전체(추천 계산용), 좋아요·마음 표현·채팅·사진은 내가 당사자인 것만 받아요
function subscribeFB(uid) {
  S.subscribed = true;
  const db = S.db;
  const fail = e => { console.warn(e); if (e && e.code === "permission-denied") toast("데이터를 불러올 권한이 없어요. 다시 로그인해주세요"); };
  const parts = {};
  const merged = name => Object.assign({}, ...Object.entries(parts).filter(([k]) => k.startsWith(name + ":")).map(([, v]) => v));
  const watch = (key, q, apply, recalc) => q.onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    parts[key] = m; apply(key.split(":")[0]); changed(recalc);
  }, fail);
  watch("users:all", db.collection("users"), () => { S.users = merged("users"); S.usersLoaded = true; }, true);
  watch("likes:from", db.collection("likes").where("from", "==", uid), n => { S.likes = merged(n); });
  watch("likes:to", db.collection("likes").where("to", "==", uid), n => { S.likes = merged(n); });
  watch("signals:from", db.collection("signals").where("from", "==", uid), n => { S.signals = merged(n); scheduleLearning(); });
  watch("signals:to", db.collection("signals").where("to", "==", uid), n => { S.signals = merged(n); });
  watch("blocks:from", db.collection("blocks").where("from", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("blocks:to", db.collection("blocks").where("to", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("moderation:all", db.collection("moderation"), n => { S.mod = merged(n); }, true);
  // 내 사진 인증 상태, 관리자 여부
  db.doc("verifications/" + uid).get().then(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; if (ok) { S.myVerif = sn.data(); render(); } }).catch(() => {});
  db.doc("admins/" + uid).get().then(sn => {
    const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists;
    if (!ok) return;
    S.isAdmin = true; render();
    watch("reports:all", db.collection("reports"), n => { S.reports = merged(n); });
    watch("verifications:all", db.collection("verifications"), n => { S.verifs = merged(n); });
  }).catch(() => {});
  db.doc("priv/" + uid).onSnapshot(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; S.priv = ok ? sn.data() : {}; S.privLoaded = true; render(); }, fail);
  watch("chats:mine", db.collection("chats").where("pair", "array-contains", uid), n => { S.chats = merged(n); });
  watch("chatimgs:mine", db.collection("chatimgs").where("pair", "array-contains", uid), n => { S.imgs = { ...S.imgs, ...merged(n) }; });
}
async function init() {
  const fb = FB();
  if (fb) {
    S.fb = fb; S.booting = true; S.mode = "connecting"; render();
    let user = null;
    try {
      user = await new Promise(res => { const un = fb.auth().onAuthStateChanged(u => { un(); res(u); }); });
      S.db = fb.firestore(); S.mode = "db";
      if (user && user.isAnonymous) { await fb.auth().signOut(); user = null; }   // 예전 버전의 익명 세션 정리
      if (user) {
        if (await ownDocExists(user.uid)) { S.booting = false; login(user.uid); return; }
        await fb.auth().signOut().catch(() => {});   // 초기화로 프로필이 없어진 옛 계정
      }
    } catch (e) { S.mode = "memory"; S.authError = "로그인 서버에 연결하지 못했어요. 잠시 뒤 다시 들어와주세요."; }
    S.uid = null; ls.set("gm-uid", null); S.booting = false; render();
    return;
  }
  render();
  const c = window.claude;
  S.isAdmin = true;   // 시연판: 누구나 관리자 화면을 볼 수 있음
  if (!c || typeof c.use !== "function") { S.mode = "memory"; render(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) {}
  if (user) { try { if (await user.can("data.write") === false) S.canWrite = false; } catch (e) {} }
  if (!db) { S.mode = "memory"; render(); return; }
  S.db = db; S.mode = "db";
  subscribe(db, e => { if (e && e.code === "revoked") { S.db = null; S.mode = "memory"; render(); } });
  render();
}
init();
