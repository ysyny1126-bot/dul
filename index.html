// 지도 (Leaflet + OpenStreetMap 바탕 지도). 핫플 화면을 처음 열 때만 불러오고,
// 화면을 다시 그려도 지도는 그대로 두고 자리만 옮겨 붙임 (깜빡임·타일 재로딩 없이)
let LMAP = null, mapEl = null, mapKey = "";
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return loadLeaflet.p || (loadLeaflet.p = new Promise((ok, fail) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = ok; js.onerror = () => { loadLeaflet.p = null; fail(); }; document.head.appendChild(js);
  }));
}
function mountHotMap() {
  const slot = document.getElementById("hot-map"), c = S.hotCtx;
  if (!slot || !c) return;
  if (!mapEl) { mapEl = document.createElement("div"); mapEl.className = "hot-map"; mapEl.setAttribute("aria-label", "두 사람 위치와 추천 핫플 지도"); }
  slot.replaceWith(mapEl);
  loadLeaflet().then(() => {
    if (!mapEl.isConnected) return;
    if (!LMAP) {
      LMAP = L.map(mapEl, { zoomControl: false, scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(LMAP);
      LMAP.dul = L.layerGroup().addTo(LMAP);
    }
    LMAP.invalidateSize();
    const { me, o, picks, sel } = c, key = [me.id, o.id, picks.map(h => h.id).join(","), sel].join("|");
    if (key === mapKey) return;
    const moved = !mapKey.startsWith([me.id, o.id, picks.map(h => h.id).join(",")].join("|"));
    mapKey = key;
    const g = LMAP.dul; g.clearLayers();
    const pin = (ll, html, cls, size, z) => L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="mpin ${cls}">${html}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }), zIndexOffset: z, keyboard: false }).addTo(g);
    L.polyline([[me.lat, me.lng], [o.lat, o.lng]], { color: "#8E91EE", weight: 2, dashArray: "4 6", interactive: false }).addTo(g);
    pin([me.lat, me.lng], esc(me.nickname[0]), "who me", 30, 1500);   // 두 사람 핀은 핫플 핀에 가려지지 않게 맨 위
    pin([o.lat, o.lng], esc(o.nickname[0]), "who them", 30, 1500);
    picks.forEach((h, i) => pin([h.lat, h.lng], `${h.e}<b>${S.hotPage % Math.ceil(HOTSPOTS.length / 3) * 3 + i + 1}</b>`, "spot" + (i === sel ? " on" : ""), 42, i === sel ? 1000 : 500)
      .on("click", () => { S.hotSel = i; render(); }));
    if (moved) LMAP.fitBounds([[me.lat, me.lng], [o.lat, o.lng], ...picks.map(h => [h.lat, h.lng])], { padding: [40, 40], maxZoom: 14 });
    else LMAP.panTo([picks[sel].lat, picks[sel].lng]);
  }).catch(() => { mapEl.innerHTML = `<div class="map-off">지도를 불러오지 못했어요.<br>아래 네이버 지도·카카오맵 버튼으로 볼 수 있어요.</div>`; });
}

// 8차원 좌표를 2차원 지도로: 점 사이 거리가 가까울수록 취향이 비슷해요
function tasteMap(me, qv, pool, topIds) {
  const people = [me, ...pool];
  const pr = E.project2D(people.map(E.personVec));
  const qp = pr.comps.map(u => qv.reduce((s2, x, i) => s2 + (x - pr.mean[i]) * u[i], 0));
  const all = [...pr.points, qp];
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const W = 340, H = 220, P = 28;
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sx = x => P + (x - minX) / ((maxX - minX) || 1) * (W - 2 * P);
  const sy = y => P + (y - minY) / ((maxY - minY) || 1) * (H - 2 * P);
  const Q = [sx(qp[0]), sy(qp[1])];
  let lines = "", dots = "", labels = "";
  people.forEach((o, i) => {
    const [x, y] = [sx(pr.points[i][0]), sy(pr.points[i][1])];
    const isMe = i === 0, top = topIds.includes(o.id);
    if (top) lines += `<line x1="${Q[0].toFixed(1)}" y1="${Q[1].toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="m-line"/>`;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isMe || top ? 6 : 4}" class="${isMe ? "m-me" : top ? "m-top" : "m-dot"}"/>`;
    if (isMe || top) labels += `<text x="${(x + 9).toFixed(1)}" y="${(y + 4).toFixed(1)}" class="m-lab${isMe ? " me" : ""}">${esc(isMe ? "나" : o.nickname)}</text>`;
  });
  const star = `<path d="M${Q[0]} ${Q[1] - 9} l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6-4.6-4.1 6.1-.6z" class="m-q"/><text x="${(Q[0] + 11).toFixed(1)}" y="${(Q[1] + 4).toFixed(1)}" class="m-lab q">검색어</text>`;
  return `<section class="panel map"><div class="map-head"><b>취향 지도</b><span class="muted">가까울수록 비슷한 취향 · 관심사 8개 축을 2차원으로 펼친 그림</span></div>
    <div class="map-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="검색어와 가까운 사람들의 취향 지도">${lines}${dots}${star}${labels}</svg></div>
    <div class="legend"><span><i class="lg m-q"></i>검색어</span><span><i class="lg m-top"></i>가장 가까운 3명</span><span><i class="lg m-me"></i>나</span><span><i class="lg m-dot"></i>공개한 다른 사람</span></div></section>`;
}
// 개발자 화면: 검색어와 1위의 좌표를 축별로 비교
function axisTable(qv, o) {
  const pv = E.personVec(o);
  const norm = v => { const m = Math.max(...v) || 1; return v.map(x => x / m); };
  const a = norm(qv), b = norm(pv);
  return `<div class="devbox"><h4>개발자 화면 · 좌표 비교 (가장 큰 값을 1로 맞춤)</h4>
    <div class="axes">${E.AXES.map((ax, i) => `<span class="ax-l">${ax}</span><span class="ax-b q"><i style="width:${Math.round(a[i] * 100)}%"></i></span><span class="ax-b p"><i style="width:${Math.round(b[i] * 100)}%"></i></span>`).join("")}</div>
    <div class="legend"><span><i class="lg m-q"></i>검색어</span><span><i class="lg m-top"></i>${esc(o.nickname)}</span></div>
    <div class="formula">코사인 유사도 = (검색어 · 사람) ÷ (|검색어| × |사람|) = ${E.cosine(qv, pv).toFixed(3)}</div></div>`;
}

function emptyRecs(total, rej) {
  if (total) return `<div class="empty">${EMPTY_ART}<b>추천을 모두 확인했어요</b>넘긴 사람을 다시 보거나 설정을 바꿔보세요.</div>`;
  const s = settingsOf(S.uid);
  const tagN = rej.R7, distN = rej.R4;
  const others = world().list.filter(p => p.id !== S.uid).length;
  const anyRej = ["R1", "R2", "R3", "R4", "R5", "R6", "R7"].some(k => rej[k]);
  if (!anyRej) return `<div class="empty">${EMPTY_ART}<b>아직 가입한 사람이 적어요</b>${others ? "조건이 맞는 회원이 생기면 바로 추천해드릴게요." : "첫 번째 회원이에요! 친구에게 둘을 알려주세요."}</div>`;
  let tip = "원하는 상대 조건을 조금 넓혀보세요.";
  const rx = relaxHtml(world().byId[S.uid], false);
  if (rx) return `<div class="empty">${EMPTY_ART}<b>지금은 맞는 사람이 없어요</b>이렇게 조건을 넓히면 바로 만날 수 있어요.${rx}</div>`;

async function deleteAccount() {

  const mine = col => Object.entries(col).filter(([, d]) => d && d.from === uid).map(([id]) => id);
  const likeIds = mine(S.likes), sigIds = mine(S.signals), blockIds = mine(S.blocks), afterIds = mine(S.afters);
  try {
    if (S.db) {
      for (const id of likeIds) await S.db.doc("likes/" + id).delete();
      for (const id of sigIds) await S.db.doc("signals/" + id).delete();
      for (const id of blockIds) await S.db.doc("blocks/" + id).delete();
      for (const id of afterIds) await S.db.doc("afters/" + id).delete();
      if (myVerif()) await S.db.doc("verifications/" + uid).delete().catch(() => {});
      if (S.fb) await S.db.doc("priv/" + uid).delete().catch(() => {});

    if (S.fb) {
      try { await S.fb.auth().currentUser.delete(); }
      catch (e) { await S.fb.auth().signOut().catch(() => {}); }

// 비워 두면 같은 주소의 /api (시연판을 AI 서버에서 열 때). 배포판은 build_deploy.py가 DUL_AI_URL로 넣어 줌
const AI_URL = String(window.DUL_AI_URL || "").replace(/\/$/, "");
const aiState = slot => S.ai[slot] || {};
async function aiFetch(path, body) {
  const headers = { "Content-Type": "application/json" };
  const u = S.fb && S.fb.auth().currentUser;
  if (u) headers.Authorization = "Bearer " + await u.getIdToken();   // 서버가 로그인한 회원인지 확인
  let r;
  try { r = await fetch(`${AI_URL}/api/${path}`, { method: "POST", headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error("AI 서버에 연결하지 못했어요. AI 서버가 켜져 있는지 확인해주세요."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "AI가 답하지 못했어요. 잠시 뒤 다시 해주세요.");
  return j;
}
// 결과는 S.ai[slot]에 담아 두고 화면만 다시 그림 (같은 사람에게 다시 열면 그대로 보임)
async function aiRun(slot, path, body) {
  if (aiState(slot).loading) return;
  S.ai[slot] = { loading: true }; render();
  try { S.ai[slot] = { data: await aiFetch(path, body) }; }
  catch (e) { S.ai[slot] = { error: e.message }; }
  render();
}

const RISK = [
  { k: "money", label: "금전 요구", high: true, re: /(돈\s?(좀|을|이)?\s?(빌려|보내|부쳐|필요)|송금|입금|계좌|이체|급전|대출|병원비|수술비|합의금|보증금|상품권|기프트\s?카드|문상|빌려\s?줄)/ },
  { k: "invest", label: "투자 권유", high: true, re: /(투자|코인|비트코인|리딩\s?방|수익률|원금\s?보장|고수익|선물\s?거래|재테크|테더|usdt|거래소|마진)/i },
  { k: "threat", label: "협박·위협", high: true, re: /(가만\s?안\s?둬|가만\s?두지\s?않|죽여|유포|퍼뜨릴|퍼트릴|뿌릴\s?거|신상|찾아\s?갈|찾아간다|협박|두고\s?보자|후회하게)/ },
  { k: "personal", label: "개인정보 요구", high: true, re: /(주민\s?번호|인증\s?번호|비밀\s?번호|신분증|여권\s?사진|카드\s?번호|otp)/i },
  { k: "offsite", label: "앱 밖으로 연락 유도", high: false, re: /(텔레그램|위챗|왓츠앱|whatsapp|오픈\s?채팅|라인\s?아이디|https?:\/\/|bit\.ly)/i },
];
function riskScan(msgs, meId) {
  const hits = [];
  let run = 0, maxRun = 0;
  for (const m of msgs) {
    if (m.sig) continue;
    if (m.from === meId) { run = 0; continue; }
    maxRun = Math.max(maxRun, ++run);
    if (m.text) for (const r of RISK) if (r.re.test(m.text)) hits.push({ k: r.k, label: r.label, high: r.high, quote: m.text.slice(0, 100) });
  }
  if (maxRun >= 6) hits.push({ k: "repeat", label: "답 없이 이어지는 메시지", high: false, quote: `답장 없이 ${maxRun}개 연달아` });
  return hits;
}

    body = `${labels.length ? `<div class="notice${hits.some(h => h.high) ? " warn" : ""}" style="font-size:13px">자동 확인에서 눈에 띈 표현 · ${esc(labels.join(", "))}</div>` : `<span class="ai-note">자동 확인에서 눈에 띄는 표현은 없었어요.</span>`}
      <button class="btn sm" style="align-self:flex-start" data-act="ai-safety"${st.loading ? " disabled" : ""}>AI로 대화 점검하기</button>
      ${aiStatus(st)}
      ${d ? `<div><span class="lvl ${esc(d.level)}">${LEVEL_LABEL[d.level] || ""}</span>${esc(d.summary)}</div>
        ${d.signals.length ? `<b class="ai-sub">살펴볼 부분</b><ul class="ai-ul">${d.signals.map(s => `<li><b>${SIGNAL_KO[s.type] || "기타"}</b> · "${esc(s.quote)}"<br><span class="ai-note">${esc(s.why)}</span></li>`).join("")}</ul>` : ""}
        ${d.advice.length ? `<b class="ai-sub">이렇게 해 보세요</b><ul class="ai-ul">${d.advice.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${d.level !== "safe" ? `<div class="ai-row" style="flex-wrap:nowrap"><button class="btn sm${d.suggest === "none" ? " line" : ""}" data-act="ai-report" data-id="${o.id}">신고하기</button><button class="btn line sm" data-act="menu" data-id="${o.id}">차단하기</button></div>` : ""}` : ""}
      <span class="ai-note">AI 점검은 참고용이에요. AI가 상대를 사기꾼으로 단정하거나 자동으로 제재하지 않아요. 신고와 차단은 직접 정해주세요.</span>`;
  }
  return `<div class="ai-panel pad"><div class="sig-head"><b class="h">AI 도우미</b><button class="btn line sm" data-act="ai-open">닫기</button></div>${tabs}${body}</div>`;
}
// 위험 표현이 새로 보이면 입력창 위에 알림 (닫으면 그 개수까지는 다시 안 띄움)
function riskAlert(o, key, hits) {
  const high = hits.filter(h => h.high);
  if (!high.length || high.length <= (S.riskSeen[key] || 0)) return "";
  return `<div class="notice warn pad ai-alert" role="alert"><span>⚠ ${esc(o.nickname)}님 메시지에 ${esc([...new Set(high.map(h => h.label))].join(", "))}로 보일 수 있는 표현이 있어요. 돈을 보내거나 개인정보를 알려주기 전에 꼭 확인하세요.</span>
    <button class="btn sm" data-act="ai-safe-open">자세히</button><button class="btn line sm" data-act="ai-safe-hide" data-n="${high.length}">괜찮아요</button></div>`;
}

// ---------------- 렌더 ----------------
let lastScreen = "";
function render() {
  const app = document.getElementById("app");
  const authed = S.uid && world().byId[S.uid];
  const screen = authed ? `${S.tab}|${S.detail}|${S.chat}` : `auth|${S.authTab}`;
  const keep = {};
  if (screen === lastScreen) for (const el of app.querySelectorAll("input[id], textarea[id], select[id]")) {
    if (el.type === "file") continue;
    keep[el.id] = el.type === "checkbox" || el.type === "radio" ? { c: el.checked } : { v: el.value };
  }
  const active = document.activeElement?.id;
  const log = document.getElementById("chat-log");
  const nearBottom = log ? log.scrollHeight - log.scrollTop - log.clientHeight < 80 : true;
  const scrollY = window.scrollY;
  S.enter = screen !== lastScreen;
  if (authed && !isSuspended(S.uid)) checkNewMatch(world().byId[S.uid]);
  if (authed && S.fb && S.usersLoaded && !S.seenSaved && Date.now() - (S.users[S.uid]?.seenAt || 0) > 12 * 36e5) { S.seenSaved = true; setTimeout(() => saveUser(S.uid, { seenAt: Date.now() }), 0); }
  app.innerHTML = (authed ? (isSuspended(S.uid) ? suspendedView() : shell() + (S.hot ? hotView(world().byId[S.uid]) : "") + (S.celebrate ? celebrateView(world().byId[S.uid]) : "")) : authView()) + (S.legal ? legalView() : "") + (S.intro ? introView() : "");
  if (S.celebrate) { celebFx(S.celebrate.fresh); S.celebrate.fresh = false; }
  if (S.hot) mountHotMap();
  if (S.prefill != null) { const ci = document.getElementById("chat-input"); if (ci) { ci.value = S.prefill; S.prefill = null; ci.focus({ preventScroll: true }); } }
  if (authed && !isSuspended(S.uid)) browserNotify(world().byId[S.uid]);
  if (screen === lastScreen) {
    for (const [id, st] of Object.entries(keep)) { const el = document.getElementById(id); if (!el) continue; if ("c" in st) el.checked = st.c; else el.value = st.v; }
    window.scrollTo(0, scrollY);
  }
  if (active) { const el = document.getElementById(active); if (el && el.type !== "file") el.focus({ preventScroll: true }); }
  const nlog = document.getElementById("chat-log");
  if (nlog && (nearBottom || screen !== lastScreen)) nlog.scrollTop = nlog.scrollHeight;
  if (S.chat && authed) markRead(pk(S.uid, S.chat));
  lastScreen = screen;
  document.body.classList.toggle("locked", anyOpen());
  syncBack();
}
let toastTimer;
function toast(t) { S.toast = t; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600); }

function login(uid) {
  S.uid = uid; ls.set("gm-uid", uid);
  if (S.fb && !S.subscribed) subscribeFB(uid);
  S.tab = "home"; S.detail = null; S.chat = null; S.draft = null; S.authError = ""; S.sigOpen = false; S.q = "";
  render();
  window.scrollTo(0, 0);
}

// ---------------- 이벤트 ----------------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const me = S.uid;
  switch (act) {
    case "authtab": S.authTab = t.dataset.v; S.authError = ""; render(); break;
    case "demo": if (REAL) break;
      if (S.fb && S.fb.auth().currentUser && !S.fb.auth().currentUser.isAnonymous) { ls.set("gm-uid", id); S.fb.auth().signOut().finally(() => location.reload()); break; }
      login(id); break;
    case "tab": S.tab = t.dataset.v; S.detail = null; S.chat = null; S.sigOpen = false; if (t.dataset.v === "home" && S.tab === "home") S.q = S.q; render(); window.scrollTo(0, 0); break;
    case "dev": S.dev = !S.dev; ls.set("gm-dev", S.dev); render(); break;
    case "intro-next": introGo(1); break;
    case "intro-done": introDone(); break;
    case "theme": S.theme = darkNow() ? "light" : "dark"; ls.set("gm-theme", S.theme); applyTheme(); render(); break;
    case "theme-set": S.theme = t.dataset.v; ls.set("gm-theme", S.theme); applyTheme(); render(); break;
    case "open": S.detail = id; render(); break;
    case "close": S.detail = null; render(); break;
    case "openchat": S.chat = id; S.detail = null; S.sigOpen = false; render(); break;
    case "closechat": S.chat = null; S.sigOpen = false; S.planOpen = false; S.planMood = "auto"; S.planPage = 0; S.aiOpen = false; render(); break;
    // ---------- AI ----------
    case "ai-match": {
      const w = world(), o = w.byId[id]; if (!o) break;
      const r = full(me, w.lists[me].recs.find(x => x.id === id));
      aiRun("match:" + pk(me, id), "match-insight", { me: aiPerson(w.byId[me]), other: aiPerson(o, w.byId[me]),
        reasons: r ? r.reasons.map(reasonText).filter(Boolean).slice(0, 12) : [], score: r ? Math.round(r.score) : null });
      break;
    }
    case "ai-open": S.aiOpen = !S.aiOpen; render(); break;
    case "ai-tab": S.aiTab = t.dataset.v; render(); break;
    case "ai-tone": S.aiTone = t.dataset.v; render(); break;
    case "ai-reply": case "ai-topics": case "ai-safety": {
      const w = world(), meP = w.byId[me], o = w.byId[S.chat]; if (!o) break;
      const key = pk(me, o.id), log = aiLog(meP, o), msgs = S.chats[key]?.messages || [];
      if (act === "ai-reply") aiRun("reply:" + key, "chat-coach", { me: aiPerson(meP), other: aiPerson(o, meP), messages: log, tone: S.aiTone,
        stale: !!msgs.length && Date.now() - msgs[msgs.length - 1].at > 864e5 });
      else if (act === "ai-topics") { const plan = msgs.filter(m => m.text?.startsWith("[데이트 제안]")).pop();
        aiRun("topics:" + key, "first-meet", { me: aiPerson(meP), other: aiPerson(o, meP), plan: plan ? plan.text.slice(0, 200) : "" }); }
      else { if (!log.some(m => m.who === "them")) return toast("아직 상대가 보낸 메시지가 없어요");
        aiRun("safety:" + key, "safety", { other_nickname: o.nickname, messages: log,
          rule_hits: riskScan(msgs, me).map(h => ({ label: h.label, quote: h.quote })).slice(0, 20) }); }
      break;
    }
    case "ai-use": { const inp = document.getElementById("chat-input"); if (inp) { inp.value = t.dataset.text; inp.focus(); } break; }
    case "ai-safe-open": S.aiOpen = true; S.aiTab = "safety"; render(); break;
    case "ai-safe-hide": S.riskSeen[pk(me, S.chat)] = +t.dataset.n; render(); break;
    case "ai-report": {
      const d = aiState("safety:" + pk(me, id)).data;
      const top = d?.signals.find(s => s.type in SIGNAL_REASON);
      S.reportPreset = top ? SIGNAL_REASON[top.type] : REPORT_REASONS.length - 1;
      S.reportDetail = d ? `[AI 점검 참고] ${d.summary}`.slice(0, 500) : "";
      S.report = id; S.authError = ""; render(); break;
    }
    case "ai-bio": {
      const kw = document.getElementById("me-bio-kw")?.value.trim() || "", cur = document.getElementById("me-bio")?.value.trim() || "";
      if (!kw && !cur) return toast("키워드나 경험을 조금 적어주세요");
      aiRun("bio", "profile-bio", { me: aiPerson(world().byId[me]), keywords: kw, current: cur });
      break;
    }
    case "ai-bio-use": { const ta = document.getElementById("me-bio"); if (ta) { ta.value = t.dataset.text; ta.focus(); } break; }
    case "ai-plan": {
      const w = world(), meP = w.byId[me], o = w.byId[S.chat]; if (!o) break;
      const pl = meetPlan(meP, o, S.planMood), v = x => document.getElementById(x)?.value || "";
      const keywords = [...new Set(pl.courses.slice(0, 4).flatMap(c => c.steps.map(st => st.split("|")[1]).filter(Boolean)))].slice(0, 6);
      aiRun("plan:" + pk(me, o.id), "date-plan", { me: aiPerson(meP), other: aiPerson(o, meP), area: pl.area,
        lat: (meP.lat + o.lat) / 2, lng: (meP.lng + o.lng) / 2, budget: v("ai-budget"), date: v("ai-date"), time: v("ai-time"),
        mood: MOODS.find(m => m[0] === S.planMood)[1], request: v("ai-req").trim(), keywords, no_drink: pl.noDrink });
      break;
    }
    case "ai-plan-send": {
      const o = world().byId[S.chat], d = o && aiState("plan:" + pk(me, o.id)).data; if (!d) break;
      const route = d.steps.map(s => s.place?.name || s.activity).join(" → ");
      const when = [document.getElementById("ai-date")?.value, d.steps[0]?.time].filter(Boolean).join(" ");
      sendMsg(pk(me, o.id), me, `[데이트 제안] ${d.area} 근처 '${d.title}' 코스 어때요? ${route}${when ? " · " + when : ""}`.slice(0, 500));
      S.planOpen = false; toast("데이트 코스를 제안했어요"); break;
    }
    case "lightbox": { const im = S.imgs[t.dataset.img]; if (im) { S.lightbox = im.src; render(); } break; }
    case "closelb": S.lightbox = null; render(); break;
    case "sigopen": S.sigOpen = !S.sigOpen; render(); break;
    case "sig": {
      if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      if (!isMatched(me, id)) return toast("매칭된 사람에게만 마음을 표현할 수 있어요");
      const k = t.dataset.k, cur = sigOf(me, id)?.kind;
      if (cur === k) { setSignal(me, id, { kind: null }); scheduleLearning(); toast("마음 표현을 취소했어요"); break; }
      setSignal(me, id, { kind: k }); scheduleLearning();
      sendMsg(pk(me, id), me, "", { sig: k });
      const th = sigOf(id, me)?.kind;
      toast(th === k && (k === "again" || k === "meet") ? (k === "again" ? "애프터 성사! 다시 만나요" : "두 분 모두 만나보고 싶어해요") : `'${SIG[k]}'를 전했어요`);
      break;
    }
    case "simopen": simOpen(world().byId[me]); S.detail = null; render(); break;
    case "simclose": S.sim = null; render(); break;
    case "simreset": simOpen(world().byId[me]); render(); break;
    case "simpreset": { const p = world().byId[me]; S.sim.W = { ...(presetWeights(t.dataset.v, p) || E.baseWeights(p, null)) }; render(); break; }
    case "simsave": {
      if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      saveUser(me, { settings: { ...plain(settingsOf(me)), weights: { ...S.sim.W } } });
      S.sim = null; S.tab = "home"; render(); window.scrollTo(0, 0);
      toast("새 기준으로 오늘의 추천을 다시 골랐어요");
      break;
    }
    case "after": {
      if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      if (!isMatched(me, id) || !metWith(me, id)) return toast("실제로 만난 사람에게만 남길 수 있어요");
      const v = t.dataset.v;
      setAfter(id, v);
      toast(v === "yes" ? (afterOf(id, me)?.ans === "yes" ? "애프터 성사! 두 분 모두 또 만나고 싶어해요" : "남겼어요. 상대도 같은 답이면 알려드릴게요") : "남겼어요. 상대에게는 알리지 않아요");
      break;
    }
    case "like": {
      if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
      const on = !liked(me, id);
      if (on && matchesOf(me).length >= MATCH_CAP) return toast(`지금 ${MATCH_CAP}명과 대화 중이에요. 한 명과 대화를 마치면 새 좋아요를 보낼 수 있어요`);
      const note = on && t.closest(".sheet") ? (document.getElementById("like-note")?.value.trim() || "") : "";
      setLike(me, id, on, note);
      if (on && !liked(id, me)) { toast(note ? "한마디와 함께 좋아요를 보냈어요" : "좋아요를 보냈어요"); botLikeBack(me, id); }   // 서로 좋아요면 매칭 성사 화면이 떠요
      break;
    }
    case "celeb-close": S.celebrate = null; render(); break;
    case "hotopen": S.celebrate = null; S.hot = id; S.hotSel = 0; S.hotPage = 0; S.chat = id; S.detail = null; render(); break;
    case "hotclose": S.hot = null; render(); break;
    case "hotsel": S.hotSel = +t.dataset.i; render(); break;
    case "hotmore": S.hotPage++; S.hotSel = 0; render(); break;
    case "hotpropose": {
      const c = S.hotCtx, h = c && c.picks.find(x => x.id === id); if (!h) break;
      if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
      sendMsg(pk(me, c.o.id), me, `[핫플 제안] ${h.n} 어때요? ${h.line}`, { hot: h.id, q: h.query });
      S.hot = null; S.chat = c.o.id; toast("핫플을 제안했어요"); botAnswer(me, c.o.id); break;
    }
    case "celeb-chat": { const o = world().byId[id], r0 = world().lists[me].recs.find(x => x.id === id);   // 첫 인사 추천 하나를 입력창에 미리 넣어 둠
      if (!(S.chats[pk(me, id)]?.messages || []).length) S.prefill = openersFor(world().byId[me], o, r0 ? full(me, r0) : null)[0] || "";
      S.celebrate = null; S.chat = id; S.detail = null; render(); break; }

let qTimer;

// 맨 위에 열린 것 하나 닫기 (Esc, 핸드폰 뒤로 가기 공통)
function closeTop() {
  if (S.intro) { introDone(); return true; }
  if (S.celebrate) S.celebrate = null;
  else if (S.hot) S.hot = null;
  else if (S.sim) S.sim = null;
  else if (S.legal || S.report || S.menu || S.notifOpen) { S.legal = S.report = S.menu = null; S.notifOpen = false; S.menuEnd = false; }
  else if (S.lightbox) S.lightbox = null;
  else if (S.admin && !S.chat && !S.detail) S.admin = false;
  else if (S.chat) S.chat = null;
  else if (S.detail) S.detail = null;
  else return false;
  render();
  return true;
}
const anyOpen = () => !!S.intro || !!(S.uid && (S.celebrate || S.hot || S.sim || S.legal || S.report || S.menu || S.notifOpen || S.lightbox || S.admin || S.chat || S.detail));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTop(); else if (S.intro && (e.key === "ArrowRight" || e.key === "ArrowLeft")) introGo(e.key === "ArrowRight" ? 1 : -1); });
let introX = null;
document.addEventListener("touchstart", e => { introX = S.intro && e.target.closest(".intro") ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener("touchend", e => { if (introX == null) return; const dx = e.changedTouches[0].clientX - introX; introX = null; if (Math.abs(dx) > 50) introGo(dx < 0 ? 1 : -1); });

// 안드로이드 뒤로 가기: 시트가 열려 있으면 앱을 나가지 않고 시트만 닫음
// 시트가 열릴 때 방문 기록을 하나 쌓고, 뒤로 가기(popstate)가 오면 맨 위 시트를 닫음
let backPushed = false, skipPop = false;
function syncBack() {
  try {
    const open = anyOpen();
    if (open && !backPushed) { history.pushState({ dulSheet: 1 }, ""); backPushed = true; }
    else if (!open && backPushed) { backPushed = false; skipPop = true; history.back(); }   // X 버튼으로 닫았으면 쌓아 둔 기록도 지움
  } catch (e) { /* 기록을 못 쓰는 곳(미리보기 등)에서는 그냥 둠 */ }
}
window.addEventListener("popstate", () => {
  if (skipPop) { skipPop = false; return; }
  backPushed = false;
  closeTop();   // 아직 열린 시트가 남으면 render → syncBack이 기록을 다시 쌓음
});

// 키보드가 올라오면 실제로 보이는 높이를 CSS 변수로 (아이폰은 키보드가 화면을 덮어서)
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const r = document.documentElement.style;
    r.setProperty("--vvh", vv.height + "px");
    r.setProperty("--vvt", vv.offsetTop + "px");
    const log = document.getElementById("chat-log");
    if (log && document.activeElement?.closest?.(".composer")) log.scrollTop = log.scrollHeight;   // 입력 중이면 마지막 메시지가 보이게
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  fit();
}

// ---------------- 움직이는 배경 (WebGL) ----------------
// 오로라처럼 천천히 흐르는 파스텔 빛 + 반짝이, 손가락이 닿는 곳에 빛이 따라옴. 게임 엔진 없이 셰이더 하나로 (몇 KB).
// 화면 해상도의 절반으로 초당 30번까지만 그리고, 탭이 안 보이면 멈춤. '동작 줄이기' 설정이면 한 장만. WebGL이 없으면 원래 그라데이션.
(function bgGL() {
  if (matchMedia("(max-width: 560px)").matches) return;
  const cv = document.createElement("canvas"); cv.id = "bg-gl"; cv.setAttribute("aria-hidden", "true");
  let gl = null; try { gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" }); } catch (e) {}
  if (!gl) return;
  const FS = `precision mediump float;
uniform vec2 r; uniform float t; uniform vec2 p; uniform vec3 c1, c2, c3, bg;
float h(vec2 q) { return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 q) { vec2 i = floor(q), f = fract(q); f = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 q) { float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * n(q); q *= 2.03; a *= .5; } return s; }
void main() {
  vec2 uv = gl_FragCoord.xy / r, q = uv * vec2(r.x / r.y, 1.) * 1.7;
  float tt = t * .05;
  vec2 w = vec2(fbm(q + tt), fbm(q + vec2(5.2, 1.3) - tt));
  float f = fbm(q + 2.2 * w + vec2(tt * .7, -tt * .4));
  vec3 col = mix(c1, c2, smoothstep(.25, .8, f));
  col = mix(col, c3, smoothstep(.5, .95, w.y) * .8);
  vec2 d = (uv - p) * vec2(r.x / r.y, 1.);
  col += c3 * .35 * exp(-dot(d, d) * 9.);
  vec2 cell = gl_FragCoord.xy / (34. * r.y / 900.), id = floor(cell), fr = fract(cell) - .5;
  float s = h(id), tw = step(.975, s) * (.5 + .5 * sin(t * 1.7 + s * 60.));
  col += tw * smoothstep(.16, 0., length(fr)) * .7;
  gl_FragColor = vec4(mix(bg, col, .8), 1.);
}`;
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; for (const k of ["r", "t", "p", "c1", "c2", "c3", "bg"]) U[k] = gl.getUniformLocation(pr, k);
  // 라이트: 라벤더·연핑크·인디고 / 다크: 남색·자주·보라
  const PAL = { light: [[.80, .79, 1], [.98, .80, .88], [.55, .57, .94], [.95, .95, 1]], dark: [[.13, .14, .40], [.33, .15, .32], [.40, .42, .90], [.05, .05, .13]] };
  const isDark = () => { const th = document.documentElement.dataset.theme; return th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let px = .5, py = .7, tx = .5, ty = .7, last = 0;
  const aim = e => { tx = e.clientX / innerWidth; ty = 1 - e.clientY / innerHeight; };
  addEventListener("pointermove", aim, { passive: true }); addEventListener("pointerdown", aim, { passive: true });
  const t0 = performance.now();
  const draw = now => {
    px += (tx - px) * .05; py += (ty - py) * .05;
    const c = PAL[isDark() ? "dark" : "light"];
    gl.uniform2f(U.r, cv.width, cv.height); gl.uniform1f(U.t, (now - t0) / 1000); gl.uniform2f(U.p, px, py);
    gl.uniform3fv(U.c1, c[0]); gl.uniform3fv(U.c2, c[1]); gl.uniform3fv(U.c3, c[2]); gl.uniform3fv(U.bg, c[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  const fit = () => { const k = Math.min(devicePixelRatio || 1, 2) * .5; cv.width = Math.round(innerWidth * k); cv.height = Math.round(innerHeight * k); gl.viewport(0, 0, cv.width, cv.height); draw(performance.now()); };
  document.body.prepend(cv); document.documentElement.classList.add("gl");
  addEventListener("resize", fit); fit();
  if (reduce) { matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => draw(performance.now())); return; }
  const loop = now => { if (!document.hidden && now - last > 33) { last = now; draw(now); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();

// ---------------- 시작 ----------------
function subscribe(db, fail) {
  const watch = (name, apply) => db.collection(name).onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    apply(m); changed(name === "users" || name === "blocks" || name === "moderation");
    if (name === "signals" || name === "afters") scheduleLearning();
  }, fail);
  watch("users", m => { S.users = m; S.usersLoaded = true; });
  watch("likes", m => { S.likes = m; });
  watch("chatimgs", m => { S.imgs = { ...S.imgs, ...m }; });
  watch("signals", m => { S.signals = m; });
  watch("afters", m => { S.afters = m; });
  watch("chats", m => { S.chats = m; });
  watch("blocks", m => { S.blocks = m; ver++; });
  watch("reports", m => { S.reports = m; });
  watch("moderation", m => { S.mod = m; ver++; });
  watch("verifications", m => { S.verifs = m; });
}
// Firebase: 회원 프로필은 전체(추천 계산용), 좋아요·마음 표현·채팅·사진은 내가 당사자인 것만 받아요
function subscribeFB(uid) {
  S.subscribed = true;
  const db = S.db;
  const fail = e => { console.warn(e); if (e && e.code === "permission-denied") toast("데이터를 불러올 권한이 없어요. 다시 로그인해주세요"); };
  const parts = {};
  const merged = name => Object.assign({}, ...Object.entries(parts).filter(([k]) => k.startsWith(name + ":")).map(([, v]) => v));
  const watch = (key, q, apply, recalc) => q.onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    parts[key] = m; apply(key.split(":")[0]); changed(recalc);
  }, fail);
  watch("users:all", db.collection("users"), () => { S.users = merged("users"); S.usersLoaded = true; }, true);
  watch("likes:from", db.collection("likes").where("from", "==", uid), n => { S.likes = merged(n); });
  watch("likes:to", db.collection("likes").where("to", "==", uid), n => { S.likes = merged(n); });
  watch("signals:from", db.collection("signals").where("from", "==", uid), n => { S.signals = merged(n); scheduleLearning(); });
  watch("signals:to", db.collection("signals").where("to", "==", uid), n => { S.signals = merged(n); });
  // 애프터 체크: 내 답만 구독. 상대 답은 pollAfters()가 규칙이 허락할 때(둘 다 '예')만 가져옴
  watch("afters:from", db.collection("afters").where("from", "==", uid), n => { S.afters = { ...Object.fromEntries(Object.entries(S.afters).filter(([, a]) => a.from !== uid)), ...merged(n) }; scheduleLearning(); setTimeout(pollAfters, 0); });
  watch("blocks:from", db.collection("blocks").where("from", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("blocks:to", db.collection("blocks").where("to", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("moderation:all", db.collection("moderation"), n => { S.mod = merged(n); }, true);
  // 내 사진 인증 상태, 관리자 여부
  db.doc("verifications/" + uid).get().then(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; if (ok) { S.myVerif = sn.data(); render(); } }).catch(() => {});
  db.doc("admins/" + uid).get().then(sn => {
    const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists;
    if (!ok) return;
    S.isAdmin = true; render();
    watch("reports:all", db.collection("reports"), n => { S.reports = merged(n); });
    watch("verifications:all", db.collection("verifications"), n => { S.verifs = merged(n); });
  }).catch(() => {});
  db.doc("priv/" + uid).onSnapshot(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; S.priv = ok ? sn.data() : {}; S.privLoaded = true; render(); }, fail);
  watch("chats:mine", db.collection("chats").where("pair", "array-contains", uid), n => { S.chats = merged(n); });
  watch("chatimgs:mine", db.collection("chatimgs").where("pair", "array-contains", uid), n => { S.imgs = { ...S.imgs, ...merged(n) }; });
}
async function init() {
  const fb = FB();
  if (fb) {
    S.fb = fb; S.booting = true; S.mode = "connecting"; render();
    let user = null;
    try {
      user = await new Promise(res => { const un = fb.auth().onAuthStateChanged(u => { un(); res(u); }); });
      S.db = fb.firestore(); S.mode = "db";
      if (user && user.isAnonymous) { await fb.auth().signOut(); user = null; }   // 예전 버전의 익명 세션 정리
      if (user) {
        if (await ownDocExists(user.uid)) { S.booting = false; login(user.uid); return; }
        await fb.auth().signOut().catch(() => {});   // 초기화로 프로필이 없어진 옛 계정
      }
    } catch (e) { S.mode = "memory"; S.authError = "로그인 서버에 연결하지 못했어요. 잠시 뒤 다시 들어와주세요."; }
    S.uid = null; ls.set("gm-uid", null); S.booting = false; render();
    return;
  }
  render();
  const c = window.claude;
  S.isAdmin = true;   // 시연판: 누구나 관리자 화면을 볼 수 있음
  if (!c || typeof c.use !== "function") { S.mode = "memory"; render(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) {}
  if (user) { try { if (await user.can("data.write") === false) S.canWrite = false; } catch (e) {} }
  if (!db) { S.mode = "memory"; render(); return; }
  S.db = db; S.mode = "db";
  subscribe(db, e => { if (e && e.code === "revoked") { S.db = null; S.mode = "memory"; render(); } });
  render();
}
init();
</script>
