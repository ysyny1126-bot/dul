<script>
(function () {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
    addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return;   // 이미 앱으로 열었음
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!ios && !/Android/.test(ua)) return;   // 핸드폰에서만
  try { if (localStorage.getItem("dul-install-hide")) return; } catch (e) {}
  var deferred = null, box = null;
  function hide(forever) {
    if (box) { box.remove(); box = null; }
    if (forever) try { localStorage.setItem("dul-install-hide", "1"); } catch (e) {}
  }
  function show(text, btn) {
    if (box) return;
    box = document.createElement("div");
    box.setAttribute("role", "status");
    box.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:min(488px,calc(100% - 32px));z-index:15;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:18px;background:#1F2147;color:#FFFFFF;font:14px/1.45 Pretendard Variable,system-ui,sans-serif;box-shadow:0 10px 30px rgba(31,33,71,.35)";
    var t = document.createElement("span"); t.style.flex = "1"; t.textContent = text; box.appendChild(t);
    if (btn) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = btn;
      b.style.cssText = "border:0;border-radius:999px;padding:9px 16px;min-height:40px;background:#A3A6FF;color:#12132A;font:inherit;font-weight:700";
      b.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; hide(true); }); };
      box.appendChild(b);
    }
    var x = document.createElement("button"); x.type = "button"; x.textContent = "\u2715"; x.setAttribute("aria-label", "안내 닫기");
    x.style.cssText = "border:0;background:none;color:#C3C5FF;font-size:16px;min-width:40px;min-height:40px";
    x.onclick = function () { hide(true); };
    box.appendChild(x);
    document.body.appendChild(box);
  }
  // 안드로이드(크롬·삼성 인터넷): 브라우저가 설치 가능하다고 알려주면 설치 버튼
  addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; show("둘을 홈 화면에 설치하면 앱처럼 바로 열려요", "설치"); });
  addEventListener("appinstalled", function () { hide(true); });
  // 아이폰: 설치 버튼이 없어서 방법을 알려줌
  if (ios) addEventListener("load", function () { setTimeout(function () { show("아래 공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 쓸 수 있어요"); }, 1500); });
})();

<style>
/* Layout: 라벤더빛 바탕 위에 둥근 흰 카드. 주요 버튼·강조는 인디고 파스텔, 좋아요·고른 것은 파스텔 핑크. 선은 얇게, 그림자는 부드럽게. 로고만 필기체 */
:root {
  --bg: #ECEBFA;
  --bg-grad: linear-gradient(165deg, #F1F0FF 0%, #ECEBFA 55%, #FCEFF4 100%);
  --hero-grad: linear-gradient(180deg, #5B5FE0 0%, #7A7EEA 45%, #B7A6EE 75%, #F6C3D5 100%);
  --app: #F7F6FF;
  --surface: #FFFFFF;
  --paper: #F8F8FF;
  --ink: #1F2147;
  --muted: #64678A;
  --line: #E6E5F5;
  --stroke: #D5D4F0;
  --rose: #5B5FE0;
  --accent: #5B5FE0;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEEDFB;
  --heart: #D6336C;
  --heart-soft: #FFE3EC;
  --pink: #FFD3E2;
  --pink-ink: #A3214F;
  --mint: #8E91EE;
  --mint-deep: #3F43C4;
  --accent2: #4A4ED0;
  --accent2-soft: #EEEDFB;
  --lilac: #E7E6FB;
  --strip: #F6F5FF;
  --chip: #F1F0FC;
  --bubble-me: #FFD3E2;
  --bubble-them: #F0EFFA;
  --good: #1E7F53;
  --bad: #C93469;
  --bad-soft: #FFE6EF;
  --scrim: rgba(31, 33, 71, .38);
  --shadow: 0 6px 24px rgba(91, 95, 224, .12);
  --shadow-btn: 0 6px 16px rgba(91, 95, 224, .30);
  --font-logo: "Dancing Script", cursive;
  --font-display: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: var(--font-display);
  --font-body: var(--font-display);
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1024; --bg-grad: linear-gradient(165deg, #14152E 0%, #121331 55%, #1E1428 100%); --hero-grad: linear-gradient(180deg, #2E3190 0%, #45479E 50%, #6A4E8E 80%, #8A4F6E 100%);
    --app: #15172F; --surface: #1F2245; --paper: #1B1D3D; --ink: #ECEBFF; --muted: #A9ABD0; --line: #2F3260;
    --stroke: #43478A; --rose: #A3A6FF; --accent: #A3A6FF; --accent-ink: #12132A; --accent-soft: #2A2D5A; --heart: #FF8DB5; --heart-soft: #44263C;
    --pink: #5A2C45; --pink-ink: #FFC2D6; --mint: #8E91EE; --mint-deep: #C3C5FF; --accent2: #C3C5FF; --accent2-soft: #2A2D5A; --lilac: #2A2D5A; --strip: #23264D; --chip: #272A52;
    --bubble-me: #5A2C45; --bubble-them: #262950;
    --good: #7FD4A4; --bad: #FF8FA8; --bad-soft: #4A2634; --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 24px rgba(0, 0, 0, .35); --shadow-btn: 0 6px 16px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1024; --bg-grad: linear-gradient(165deg, #14152E 0%, #121331 55%, #1E1428 100%); --hero-grad: linear-gradient(180deg, #2E3190 0%, #45479E 50%, #6A4E8E 80%, #8A4F6E 100%);
  --app: #15172F; --surface: #1F2245; --paper: #1B1D3D; --ink: #ECEBFF; --muted: #A9ABD0; --line: #2F3260;
  --stroke: #43478A; --rose: #A3A6FF; --accent: #A3A6FF; --accent-ink: #12132A; --accent-soft: #2A2D5A; --heart: #FF8DB5; --heart-soft: #44263C;
  --pink: #5A2C45; --pink-ink: #FFC2D6; --mint: #8E91EE; --mint-deep: #C3C5FF; --accent2: #C3C5FF; --accent2-soft: #2A2D5A; --lilac: #2A2D5A; --strip: #23264D; --chip: #272A52;
  --bubble-me: #5A2C45; --bubble-them: #262950;
  --good: #7FD4A4; --bad: #FF8FA8; --bad-soft: #4A2634; --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 24px rgba(0, 0, 0, .35); --shadow-btn: 0 6px 16px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
b { font-weight: 700; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#app { max-width: 520px; min-height: 100%; margin: 0 auto; background: var(--app); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(91, 95, 224, .10); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 로고: 하트 + 필기체 dul */
.logo { display: flex; flex-direction: column; align-items: center; line-height: 1; color: var(--rose); }
.logo i { font-style: normal; font-size: 13px; line-height: 1; margin-bottom: -2px; }
.logo span { font-family: var(--font-logo); font-weight: 700; font-size: 30px; letter-spacing: .01em; }

/* 상단바 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--app) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px; }
.devsw { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 5px; }
.devsw .track { width: 26px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
.devsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); transition: left .15s; }
.devsw[aria-pressed="true"] { background: var(--accent2-soft); }
.devsw[aria-pressed="true"] .track { background: var(--rose); }
.devsw[aria-pressed="true"] .track::after { left: 12px; }

main { flex: 1; padding-block: 8px 108px; display: flex; flex-direction: column; gap: 16px; }
.screen-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.screen-title h2 { font-size: 24px; line-height: 1.35; }
.screen-title h2 .hrt { color: var(--heart); font-size: .8em; }
.screen-title .muted { font-size: 13px; }

/* 탭바 */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 6; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(91, 95, 224, .12); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar button { border: 0; background: none; padding: 11px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="true"] { color: var(--rose); font-weight: 700; }
.tabbar button[aria-current="true"] svg { fill: var(--rose); stroke: var(--rose); }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--heart); color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* 공통 */
.btn { border: 1px solid var(--rose); border-radius: 999px; padding: 12px 20px; font-weight: 700; cursor: pointer; background: var(--rose); color: var(--accent-ink); transition: transform .08s, box-shadow .15s; box-shadow: var(--shadow-btn); }
.btn:active { transform: translateY(1px); }
.btn.alt { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow); }
.btn.line { background: transparent; color: var(--rose); border-color: var(--stroke); box-shadow: none; }
.btn.heart { background: var(--heart); border-color: var(--heart); color: #FFFFFF; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.panel { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
.notice { border-radius: 16px; padding: 12px 14px; font-size: 14px; background: var(--accent-soft); border: 1px solid transparent; }
.notice.warn { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.notice.ok { background: var(--heart-soft); border-color: var(--heart); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 3px 11px; border-radius: 999px; background: var(--chip); color: var(--rose); }
.chip.hit { background: var(--rose); color: var(--accent-ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tgl { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.tgl.on { background: var(--rose); border-color: var(--rose); color: var(--accent-ink); font-weight: 700; }
.tgl.lv1 { background: var(--accent-soft); color: var(--rose); border-color: var(--stroke); }
.tgl.lv3 { background: var(--heart); border-color: var(--heart); color: #FFFFFF; }
.tgl .stars { font-size: 11px; letter-spacing: -1px; }
.grade { display: inline-block; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--lilac); color: var(--accent2); }
.grade.top { background: var(--heart-soft); color: var(--heart); }

/* 빈 화면 그림 */
.doodle { stroke: var(--stroke); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.doodle .fillh { fill: var(--heart-soft); }
.doodle .fillm { fill: var(--lilac); }

/* 사진 */
.ph { position: relative; overflow: hidden; background: var(--paper); display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .ini { font-weight: 800; color: #FFFFFF; opacity: .95; }
.ph.noimg { background: linear-gradient(150deg, #C9B8F2, #F5A9C2); }
.av { width: 46px; height: 46px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface), 0 2px 8px rgba(91, 95, 224, .2); }
.av .ini { font-size: 18px; }
.av.mini { width: 32px; height: 32px; }
.av.mini .ini { font-size: 13px; }

/* 인증 화면 */
.auth { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 18px; }
/* 첫 화면: 노을빛 그라데이션 + 도시 실루엣 */
.hero { position: relative; overflow: hidden; border-radius: 28px; background: var(--hero-grad); min-height: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px 16px 84px; text-align: center; color: #FFFFFF; box-shadow: var(--shadow); }
.hero .logo { color: #FFFFFF; }
.hero .logo i { font-size: 26px; margin-bottom: 0; }
.hero .logo span { font-size: 64px; text-shadow: 0 2px 16px rgba(120, 60, 120, .25); }
.hero p { margin: 0; font-size: 16px; line-height: 1.6; opacity: .95; }
.hero svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 92px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 9px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--rose); color: var(--accent-ink); }
form.f { display: flex; flex-direction: column; gap: 14px; }
.auth form.f { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 600; }
.fld > span small { font-weight: 400; color: var(--muted); }
.fld input[type=text], .fld input[type=password], .fld input[type=number], .fld input[type=date], .fld select, .fld textarea {
  width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 11px 14px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--stroke); outline: none; }
.fld textarea { resize: vertical; min-height: 70px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radios { display: flex; gap: 8px; flex-wrap: wrap; }
.radios label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.radios input { accent-color: var(--rose); }
.err { color: var(--bad); font-size: 13px; margin: 0; font-weight: 700; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.demo { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 16px; padding: 8px 10px; cursor: pointer; text-align: left; min-width: 0; box-shadow: var(--shadow); }
.demo .av { width: 32px; height: 32px; }
.demo .av .ini { font-size: 14px; }
.demo b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.photo-pick { display: flex; gap: 14px; align-items: center; }
.photo-pick .ph { width: 84px; height: 105px; border-radius: 18px; flex: none; }
.photo-pick .ph .ini { font-size: 34px; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* 추천 카드: 사진이 위를 꽉 채우고, 아래에 이름·근거·원형 버튼 */
.card { background: var(--surface); border-radius: 26px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.card .frame { position: relative; }
.card .ph { aspect-ratio: 6 / 5; max-width: 100%; }
.card .ph .ini { font-size: 96px; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.card-name { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card-name b { font-weight: 700; font-size: 21px; }
.round-acts { display: flex; justify-content: center; gap: 28px; padding-top: 4px; }
.rbtn { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); box-shadow: var(--shadow); transition: transform .1s; }
.rbtn:active { transform: scale(.94); }
.rbtn svg { width: 24px; height: 24px; }
.rbtn.like { background: var(--heart); border-color: var(--heart); color: #FFFFFF; box-shadow: var(--shadow-btn); }
.rbtn.like svg { fill: currentColor; }
.rbtn.like.on { background: var(--surface); color: var(--heart); border-color: var(--stroke); }
.reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.reasons li { padding-left: 22px; position: relative; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 12px; height: 10px; border: 2px solid var(--rose); border-top: 0; border-right: 0; transform: rotate(-45deg) scale(.8); }
.post-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--strip); padding: 8px 14px; }
.ph-tag { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(40, 30, 45, .45); border-radius: 999px; padding: 2px 9px; backdrop-filter: blur(4px); }
.post-strip .ico { border: 0; background: none; padding: 4px; cursor: pointer; color: var(--rose); display: grid; place-items: center; border-radius: 8px; }
.post-strip .ico svg { width: 22px; height: 22px; }
.post-strip .ico.on svg { fill: var(--heart); stroke: var(--heart); }
.post-strip .right { display: flex; gap: 2px; align-items: center; }
.post-strip .dots { color: var(--rose); letter-spacing: 2px; font-weight: 700; padding: 0 4px; }
.acts { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.devline { font-family: var(--font-mono); font-size: 12px; color: var(--mint-deep); background: var(--accent2-soft); border-radius: 8px; padding: 6px 10px; }
.state { font-size: 14px; font-weight: 700; color: var(--heart); }

.match-banner { border-radius: 24px; padding: 18px; background: linear-gradient(150deg, var(--surface), var(--heart-soft)); box-shadow: var(--shadow); border: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.match-banner .pair { display: flex; align-items: center; gap: 8px; }
.match-banner .heart { color: var(--heart); font-size: 20px; }
.match-banner h3 { font-size: 19px; }

/* 목록 */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.item:last-child { border-bottom: 0; }
.item .meta { flex: 1; min-width: 0; }
.item .meta b { display: block; }
.item .meta > span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .side { font-size: 12px; color: var(--muted); text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .unread { background: var(--heart); color: #FFFFFF; border-radius: 9px; min-width: 18px; padding: 0 6px; font-size: 11px; font-weight: 700; text-align: center; }
.sec h3 { font-size: 17px; margin-bottom: 2px; }
.via { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.via.auto { background: var(--heart-soft); color: var(--heart); }
.sigtag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--rose); white-space: nowrap; }
.sigtag.warm { background: var(--heart-soft); color: var(--heart); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.empty svg { width: 90px; height: auto; margin: 0 auto 8px; display: block; }

/* 시트 (상세, 채팅) */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--app); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet.full { height: calc(100% - env(safe-area-inset-top, 0px)); max-height: none; border-radius: 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head b { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.sheet-body { overflow-y: auto; padding-block: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.detail-frame { background: var(--surface); position: relative; }
.detail-ph { aspect-ratio: 4 / 5; max-width: 100%; max-height: 56vh; width: 100%; }
.detail-ph .ini { font-size: 120px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.facts .k { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.facts .v { font-size: 14px; }
.sheet-foot { background: var(--surface); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }

table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 11px; color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
td.note { color: var(--muted); }
tr.sum td { font-weight: 700; border-bottom: 0; }
tr.pen td { color: var(--bad); }
.sheet-wrap { overflow-x: auto; }
.formula { font-family: var(--font-mono); font-size: 12px; padding: 8px 10px; background: var(--paper); border-radius: 10px; margin-top: 8px; }
.devbox { background: var(--surface); border: 1px solid var(--mint); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.devbox h4 { margin: 0; font-size: 13px; color: var(--mint-deep); }

/* 마음 표현 */
.sig { background: var(--surface); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.sig-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sig-head b { font-size: 15px; }
.sig-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.sig-opt { border: 1px solid var(--stroke); background: var(--surface); color: var(--rose); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.sig-opt.on { background: var(--heart); border-color: var(--heart); color: #FFFFFF; }
.sig-opt.soft { border-color: var(--line); color: var(--muted); }
.sig-opt.soft.on { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.sig-their { font-size: 14px; }
.sig-their b { color: var(--heart); }
.sig-both { font-size: 14px; font-weight: 700; color: var(--heart); background: var(--heart-soft); border-radius: 14px; padding: 8px 12px; }
.metsw { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.metsw input { accent-color: var(--heart); }
.sig-mini { display: flex; flex-wrap: wrap; gap: 6px; }

/* 채팅 */
.log { flex: 1; overflow-y: auto; padding-block: 14px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 20px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--bubble-me); color: var(--ink); border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 6px; }
/* 상대 메시지는 프로필 사진과 같은 줄에 */
.msg-row { align-self: flex-start; display: flex; align-items: flex-end; gap: 8px; max-width: 86%; }
.msg-row .msg, .msg-row .msg-img { max-width: 100%; }
.msg-row .spacer { width: 32px; flex: none; }
.msg-time.them { margin-left: 40px; }
.msg-img { padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 62%; border-radius: 18px; overflow: hidden; }
.msg-img.me { align-self: flex-end; }
.msg-img.them { align-self: flex-start; }
.msg-img img { display: block; width: 100%; height: auto; max-height: 300px; object-fit: cover; }
.msg-img .loading { display: block; width: 160px; height: 120px; background: var(--paper); font-size: 12px; color: var(--muted); padding-top: 50px; text-align: center; }
.msg-time { font-size: 11px; color: var(--muted); }
.msg-time.me { align-self: flex-end; }
.msg-sys { align-self: center; font-size: 12px; color: var(--heart); background: var(--heart-soft); border-radius: 999px; padding: 3px 12px; font-weight: 700; }
.daysep { align-self: center; font-size: 11px; color: var(--muted); padding: 2px 12px; margin: 6px 0; background: var(--surface); border-radius: 999px; }
.composer { display: flex; gap: 8px; align-items: center; background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; background: var(--paper); }
.send { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--rose); color: #FFFFFF; display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-btn); }
.send svg { width: 19px; height: 19px; }
.attach { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; color: var(--muted); display: grid; place-items: center; cursor: pointer; background: var(--paper); }
.attach svg { width: 20px; height: 20px; }
.attach input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(15, 12, 30, .86); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

/* ---------- 추천 카드: 페르소나 카드 (A·B·C) ---------- */
.pcard { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.pc-head { display: flex; align-items: flex-end; gap: 10px; padding-left: 4px; }
.pc-letter { font-family: var(--font-display); font-size: 54px; line-height: .78; font-weight: 800; background: linear-gradient(180deg, var(--accent), var(--mint)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pc-kind { font-size: 13px; font-weight: 700; color: var(--accent); padding-bottom: 1px; }
.pc-head .tier { margin-bottom: 2px; }
.secret { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); font-size: 13px; line-height: 1.5; }
.secret b { color: var(--accent); }
.pc-head .new { background: var(--pink); color: var(--pink-ink); border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.pc-box { background: var(--surface); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.pc-top { display: flex; gap: 14px; align-items: center; }
.pc-av { width: 84px; height: 84px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.pc-av .ini { font-size: 34px; }
.pc-id { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pc-line { margin: 0; font-size: 16px; line-height: 1.4; }
.pc-type { font-size: 18px; line-height: 1.35; color: var(--accent); font-weight: 800; word-break: keep-all; overflow-wrap: anywhere; }
.pc-sub { font-size: 13px; padding-bottom: 12px; border-bottom: 1.5px dashed var(--stroke); }
.pc-bars { display: flex; flex-direction: column; gap: 9px; }
.pc-bar { display: grid; grid-template-columns: 62px minmax(0, 1fr) 42px; align-items: center; gap: 10px; font-size: 13px; }
.pc-bar span { font-weight: 700; }
.pc-bar i { height: 10px; border-radius: 99px; background: var(--accent-soft); position: relative; overflow: hidden; }
.pc-bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--accent)); }
.pc-bar b { color: var(--accent); text-align: right; font-size: 14px; }
.pc-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pc-tags span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--mint-deep); }
.pc-tags span.hit { background: var(--pink); color: var(--pink-ink); font-weight: 700; }
.pc-needs { background: var(--accent-soft); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.pc-needs b { font-size: 14px; color: var(--accent); }
.pc-needs ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--mint-deep); display: flex; flex-direction: column; gap: 3px; }
.pcard > .state, .pcard > .fresh { padding-left: 4px; }
.state.wait { color: var(--accent); }
.state.wait::after { content: ""; animation: aidots 1.2s steps(4) infinite; }
.note-in { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 16px; margin-bottom: 10px; }
.msg-sys.note { color: var(--pink-ink); background: var(--pink); font-weight: 400; max-width: 90%; text-align: center; }
/* ---------- 매칭 성사: 상대 얼굴 크게, 궁합 점수, 키워드 작게 ---------- */
.overlay.celeb { align-items: center; z-index: 25; }
.celeb .scrim { background: radial-gradient(circle at 50% 35%, rgba(142, 145, 238, .55), rgba(15, 16, 36, .9) 72%); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.celeb2 { position: relative; z-index: 1; width: min(400px, calc(100% - 32px)); max-height: calc(100% - 20px); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 6px 2px 14px; color: #FFFFFF; }
.celeb-tag { font-family: var(--font-logo); font-size: 38px; line-height: 1.1; font-weight: 700; text-shadow: 0 0 18px rgba(255, 141, 181, .8), 0 2px 0 rgba(0, 0, 0, .15); }
.celeb-tag span { color: #FF8DB5; }
.celeb-photo { position: relative; width: 100%; aspect-ratio: 4 / 5; max-height: 50vh; border-radius: 30px; overflow: hidden; flex: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .85), 0 0 46px rgba(255, 141, 181, .55), 0 24px 60px rgba(0, 0, 0, .45); transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .2s ease-out; touch-action: pan-y; }
.celeb-photo .celeb-big { width: 100%; height: 100%; }
.celeb-big .ini { font-size: 150px; }
.celeb-shine { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--mx, 30%) var(--my, 18%), rgba(255, 255, 255, .5), transparent 42%); mix-blend-mode: soft-light; }
.celeb-shine::after { content: ""; position: absolute; inset: -20% -60%; background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, .45) 50%, transparent 60%); transform: translateX(-60%); }
.anim .celeb-shine::after { animation: sweep 1.4s .7s ease-out both; }
.celeb-who { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 18px 16px; background: linear-gradient(transparent, rgba(15, 16, 36, .82)); text-align: left; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.celeb-who b { font-size: 30px; font-weight: 800; line-height: 1.2; }
.celeb-who > span:not(.tier) { font-size: 15px; opacity: .92; }
.celeb-me { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 6px; background: rgba(15, 16, 36, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 12px; }
.celeb-me > span { color: #FF8DB5; }
.celeb-score { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 2px; }
.celeb-score b { font-size: 68px; line-height: 1; font-weight: 800; background: linear-gradient(180deg, #FFFFFF 30%, #FFC2D6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 18px rgba(255, 141, 181, .65)); }
.celeb-score small { font-size: 15px; font-weight: 700; opacity: .9; }
.celeb-kw { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.celeb-kw span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .28); }
.celeb-note { margin: 0; font-size: 13px; color: #FFE3EC; }
.celeb-go { width: 100%; min-height: 52px; font-size: 16px; border: 0; color: #FFFFFF; background: linear-gradient(120deg, #FF8DB5, #A3A6FF); box-shadow: 0 10px 30px rgba(255, 141, 181, .45); }
.celeb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.celeb2 .btn.line { color: #FFFFFF; border-color: rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .08); }
.celeb-next { text-align: left; font-size: 13px; width: 100%; }
.celeb-next summary { cursor: pointer; color: var(--accent); font-weight: 700; padding: 8px 0; }
.celeb2 .celeb-next summary { color: #C3C5FF; }
.rules { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; }
.rules b { color: var(--accent); }
.celeb2 .rules b { color: #FFC2D6; }
.anim .celeb-tag { animation: tagIn .6s cubic-bezier(.2, 1.5, .4, 1) both; }
.anim .celeb-photo { animation: photoIn .8s .1s cubic-bezier(.2, 1.2, .3, 1) both; }
.anim .celeb-score, .anim .celeb-kw, .anim .celeb-go { animation: upIn .5s .55s ease-out both; }
#burst { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }
/* ---------- 프로필 등급 ---------- */
.tier { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 800; padding: 1px 9px; border-radius: 999px; color: #FFFFFF; background: linear-gradient(120deg, var(--tc), color-mix(in srgb, var(--tc) 55%, #FFFFFF)); box-shadow: 0 2px 8px color-mix(in srgb, var(--tc) 40%, transparent); white-space: nowrap; vertical-align: 2px; }
.tier-card { display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.tier-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, var(--tc), color-mix(in srgb, var(--tc) 40%, #FFFFFF)); }
.tier-top { display: flex; align-items: center; gap: 12px; }
.tier-gem { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; color: #FFFFFF; background: linear-gradient(140deg, var(--tc), color-mix(in srgb, var(--tc) 45%, #FFFFFF)); box-shadow: 0 6px 18px color-mix(in srgb, var(--tc) 45%, transparent); flex: none; }
.tier-top > div { flex: 1; display: flex; flex-direction: column; }
.tier-top small { font-size: 12px; color: var(--muted); }
.tier-top b { font-size: 22px; }
.tier-score { font-size: 28px; font-weight: 800; color: var(--accent); }
.tier-score small { font-size: 13px; color: var(--muted); }
.tier-track { position: relative; height: 10px; border-radius: 99px; background: var(--accent-soft); }
.tier-track i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--tc)); }
.tier-track span { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--surface); }
.tier-steps { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -4px; }
.tier-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tier-items li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tier-items li b { color: var(--accent); }
.tier-items li.done b::after { content: " ✓"; color: var(--good); }
.tier-items li small { grid-column: 1 / -1; font-size: 12px; color: var(--heart); }
/* ---------- 움직이는 배경 (WebGL) ---------- */
#bg-gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
html.gl #app { background: color-mix(in srgb, var(--app) 52%, transparent); box-shadow: none; }
.typing { display: flex; gap: 4px; padding: 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes tagIn { from { transform: scale(.4); opacity: 0; } }
@keyframes photoIn { from { transform: perspective(900px) rotateY(-40deg) scale(.7); opacity: 0; } }
@keyframes upIn { from { transform: translateY(14px); opacity: 0; } }
@keyframes sweep { to { transform: translateX(60%); } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim .celeb-tag, .anim .celeb-photo, .anim .celeb-score, .anim .celeb-kw, .anim .celeb-go, .anim .celeb-shine::after { animation: none; } }

/* ---------- 취향 핫플 지도 ---------- */
.hot-entry { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; cursor: pointer; border-radius: 20px; padding: 12px 14px; color: #FFFFFF; background: linear-gradient(120deg, #5B5FE0, #9C7BEA 60%, #F08DB0); box-shadow: 0 8px 20px rgba(91, 95, 224, .28); flex: none; }
.hot-entry .ico { width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; font-size: 22px; flex: none; }
.hot-entry .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hot-entry b { font-size: 16px; }
.hot-entry small { font-size: 12.5px; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hot-entry svg { width: 18px; height: 18px; transform: rotate(180deg); flex: none; }
.hot-map { height: 300px; width: 100%; background: #E9ECF5; position: relative; z-index: 0; flex: none; }
.hot-map .leaflet-tile-pane { filter: saturate(.3) brightness(1.06) contrast(.92); }   /* 바탕 지도는 흐리게, 핀이 눈에 띄게 */
.map-off { display: grid; place-items: center; height: 100%; padding: 20px; text-align: center; font-size: 14px; color: #64678A; }
.mpin { display: grid; place-items: center; font-weight: 800; color: #FFFFFF; }
.mpin.who { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #FFFFFF; font-size: 13px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
.mpin.me { background: #5B5FE0; }
.mpin.them { background: #E0679A; }

/* 모바일: 핸드폰에서 주로 쓰니까 손가락·키보드 기준으로 */
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body.locked { overflow: hidden; }   /* 시트가 열려 있으면 뒤 화면은 안 움직이게 */
button, a, label, select, summary, [data-act] { touch-action: manipulation; }   /* 두 번 탭 확대 대기 없이 바로 반응 */
.sheet-body, .log { overscroll-behavior: contain; }
/* 키보드가 올라오면 보이는 높이(--vvh)만큼만 시트를 그려서 입력창이 가려지지 않게 */
.overlay { bottom: auto; top: var(--vvt, 0px); height: var(--vvh, 100%); }
@media (pointer: coarse) {
  /* 아이폰은 글자가 16px보다 작은 입력칸을 누르면 화면을 확대해 버려서 16px로 */
  input:not([type=range]):not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px; }
  /* 손가락으로 누르기 쉬운 크기 (최소 44px) */
  .icon-btn { min-width: 44px; min-height: 44px; }
  .btn.sm { min-height: 40px; }
  .tgl, .sig-opt, .radios label { min-height: 40px; }
  .send, .attach { width: 44px; height: 44px; }
}
@media (display-mode: standalone) {
  /* 홈 화면 앱으로 열었을 때: 당겨서 새로고침으로 화면이 튀지 않게 */
  html, body { overscroll-behavior: none; }
}

/* 내 정보 */
.sliders { display: flex; flex-direction: column; gap: 6px; }
.sl { display: grid; grid-template-columns: 84px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.sl input { width: 100%; accent-color: var(--rose); }
.sl .v { text-align: right; font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--heart); }
.status { color: var(--muted); text-align: center; font-size: 12px; }

.picker { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 18px; padding: 12px; background: var(--paper); }
.picked { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.pk-k { font-size: 12px; font-weight: 700; color: var(--muted); }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.cat { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--rose); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 700; }
.cat.on { background: var(--rose); border-color: var(--rose); color: var(--accent-ink); }
.cat .cnt { background: var(--heart); color: #FFFFFF; border-radius: 8px; font-size: 11px; padding: 0 6px; }
.picker .hint { margin: 0; font-size: 12px; color: var(--muted); }
.picker .hint b { color: var(--ink); }

.search { position: relative; display: flex; align-items: center; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 12px 42px 12px 40px; box-shadow: var(--shadow); }
.search::before { content: ""; position: absolute; left: 15px; width: 13px; height: 13px; border: 2px solid var(--muted); border-radius: 50%; top: 50%; transform: translateY(-62%); }
.search::after { content: ""; position: absolute; left: 27px; top: 50%; width: 6px; height: 2px; background: var(--muted); transform: translateY(5px) rotate(45deg); border-radius: 2px; }
.search input::-webkit-search-cancel-button { display: none; }
.search .icon-btn { position: absolute; right: 4px; }
.search .icon-btn svg { width: 18px; height: 18px; }
.search-head { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.near { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 2px; flex-wrap: wrap; }
.near-bar { width: 70px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; flex: none; }
.near-bar i { display: block; height: 100%; background: var(--rose); }
.map { display: flex; flex-direction: column; gap: 8px; }
.map-head { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.map-head b { font-size: 16px; }
.map-wrap { overflow-x: auto; }
.map svg { width: 100%; max-width: 100%; height: auto; display: block; background: var(--paper); border-radius: 16px; }
.m-dot { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
.m-top { fill: var(--heart-soft); stroke: var(--rose); stroke-width: 1.8; }
.m-me { fill: var(--surface); stroke: var(--stroke); stroke-width: 2.5; }
.m-q { fill: var(--heart); }
.m-line { stroke: var(--stroke); stroke-width: 1.4; stroke-dasharray: 3 4; stroke-linecap: round; }
.m-lab { font-size: 11px; fill: var(--ink); font-family: var(--font-body); }
.m-lab.q { fill: var(--heart); font-weight: 700; }
.m-lab.me { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg.m-q { background: var(--heart); } .lg.m-top { background: var(--heart-soft); border: 1.5px solid var(--rose); } .lg.m-me { background: var(--surface); border: 2px solid var(--stroke); } .lg.m-dot { background: var(--surface); border: 1px solid var(--muted); }
.axes { display: grid; grid-template-columns: 76px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; align-items: center; font-size: 12px; }
.ax-b { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.ax-b i { display: block; height: 100%; }
.ax-b.q i { background: var(--heart); } .ax-b.p i { background: var(--stroke); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (prefers-reduced-motion: no-preference) {
  .sheet.enter { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
/* v4: 알림·차단·관리자·인증·약속 */
.bar-right { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.bell svg { width: 18px; height: 18px; }
.bell .badge { top: -6px; left: auto; right: -6px; }
.vbadge { display: inline-flex; align-items: center; gap: 2px; font-family: var(--font-body); font-size: 11px; font-weight: 700; color: #FFFFFF; background: #6C8CF0; border-radius: 999px; padding: 1px 7px; vertical-align: middle; margin-left: 4px; }
.menu-list { display: flex; flex-direction: column; }

.legal p, .legal ul { margin: 0 0 6px; }
.legal ul { padding-left: 20px; }
.links { display: flex; justify-content: center; gap: 14px; font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--rose); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.links button { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 2px; }
.notif-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.notif-item:last-child { border-bottom: 0; }
.notif-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--heart); margin-top: 7px; flex: none; }
.notif-item .dot.old { background: var(--line); }
.notif-item .t { flex: 1; min-width: 0; font-size: 14px; }

.tabs2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs2 button { flex: none; border: 0; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.tabs2 button[aria-selected="true"] { background: var(--rose); color: var(--accent-ink); box-shadow: var(--shadow-btn); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--paper); border-radius: 16px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-weight: 700; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }

.rep .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.cmp .ph { aspect-ratio: 4 / 5; border-radius: 10px; max-width: 100%; }
.cmp small { display: block; text-align: center; color: var(--muted); font-size: 12px; margin-top: 2px; }
.pose { font-size: 17px; font-weight: 700; color: var(--rose); }
.plan { background: var(--surface); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.plan b.h { font-size: 15px; }
.plan-opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.plan-opt a { color: var(--rose); font-size: 13px; }
.course-list { display: flex; flex-direction: column; gap: 8px; max-height: 42vh; overflow-y: auto; }
.course { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.course-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.course-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; counter-reset: st; }
.course-steps li { counter-increment: st; display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.course-steps li::before { content: counter(st); font-family: var(--font-mono); font-size: 11px; color: var(--rose); }
.course-steps li:not(:last-child)::after { content: "→"; color: var(--muted); margin-left: 2px; }
.course-steps a { color: var(--ink); text-decoration: underline var(--stroke); text-underline-offset: 2px; }
.course-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.relax { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; text-align: left; }
.relax button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 12px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; gap: 8px; color: var(--ink); }
.relax button b { color: var(--rose); white-space: nowrap; }
.daily-note { text-align: center; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; }
.learn { display: flex; flex-direction: column; gap: 6px; }
.learn-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13px; }
.learn-bar { position: relative; height: 8px; border-radius: 4px; background: var(--chip); }
.learn-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.learn-bar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .5; }
.learn-row .v { text-align: right; font-family: var(--font-mono); font-size: 12px; }
.suspended { padding-block: 60px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
/* AI 기능: 점선 테두리 카드 안에 결과, 고를 수 있는 후보는 버튼 */
.ai-box { background: linear-gradient(160deg, var(--accent-soft), var(--accent2-soft)); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.ai-box b.h, .ai-panel b.h { font-size: 14px; color: var(--rose); }
.ai-box b.h::before, .ai-panel b.h::before { content: "✦ "; color: var(--rose); font-size: 15px; }
.ai-panel { background: var(--accent-soft); border-top: 1px solid var(--line); padding-block: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 44vh; overflow-y: auto; font-size: 14px; flex: none; }
.ai-panel > * { flex-shrink: 0; }
.ai-sub { font-size: 13px; color: var(--rose); margin-top: 2px; }
.ai-wait { font-size: 13px; color: var(--muted); }
.ai-wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: aidots 1.2s steps(4) infinite; }
@keyframes aidots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.ai-list { display: flex; flex-direction: column; gap: 6px; }
.ai-cand { text-align: left; border: 1px solid transparent; background: var(--surface); border-radius: 999px; padding: 10px 16px; box-shadow: 0 2px 8px rgba(91, 95, 224, .08); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ai-cand:hover { border-color: var(--stroke); }
.ai-cand small { flex: none; color: var(--muted); font-size: 11px; }
.ai-ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.ai-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-row > * { flex: 1 1 120px; min-width: 0; }
.ai-row select, .ai-row input, .ai-box input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; background: var(--surface); font-size: 13px; }
.ai-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ai-step { border-top: 1px solid color-mix(in srgb, var(--stroke) 50%, transparent); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.ai-step a { color: var(--rose); font-weight: 700; }
.ai-leg { font-size: 12px; color: var(--muted); }
.ai-leg a { font-weight: 400; }
.lvl { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; margin-right: 4px; }
.lvl.safe { background: var(--chip); color: var(--good); }
.lvl.caution { background: var(--accent2-soft); color: var(--accent2); }
.lvl.danger { background: var(--bad-soft); color: var(--bad); }
.ai-alert { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-radius: 0; border-left: 0; border-right: 0; font-size: 13px; }
.ai-alert span { flex: 1 1 160px; }
.ai-note { font-size: 12px; color: var(--muted); }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }


/* ---------- 핑크 × 인디고 파스텔: 고른 것·좋아요는 파스텔 핑크 ---------- */
.btn.heart { background: var(--pink); border-color: var(--pink); color: var(--pink-ink); box-shadow: none; }
.btn.alt { color: var(--mint-deep); }
.chip { color: var(--mint-deep); }
.chip.hit { background: var(--pink); color: var(--pink-ink); }
.tgl.on, .cat.on { background: var(--pink); border-color: var(--pink); color: var(--pink-ink); }
.tgl.lv1 { background: var(--heart-soft); border-color: var(--heart-soft); color: var(--pink-ink); }
.sig-opt.on { background: var(--pink); border-color: var(--pink); color: var(--pink-ink); }
.rbtn.like { background: var(--pink); border-color: var(--pink); color: var(--heart); box-shadow: 0 6px 16px rgba(214, 51, 108, .22); }
.badge, .item .unread { background: var(--pink); color: var(--pink-ink); }
.grade.top { background: var(--pink); color: var(--pink-ink); }
.send { background: var(--pink); color: var(--pink-ink); box-shadow: none; }

/* ---------- 애프터 체크 ---------- */
.after { display: flex; flex-direction: column; gap: 8px; border-radius: 20px; padding: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px; }
.after > b { font-size: 15px; }
.after > span { color: var(--muted); font-size: 13px; line-height: 1.5; }
.after.both { background: var(--pink); border-color: var(--pink); }
.after.both > b { color: var(--pink-ink); }
.after.both > span { color: var(--ink); }
.after-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.after-btns .btn { box-shadow: none; }
.after-btns .btn.heart:not(.on) { background: var(--surface); border-color: var(--pink); }
.after-btns .btn.line.on { background: var(--muted); border-color: var(--muted); color: var(--surface); }
/* ---------- 신규 회원 ---------- */
.fresh { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--mint-deep); }
.fresh .new { background: var(--pink); color: var(--pink-ink); border-radius: 6px; padding: 1px 6px; font-size: 11px; letter-spacing: .5px; }
/* ---------- 만약에 시뮬레이터 ---------- */
.sim-entry { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 16px; cursor: pointer; box-shadow: var(--shadow-btn); }
.sim-entry b { font-size: 16px; white-space: nowrap; }
.sim-entry span { flex: 1; font-size: 13px; line-height: 1.5; }
.sim-entry svg { width: 18px; height: 18px; transform: rotate(180deg); flex: none; }
.sim-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.sim-list li { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sim-list li:last-child { border-bottom: 0; }
.sim-list .rk { font-weight: 700; color: var(--rose); text-align: center; }

.sim-list .nm b, .sim-list .nm small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mv.down { color: var(--bad); }
.sim-sum { font-size: 14px; font-weight: 700; }

<div id="app"></div>

<script>
// ---------------- 매칭 엔진 (matching.py와 같은 규칙, 가입자가 늘어도 계산되게 일반화) ----------------
function createEngine(cfg) {
  const W0 = cfg.weights;
  const KEYS = Object.keys(W0);
  const ORD = {
    marriage_view: ["negative", "neutral", "positive"],
    drinking: ["none", "sometimes", "often"],
    spending: ["saver", "balanced", "spender"],
  };
  const LABEL = {
    interests: "관심사", marriage_view: "결혼관", contact_style: "연락 스타일", distance: "거리", appearance: "외모",
    chronotype: "활동 시간대", weekend: "주말 방식", drinking: "음주", spending: "소비 성향", pet: "반려동물",
    smoking: "흡연", religion: "종교",
  };
  const REL = new Set();
  for (const [x, y] of cfg.related) { REL.add(x + "|" + y); REL.add(y + "|" + x); }
  const CAT_OF = {};
  for (const [c, ts] of Object.entries(cfg.categories)) for (const t of ts) CAT_OF[t] = c;
  // 태그 유사도: 같음 1.0 / 관련 있음 0.5 / 같은 분류 cfg.category_sim / 다름 0
  const tagSim = (x, y) => {
    if (x === y) return 1;
    if (REL.has(x + "|" + y)) return 0.5;
    if (CAT_OF[x] && CAT_OF[x] === CAT_OF[y]) return cfg.category_sim;
    return 0;
  };
  // 취향 좌표: 사람 = Σ(중요도 배율 × 관심사 좌표), 비교는 코사인 유사도
  const DIM = cfg.axes.length;
  function vecOfTags(tags, levels) {
    const v = new Array(DIM).fill(0);
    for (const t of tags) {
      const m = levels ? cfg.level_mult[levels[t] ?? 2] : 1;
      (cfg.tag_vec[t] || []).forEach((x, i) => { v[i] += m * x; });
    }
    return v;
  }
  const personVec = p => vecOfTags(p.interests, Object.fromEntries(p.interests.map(t => [t, levelOf(p, t)])));
  function cosine(a, b) {
    let d = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    return na && nb ? d / Math.sqrt(na * nb) : 0;
  }
  const spread = c => Math.min(1, Math.max(0, (c - cfg.cos_floor) / (1 - cfg.cos_floor)));
  // 여러 사람의 8차원 좌표를 2차원으로 펼치기 (주성분 분석, 화면 지도용)
  function project2D(vecs) {
    const n = vecs.length, mean = new Array(DIM).fill(0);
    vecs.forEach(v => v.forEach((x, i) => { mean[i] += x / n; }));
    const C = vecs.map(v => v.map((x, i) => x - mean[i]));
    const cov = Array.from({ length: DIM }, (_, i) => Array.from({ length: DIM }, (_, j) => C.reduce((s, r) => s + r[i] * r[j], 0)));
    const comps = [];
    for (let c = 0; c < 2; c++) {
      let v = Array.from({ length: DIM }, (_, i) => 1 + i * 0.1);
      for (let it = 0; it < 60; it++) {
        let w = cov.map(row => row.reduce((s, x, j) => s + x * v[j], 0));
        for (const u of comps) { const d = w.reduce((s, x, i) => s + x * u[i], 0); w = w.map((x, i) => x - d * u[i]); }
        const nrm = Math.sqrt(w.reduce((s, x) => s + x * x, 0)) || 1;
        v = w.map(x => x / nrm);
      }
      comps.push(v);
    }
    return { points: C.map(r => comps.map(u => r.reduce((s, x, i) => s + x * u[i], 0))), mean, comps };
  }
  const levelOf = (p, t) => p.interest_level?.[t] ?? (t === p.favorite_tag ? 3 : 2);
  // 거르기 태그: "cat:운동"처럼 분류 전체도 고를 수 있음
  const tagHit = (want, u, related) => want.startsWith("cat:") ? CAT_OF[u] === want.slice(4) : (u === want || (related && tagSim(want, u) >= 0.5));
  const ordSim = (f, x, y) => {
    const i = ORD[f].indexOf(x), j = ORD[f].indexOf(y);
    if (i < 0 || j < 0) return 0;
    return ({ 0: 1, 1: 0.5 })[Math.abs(i - j)] ?? 0;
  };
  const petSim = (x, y) => {
    const fond = v => v === "has" || v === "likes";
    if ((fond(x) && fond(y)) || (x === "dislikes" && y === "dislikes")) return 1;
    if ([x, y].includes("has") && [x, y].includes("dislikes")) return 0;
    return 0.5;
  };
  const satisfies = (f, actual, wanted) => (f === "pet" && wanted === "likes") ? (actual === "has" || actual === "likes") : actual === wanted;

  function dist(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const la1 = a.lat * rad, la2 = b.lat * rad, dla = la2 - la1, dlo = (b.lng - a.lng) * rad;
    const h = Math.sin(dla / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // 희귀도: 지금 가입한 사람 전체 기준으로 다시 계산 (가장 흔한 태그 = 1.0, 상한 cfg.rarity_cap)
  function buildRarity(list) {
    const n = list.length, cnt = {};
    for (const p of list) for (const t of p.interests) cnt[t] = (cnt[t] || 0) + 1;
    const idf = Object.fromEntries(Object.entries(cnt).map(([t, c]) => [t, Math.log(n / c)]));
    const base = Math.min(...Object.values(idf));
    return Object.fromEntries(Object.entries(idf).map(([t, v]) => [t, Math.min(base > 0 ? v / base : 1 + v, cfg.rarity_cap)]));
  }

  function normWeights(w) {
    const s = KEYS.reduce((t, k) => t + (w?.[k] || 0), 0);
    if (s <= 0) return { ...W0 };
    return Object.fromEntries(KEYS.map(k => [k, (w[k] || 0) * 100 / s]));
  }

  // 실제로 쓰는 가중치: (직접 조절한 값 또는 만남 목적별 기본값) × 마음 표현으로 학습한 배율 → 합계 100
  function baseWeights(p, s) { return (s && s.weights) || (cfg.purpose_weights && cfg.purpose_weights[p.purpose]) || W0; }
  function effWeights(p, s) {
    const b = baseWeights(p, s), L = (s && s.learned) || {};
    return normWeights(Object.fromEntries(KEYS.map(k => [k, (b[k] || 0) * (L[k] ?? 1)])));
  }

  function filterOne(a, b, d, tagOpt) {
    const pr = a.preference;
    if (!b.nickname || !b.has_photo) return { code: "R1", text: "프로필 미완성 (사진 없음)" };
    if (!pr.gender.includes(b.gender)) return { code: "R2", text: "성별" };
    if (b.age < pr.age_min || b.age > pr.age_max) return { code: "R3", text: "나이" };
    if (d > pr.max_distance_km && (pr.distance_importance === 3 || d > pr.max_distance_km * 2)) return { code: "R4", text: "거리" };
    if (a.purpose !== b.purpose) return { code: "R5", text: "목적" };
    for (const [f, c] of Object.entries(pr.conditions || {}))
      if (c.importance === 3 && !satisfies(f, b[f], c.value)) return { code: "R6", text: `절대 조건 (${LABEL[f] ?? f})` };
    if (tagOpt && tagOpt.tags && tagOpt.tags.length) {
      const ok = b.interests.some(u => tagOpt.tags.some(tg => tagHit(tg, u, tagOpt.related)));
      if (!ok) return { code: "R7", text: "태그" };
    }
    return null;
  }

  // detail=false: 점수 숫자만 (500명 전체 계산용). detail=true: 화면에 보여줄 근거까지
  function scoreOne(a, b, d, W, rarity, va, vb, detail) {
    let total = 0;
    const reasons = [], parts = [], pens = [];
    const part = detail
      ? (key, pts, note) => { total += pts; parts.push({ key, label: LABEL[key], w: W[key], pts, note: typeof note === "function" ? note() : note }); }
      : (key, pts) => { total += pts; };

    let k = 0; const hits = [];
    for (const tg of a.interests) {
      let bestTag = null, best = 0;
      for (const u of b.interests) { const s = tagSim(tg, u); if (s > best) { best = s; bestTag = u; } }
      if (best > 0) {
        k += best * (rarity[tg] ?? 1) * cfg.level_mult[levelOf(a, tg)];
        if (detail) hits.push({ mine: tg, theirs: bestTag, sim: best });
      }
    }
    const cos = cosine(va, vb);
    let pts = (cfg.overlap_share * (1 - 0.5 ** k) + (1 - cfg.overlap_share) * spread(cos)) * W.interests;
    part("interests", pts, () => (hits.length ? hits.map(h => h.sim === 1 ? h.mine : h.sim >= 0.5 ? `${h.mine}≈${h.theirs}` : `${h.mine}~${h.theirs}(${CAT_OF[h.mine]})`).join(", ") : "겹침 없음") + ` · 좌표 유사도 ${cos.toFixed(2)}`);
    if (detail) { if (hits.length) reasons.push({ key: "interests", pts, hits }); else if (cos >= 0.85) reasons.push({ key: "taste", pts, cos }); }

    for (const f of ["marriage_view", "drinking", "spending"]) {
      const s = ordSim(f, a[f], b[f]); pts = s * W[f];
      part(f, pts, () => `${a[f]} / ${b[f]}`);
      if (detail && s === 1) reasons.push({ key: f, pts, value: a[f] });
    }
    for (const f of ["contact_style", "chronotype", "weekend"]) {
      const s = a[f] === b[f] ? 1 : 0; pts = s * W[f];
      part(f, pts, () => `${a[f]} / ${b[f]}`);
      if (detail && s) reasons.push({ key: f, pts, value: a[f] });
    }
    part("pet", petSim(a.pet, b.pet) * W.pet, () => `${a.pet} / ${b.pet}`);

    const maxD = Math.min(a.preference.max_distance_km, b.preference.max_distance_km);
    let s = Math.max(0, 1 - d / maxD); pts = s * W.distance;
    part("distance", pts, () => `${d.toFixed(1)}km / 기준 ${maxD}km`);
    if (detail && s >= 0.5) reasons.push({ key: "distance", pts, value: d });

    const wanted = Object.entries(a.preference.appearance || {}).filter(([, v]) => v !== "any" && Array.isArray(v) && v.length);
    const matched = wanted.filter(([kk, v]) => v.includes(b.appearance?.[kk]));
    s = wanted.length ? matched.length / wanted.length : 1; pts = s * W.appearance;
    part("appearance", pts, () => wanted.length ? `원하는 ${wanted.length}개 중 ${matched.length}개 일치` : "상관없음");
    if (detail && wanted.length && s > 0) reasons.push({ key: "appearance", pts });

    for (const [f, c] of Object.entries(a.preference.conditions || {})) {
      const pen = cfg.penalty[c.importance];
      if (pen !== undefined && !satisfies(f, b[f], c.value)) { total += pen; if (detail) pens.push({ pts: pen, text: `${LABEL[f] ?? f} 조건 어김` }); }
    }
    const over = d - a.preference.max_distance_km;
    if (over > 0) { const p = cfg.dist_penalty * Math.ceil(over / 5); total += p; if (detail) pens.push({ pts: p, text: `최대 거리 ${over.toFixed(1)}km 초과` }); }

    if (detail) reasons.sort((x, y) => y.pts - x.pts);
    return { total: Math.max(total, 0), reasons, parts, pens };
  }

  // 전체 계산: 사람마다 추천 목록 + 자동 매칭
  // opts.isBlocked(a, b): 둘 중 한 명이라도 차단했으면 true
  function computeAll(list, settingsOf, opts) {
    opts = opts || {};
    const rarity = buildRarity(list);
    const lists = {};
    // 사람별로 한 번만 계산해서 재사용
    const VEC = {}, WN = {}, SET = {};
    for (const p of list) { VEC[p.id] = personVec(p); SET[p.id] = settingsOf(p.id); WN[p.id] = effWeights(p, SET[p.id]); }
    for (const a of list) {
      const sa = SET[a.id];
      const recs = [], rejected = { R1: 0, R2: 0, R3: 0, R4: 0, R5: 0, R6: 0, R7: 0, nearestR4: null };
      for (const b of list) {
        if (b.id === a.id) continue;
        if (opts.isBlocked && opts.isBlocked(a.id, b.id)) continue;
        if (!a.preference.gender.includes(b.gender)) continue;
        if (!b.preference.gender.includes(a.gender)) { rejected.R2++; continue; }
        const d = dist(a, b);
        const why = filterOne(a, b, d, sa) || filterOne(b, a, d, null);
        if (why) { rejected[why.code]++; if (why.code === "R4" && (rejected.nearestR4 === null || d < rejected.nearestR4)) rejected.nearestR4 = d; continue; }
        const ab = scoreOne(a, b, d, WN[a.id], rarity, VEC[a.id], VEC[b.id], false).total;
        const ba = scoreOne(b, a, d, WN[b.id], rarity, VEC[b.id], VEC[a.id], false).total;
        const raw = Math.sqrt(ab * ba);
        recs.push({ id: b.id, distance: d, score: raw, raw, ab, ba, pop: 1 });
      }
      recs.sort((x, y) => (y.score - x.score) || (x.distance - y.distance));
      lists[a.id] = { recs, rejected };
    }
    // 인기 쏠림 완화: 여러 사람의 상위 3명에 자주 드는 사람은 점수를 조금씩 낮춰서 고르게 노출
    const popCount = {};
    for (const p of list) for (const r of lists[p.id].recs.slice(0, 3)) popCount[r.id] = (popCount[r.id] || 0) + 1;
    const free = cfg.pop_free ?? 3, damp = cfg.pop_damp ?? 0;
    const popFactor = id => 1 / (1 + damp * Math.max(0, (popCount[id] || 0) - free));
    if (damp > 0) for (const p of list) {
      const recs = lists[p.id].recs;
      for (const r of recs) { r.pop = popFactor(r.id); r.score = r.raw * r.pop; }
      recs.sort((x, y) => (y.score - x.score) || (x.distance - y.distance));
    }
    // 자동 매칭: 서로가 1순위면 연결, 연결된 사람을 빼고 반복
    const auto = {};
    const N = cfg.auto_top_n || 3;
    const inTop = {};
    for (const p of list) inTop[p.id] = new Set(lists[p.id].recs.slice(0, N).map(r => r.id));
    for (let round = 1; ; round++) {
      const top = {};
      for (const p of list) if (!auto[p.id]) top[p.id] = lists[p.id].recs.find(r => !auto[r.id] && inTop[p.id].has(r.id)) || null;
      let found = false;
      for (const [a, r] of Object.entries(top)) {
        if (r && String(a) < String(r.id) && top[r.id] && top[r.id].id === a) {
          auto[a] = { partner: r.id, round, score: r.score };
          auto[r.id] = { partner: a, round, score: r.score };
          found = true;
        }
      }
      if (!found) break;
    }
    return { lists, auto, rarity, popCount, ctx: { rarity, VEC, WN } };
  }
  // 조건을 바꾸면 내 후보가 몇 명이 되는지 (조건 완화 제안용)
  function countFor(list, me, settings, opts) {
    opts = opts || {};
    let n = 0;
    for (const b of list) {
      if (b.id === me.id) continue;
      if (opts.isBlocked && opts.isBlocked(me.id, b.id)) continue;
      if (!me.preference.gender.includes(b.gender) || !b.preference.gender.includes(me.gender)) continue;
      const d = dist(me, b);
      if (!filterOne(me, b, d, settings) && !filterOne(b, me, d, null)) n++;
    }
    return n;
  }
  // 두 사람 사이 항목별 유사도 (0~1), 마음 표현 학습용
  function itemSims(ctx, a, b) {
    const d = dist(a, b);
    const ones = Object.fromEntries(KEYS.map(k => [k, 10]));
    const sc = scoreOne(a, b, d, ones, ctx.rarity, ctx.VEC[a.id] || personVec(a), ctx.VEC[b.id] || personVec(b), true);
    return Object.fromEntries(sc.parts.map(p => [p.key, Math.max(0, Math.min(1, p.pts / 10))]));
  }
  // 화면에 보이는 한 쌍만 근거까지 자세히 계산
  function explain(ctx, a, b) {
    const d = dist(a, b);
    const ab = scoreOne(a, b, d, ctx.WN[a.id], ctx.rarity, ctx.VEC[a.id], ctx.VEC[b.id], true);
    const ba = scoreOne(b, a, d, ctx.WN[b.id], ctx.rarity, ctx.VEC[b.id], ctx.VEC[a.id], true);
    return {
      reasons: ab.reasons, penA: ab.pens, penB: ba.pens,
      parts: ab.parts.map((p, i) => ({ ...p, wB: ba.parts[i].w, ptsB: ba.parts[i].pts, noteB: ba.parts[i].note })),
    };
  }

  // "만약에" 시뮬레이터: 내 가중치만 바꿔서 내 추천 순위를 다시 계산
  // 상대가 본 내 점수(ba)와 인기 보정(pop)은 내 가중치와 상관없으니 그대로 씀 → 내 쪽 점수만 새로 계산
  function rescore(ctx, me, recs, byId, Wraw) {
    const W = normWeights(Wraw);
    const va = ctx.VEC[me.id] || personVec(me);
    return recs.map(r => {
      const b = byId[r.id];
      const ab = scoreOne(me, b, r.distance, W, ctx.rarity, va, ctx.VEC[b.id] || personVec(b), false).total;
      const raw = Math.sqrt(ab * r.ba);
      return { ...r, ab, raw, score: raw * (r.pop ?? 1) };
    }).sort((x, y) => (y.score - x.score) || (x.distance - y.distance));
  }

  return { computeAll, explain, countFor, itemSims, rescore, normWeights, baseWeights, effWeights, KEYS, LABEL, W0, tagSim, dist, CAT_OF, levelOf, vecOfTags, personVec, cosine, project2D, AXES: cfg.axes };
}

async function hash(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return "x" + h;
  }
}
function shrinkPhoto(file) { return resizeImage(file, { crop: [360, 450], quality: 0.8 }); }
function resizeImage(file, opt) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject(new Error("type"));
    const r = new FileReader();
    r.onerror = () => reject(new Error("read"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode"));
      img.onload = () => {
        const c = document.createElement("canvas");
        let W, H;
        if (opt.crop) { [W, H] = opt.crop; } else { const k = Math.min(1, opt.max / Math.max(img.width, img.height)); W = Math.round(img.width * k); H = Math.round(img.height * k); }
        c.width = W; c.height = H;
        const s = Math.max(W / img.width, H / img.height);
        const w = img.width * s, h = img.height * s;
        c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        let url = c.toDataURL("image/jpeg", opt.quality);
        if (url.length > 230000) url = c.toDataURL("image/jpeg", 0.5);
        resolve(url);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function cycleTag(st, tag) {
  const lv = st.tags.includes(tag) ? st.lv[tag] : 0;
  const tops = st.tags.filter(t => st.lv[t] === 3 && t !== tag).length;
  if (!lv) { if (st.tags.length >= 5) return toast("관심사는 5개까지 고를 수 있어요"); st.tags.push(tag); st.lv[tag] = 2; }
  else if (lv === 2) st.lv[tag] = tops >= MAX_TOP ? 1 : 3;
  else if (lv === 3) st.lv[tag] = 1;
  else { st.tags = st.tags.filter(x => x !== tag); delete st.lv[tag]; }
  if (lv === 2 && tops >= MAX_TOP) toast(`★★★는 ${MAX_TOP}개까지라서 ★로 바꿨어요`);
  render();
}

}

// ---------------- 화면: 앱 ----------------
// ---------- 매일 추천: 하루 3명 고정, 다음 날은 최근 14일 안에 본 사람을 뒤로 ----------
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function hashStr(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function prefSig(me) { const s = settingsOf(me.id); return hashStr(JSON.stringify([me.preference, me.purpose, me.gender, s.tags, s.related, s.weights])); }
// ---------- 신규 회원 첫 주 노출 보장 ----------
// 새로 가입한 사람은 마음 표현 기록이 없고 다른 사람 추천에도 잘 안 떠서 첫 매칭까지 오래 걸림 → 첫 7일은 하루 추천 1자리를 보장
const NEW_DAYS = 7, NEW_FLOOR = 0.8, BOOT_T = Date.now();
function joinedAt(p) {
  if (!p) return 0;
  const c = S.users[p.id]?.created;
  if (c) return c;
  // 시연판 가상 회원에는 가입일이 없어서, 25명 중 1명꼴(번호 끝이 07, 32, 57, 82)을 "이번 주 가입"으로 가정
  const n = Number(p.id);
  return !REAL && Number.isFinite(n) && n % 25 === 7 ? BOOT_T - (n % 6) * 864e5 - 36e5 : 0;
}
const isNew = p => { const t = joinedAt(p); return t > 0 && Date.now() - t < NEW_DAYS * 864e5; };
const daysSince = t => Math.max(1, Math.ceil((Date.now() - t) / 864e5));
function dailyPicks(me) {
  const recs = world().lists[me.id].recs, valid = new Set(recs.map(r => r.id));
  const d = privOf(me.id).daily, t = today(), sig = prefSig(me);
  if (d && d.date === t && d.sig === sig) return { ...d, ids: d.ids.filter(id => valid.has(id)), passed: d.passed || [], extra: d.extra || 0 };
  const seen = { ...((d && d.seen) || {}) };
  const cutoff = Date.now() - 14 * 864e5;
  for (const [id, day] of Object.entries(seen)) if (Date.parse(day) < cutoff) delete seen[id];
  const passed = d && d.date === t ? (d.passed || []) : [];
  const open = recs.filter(r => !isMatched(me.id, r.id));   // 이미 매칭된 사람은 다음 추천부터 빠짐
  const order = [...open.filter(r => !seen[r.id]), ...open.filter(r => seen[r.id]).sort((a, b) => (seen[a.id] < seen[b.id] ? -1 : 1))];
  const ids = order.filter(r => !passed.includes(r.id)).slice(0, REC_LIMIT).map(r => r.id);
  // 신규 회원 첫 주 노출 보장: 오늘 고른 사람 중에 이번 주 가입자가 없으면,
  // 조건(R1~R7)을 통과한 신규 회원 중 가장 잘 맞는 1명을 마지막 자리에 넣음.
  // 단, 그 자리에 원래 올 사람 점수의 NEW_FLOOR(80%) 이상일 때만 (너무 안 맞는 사람은 안 넣음)
  let fresh = null;
  const byId = world().byId, scoreOf = Object.fromEntries(recs.map(r => [r.id, r.score]));
  if (ids.length && !ids.some(id => isNew(byId[id]))) {
    const floor = (scoreOf[ids[ids.length - 1]] || 0) * NEW_FLOOR;
    const cand = order.find(r => !passed.includes(r.id) && !ids.includes(r.id) && isNew(byId[r.id]) && r.score >= floor);
    if (cand) {
      fresh = { id: cand.id, rank: recs.indexOf(cand) + 1 };
      if (ids.length >= REC_LIMIT) ids[ids.length - 1] = cand.id; else ids.push(cand.id);
    }
  }
  for (const id of ids) seen[id] = t;
  const next = { date: t, sig, ids, passed, seen, extra: 0, fresh };
  const ready = !S.fb || S.privLoaded;   // 배포판은 저장된 기록을 받은 뒤에만 새로 저장 (다른 기기 기록을 덮지 않게)
  if (ready && !S.dailyPending) { S.dailyPending = true; setTimeout(() => { S.dailyPending = false; if (S.uid === me.id) savePriv({ daily: next }); }, 0); }
  return next;
}
function saveDaily(patch) { const d = dailyPicks(world().byId[S.uid]); savePriv({ daily: { ...d, ...patch } }); }
// 나만 보는 저장소: 배포판은 priv/{내 uid} 문서(본인만 읽고 씀), 시연판은 이 브라우저에만 저장
function privOf(uid) { return S.fb ? (S.priv || {}) : ls.get("gm-priv:" + uid, {}); }
function savePriv(patch) {
  const uid = S.uid; if (!uid) return;
  const next = { ...privOf(uid), ...patch };
  if (S.fb) { S.priv = next; if (S.db) { const body = plain(next); queueWrite("priv/" + uid, () => S.db.doc("priv/" + uid).set(body)); } }
  else ls.set("gm-priv:" + uid, next);
  render();
}

// ---------- 조건 완화 제안: 조건을 바꾸면 후보가 몇 명 늘어나는지 실제로 세어봄 ----------
function relaxOptions(me) {
  const w = world(), s = settingsOf(me.id), pr = me.preference;
  const base = E.countFor(w.list, me, s, { isBlocked });
  const out = [];
  const tryOpt = (label, prefPatch, setPatch) => {
    const n = E.countFor(w.list, { ...me, preference: { ...pr, ...(prefPatch || {}) } }, { ...s, ...(setPatch || {}) }, { isBlocked });
    if (n > base) out.push({ label, n: n - base, prefPatch, setPatch });
  };
  if (pr.max_distance_km < 100) { const nd = Math.min(100, Math.max(pr.max_distance_km * 2, pr.max_distance_km + 10)); tryOpt(`최대 거리 ${pr.max_distance_km}km → ${nd}km`, { max_distance_km: nd }); }
  if (pr.distance_importance === 3) tryOpt("거리를 '가까우면 좋아요'로 바꾸기", { distance_importance: 2 });
  { const lo = Math.max(19, pr.age_min - 3), hi = pr.age_max + 3; tryOpt(`나이 ${pr.age_min}~${pr.age_max}세 → ${lo}~${hi}세`, { age_min: lo, age_max: hi }); }
  if (s.tags.length) tryOpt("관심사 거르기 풀기", null, { tags: [] });
  const hard = Object.entries(pr.conditions || {}).filter(([, c]) => c.importance === 3);
  if (hard.length) {
    const conds = Object.fromEntries(Object.entries(pr.conditions).map(([k, c]) => [k, c.importance === 3 ? { ...c, importance: 2 } : c]));
    tryOpt(`꼭 지킬 조건(${hard.map(([k]) => FIELD_KO[k] || k).join(", ")})을 '중요'로 낮추기`, { conditions: conds });
  }
