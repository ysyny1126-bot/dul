}
function relaxHtml(me, compact) {
  const opts = relaxOptions(me);
  if (!opts.length) return "";
  return `<div class="relax">${compact ? `<span class="muted" style="font-size:13px">조건을 조금 넓히면 더 만날 수 있어요</span>` : ""}${opts.map((o, i) => `<button type="button" data-act="relax" data-i="${i}"><span>${esc(o.label)}</span><b>+${o.n}명</b></button>`).join("")}</div>`;
}
function applyRelax(i) {
  const o = (S.relaxOpts || [])[i]; if (!o) return;
  const me = world().byId[S.uid];
  if (o.prefPatch) saveUser(S.uid, { edits: { ...(S.users[S.uid]?.edits || {}), preference: { ...me.preference, ...o.prefPatch } } });
  if (o.setPatch) saveUser(S.uid, { settings: { ...plain(settingsOf(S.uid)), ...o.setPatch } });
  toast(`조건을 바꿨어요. 후보가 ${o.n}명 늘었어요`);
}

// ---------- 마음 표현으로 학습: 좋게 본 사람과 잘 맞은 항목은 무게를 올리고, 아니었던 사람과 맞은 항목은 내림 ----------
const SIG_W = { like: 0.5, interest: 0.7, meet: 1, again: 1.3, fun: 0.8, pass: -1 };
// 애프터 체크는 실제로 만나 본 뒤의 답이라 마음 표현보다 무겁게 반영
const AFTER_W = { yes: 1.6, no: -1.3 };
function computeLearned(me) {
  const w = world();
  const mine = [
    ...Object.values(S.signals).filter(x => x.from === me.id && x.kind && SIG_W[x.kind] !== undefined && w.byId[x.to]).map(x => ({ to: x.to, sw: SIG_W[x.kind] })),
    ...Object.values(S.afters).filter(x => x.from === me.id && AFTER_W[x.ans] !== undefined && w.byId[x.to]).map(x => ({ to: x.to, sw: AFTER_W[x.ans] })),
  ];
  if (mine.length < 2) return null;
  const pool = w.lists[me.id].recs.slice(0, 60).map(r => E.itemSims(w.ctx, me, w.byId[r.id]));
  const avg = k => pool.length ? pool.reduce((t, x) => t + x[k], 0) / pool.length : 0.5;
  const acc = Object.fromEntries(E.KEYS.map(k => [k, 0])); let tot = 0;
  for (const sg of mine) {
    const sim = E.itemSims(w.ctx, me, w.byId[sg.to]), sw = sg.sw;
    for (const k of E.KEYS) acc[k] += sw * (sim[k] - avg(k));
    tot += Math.abs(sw);
  }
  return { mult: Object.fromEntries(E.KEYS.map(k => [k, Math.round(Math.min(1.6, Math.max(0.6, 1 + 1.2 * acc[k] / tot)) * 100) / 100])), n: mine.length };
}
let learnTimer;
function scheduleLearning() { clearTimeout(learnTimer); learnTimer = setTimeout(updateLearning, 60); }
function updateLearning() {
  if (!S.uid || !S.canWrite) return;
  const me = world().byId[S.uid]; if (!me) return;
  const L = computeLearned(me), cur = settingsOf(S.uid);
  const next = L ? L.mult : null;
  if (JSON.stringify(next) === JSON.stringify(cur.learned || null)) return;
  const st = plain(cur);
  if (next) { st.learned = next; st.learnedN = L.n; } else { delete st.learned; delete st.learnedN; }
  saveUser(S.uid, { settings: st });
}

// ---------- 애프터 체크: 만난 뒤 "또 만나고 싶어요?"를 따로 묻고, 둘 다 '예'일 때만 서로에게 알려줌 ----------
// 저장: afters/{나}_{상대} = { from, to, ans: "yes"|"no", at }
// 배포판 보안 규칙: 내 답은 나만 읽음. 상대는 "내 답도 yes이고 자기 답도 yes"일 때만 읽을 수 있음
//  → '아니요'는 물론이고, 상대가 먼저 '예'를 눌렀다는 사실도 내가 '예'를 누르기 전엔 알 수 없음
const afterOf = (a, b) => S.afters[`${a}_${b}`] || null;
const metWith = (a, b) => !!(sigOf(a, b)?.met || sigOf(b, a)?.met);
function metAtWith(a, b) { return Math.max(sigOf(a, b)?.metAt || 0, sigOf(b, a)?.metAt || 0); }
// "both": 둘 다 예 / "waitYes": 나는 예, 상대 답은 모름 / "no": 나는 아니요 / null: 아직 안 답함
function afterState(a, b) {
  const mine = afterOf(a, b);
  if (!mine) return null;
  if (mine.ans === "no") return "no";
  return afterOf(b, a)?.ans === "yes" ? "both" : "waitYes";
}
function setAfter(to, ans) {
  const from = S.uid, key = `${from}_${to}`;
  const body = { from, to, ans, at: Date.now() };
  S.afters[key] = body;
  changed(); scheduleLearning();
  if (S.db) queueWrite("afters/" + key, () => S.db.doc("afters/" + key).set(plain(body)).then(() => { if (S.fb) pollAfters(); }));
}
// 배포판: 상대 답 문서는 규칙상 둘 다 '예'일 때만 열리므로, 내가 '예'인 짝만 가끔 다시 확인
function pollAfters() {
  if (!S.fb || !S.db || !S.uid) return;
  for (const a of Object.values(S.afters)) {
    if (a.from !== S.uid || a.ans !== "yes") continue;
    const key = `${a.to}_${S.uid}`;
    if (S.afters[key]?.ans === "yes") continue;
    S.db.doc("afters/" + key).get().then(sn => {
      const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists;
      if (ok) { S.afters = { ...S.afters, [key]: sn.data() }; changed(); scheduleLearning(); }
    }).catch(() => {});   // 권한 없음 = 상대가 아직 안 답했거나 '아니요' (둘을 구분하지 않음)
  }
}
setInterval(pollAfters, 60000);
function afterCard(me, o, compact) {
  const st = afterState(me.id, o.id), mine = afterOf(me.id, o.id);
  const btn = (v, label, cls) => `<button type="button" class="btn sm ${cls}${mine?.ans === v ? " on" : ""}" data-act="after" data-id="${o.id}" data-v="${v}" aria-pressed="${mine?.ans === v}">${label}</button>`;
  const btns = `<div class="after-btns">${btn("yes", "♥ 또 만나고 싶어요", "heart")}${btn("no", "이번엔 여기까지", "line")}</div>`;
  if (st === "both") return `<div class="after both"><b>애프터 성사! ${esc(o.nickname)}님도 또 만나고 싶대요</b><span>두 분 모두 '또 만나고 싶어요'를 골랐어요. 다음 약속을 잡아보세요.</span></div>`;
  const head = `<b>${compact ? "" : `${esc(o.nickname)}님과의 `}만남, 어땠어요?</b>`;
  const note = st === "waitYes" ? `<span>'또 만나고 싶어요'를 남겼어요. ${esc(o.nickname)}님도 같은 답을 고르면 그때 두 분께 알려드려요.</span>`
    : st === "no" ? `<span>답을 남겼어요. 상대에게는 알리지 않아요. 앞으로 추천을 고를 때 참고할게요.</span>`
    : `<span>답은 상대에게 보이지 않아요. 두 분 모두 '또 만나고 싶어요'일 때만 서로에게 알려드려요.</span>`;
  return `<div class="after">${head}${note}${btns}</div>`;
}
// 홈에 띄울 것: 만났다고 표시했는데 아직 애프터 체크를 안 한 사람 (만난 날 다음 날부터)
function pendingAfters(me) {
  return matchesOf(me.id).filter(m => metWith(me.id, m.id) && !afterOf(me.id, m.id) && today() !== dayOf(metAtWith(me.id, m.id))).map(m => world().byId[m.id]);
}
function dayOf(t) { if (!t) return ""; const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

// ---------- 알림 ----------
function events(me) {
  const w = world(), ev = [], nick = id => w.byId[id]?.nickname || "누군가";
  for (const l of Object.values(S.likes)) if (l.to === me.id && w.byId[l.from] && !isBlocked(me.id, l.from)) ev.push({ at: l.at || 0, text: `${nick(l.from)}님이 좋아요를 보냈어요${l.note ? ` · “${l.note}”` : ""}`, act: "tab", v: "match" });
  for (const b of Object.values(S.blocks)) if (b.to === me.id && b.kind === "end") ev.push({ at: b.at || 0, text: `${nick(b.from)}님이 대화를 마쳤어요. 새로운 인연을 찾아드릴게요`, act: "tab", v: "home" });
  for (const g of Object.values(S.signals)) if (g.to === me.id && g.kind && w.byId[g.from] && !isBlocked(me.id, g.from)) ev.push({ at: g.at || 0, text: `${nick(g.from)}님이 '${SIG[g.kind]}'를 보냈어요`, act: "openchat", id: g.from });
  for (const m of matchesOf(me.id)) {

  }
  for (const m of matchesOf(me.id)) {

  }
  for (const o of pendingAfters(me)) ev.push({ at: Math.min(Date.now(), metAtWith(me.id, o.id) + 864e5), text: `${nick(o.id)}님과의 만남은 어땠어요? 애프터 체크를 남겨주세요`, act: "openchat", id: o.id });
  const au = w.auto[me.id];

  const md = S.mod[me.id]; if (md && md.verified && md.at) ev.push({ at: md.at, text: "사진 인증이 끝났어요. 프로필에 인증 배지가 붙었어요", act: "tab", v: "me" });
  const vf = myVerif(); if (vf && vf.status === "rejected" && vf.reviewedAt) ev.push({ at: vf.reviewedAt, text: "사진 인증이 반려됐어요. 안내된 자세로 다시 찍어주세요", act: "tab", v: "me" });
  return ev.sort((a, b) => b.at - a.at).slice(0, 30);
}
const notifSeen = () => ls.get("gm-nseen:" + S.uid, 0);
let notifiedUpTo = Date.now();
function browserNotify(me) {

}

// ---------- 데이트 코스 추천 ----------
const wantsMeet = k => k === "meet" || k === "again";

const COURSE_COST = ["", "1인 1~2만 원대", "1인 3~5만 원대", "1인 5만 원 이상"];
// 점수 = 관심사 겹침 + 1.2 × 취향 좌표 가까움 + 생활 패턴 보정
function courseScore(c, me, o, vec) {
  const all = me.interests.concat(o.interests);
  let s = 0;
  for (const t of c.tags) {
    const a = me.interests.includes(t), b = o.interests.includes(t);
    if (a && b) s += 1;
    else if (a || b) s += 0.3 * E.levelOf(a ? me : o, t);
    else if (all.some(u => E.CAT_OF[u] === E.CAT_OF[t])) s += 0.1;
  }
  s += 1.2 * E.cosine(E.vecOfTags(c.tags), vec);
  const both = (f, v) => me[f] === v && o[f] === v, either = (f, v) => me[f] === v || o[f] === v;
  if (c.drink && either("drinking", "none")) s -= 1.5;
  if (c.cost === 3 && either("spending", "saver")) s -= 0.4;
  if (c.out && both("weekend", "home")) s -= 0.3;
  if (c.out && both("weekend", "out")) s += 0.3;
  if (c.m.includes("cozy") && both("weekend", "home")) s += 0.3;
  return s;
}
function courseWhy(c, me, o) {
  const common = c.tags.filter(t => me.interests.includes(t) && o.interests.includes(t));
  if (common.length) return `둘 다 ${josa(common.join(", "), "을", "를")} 좋아해서`;
  const mine = c.tags.find(t => me.interests.includes(t)), theirs = c.tags.find(t => o.interests.includes(t));
  if (mine && theirs) return `내 ${mine} 취향과 ${o.nickname}님의 ${theirs} 취향을 섞어서`;
  if (theirs) return `${o.nickname}님이 ${josa(theirs, "을", "를")} 좋아해서`;
  if (mine) return `내가 좋아하는 ${mine} 취향에 맞춰서`;
  return "두 분 취향 좌표와 가까운 코스";
}
function meetPlan(me, o, mood = "auto") {
  const mid = { lat: (me.lat + o.lat) / 2, lng: (me.lng + o.lng) / 2 };
  const near = REGIONS.map(r => ({ r: r[0], d: E.dist(mid, { lat: r[1], lng: r[2] }) })).sort((a, b) => a.d - b.d)[0].r;
  const area = near;
  const ov = E.personVec(o), vec = E.personVec(me).map((x, i) => x + ov[i]);
  const both = (f, v) => me[f] === v && o[f] === v;
  const courses = COURSES.filter(c => mood === "auto" || c.m.includes(mood))
    .map(c => ({ ...c, score: courseScore(c, me, o, vec) })).sort((a, b) => b.score - a.score)
    .map(c => ({ ...c, why: courseWhy(c, me, o),
      time: c.dur === "하루" || c.dur === "반나절" ? "주말 오전 10시" : c.drink ? "금요일 저녁 7시" : c.out ? (both("chronotype", "night") ? "주말 오후 2시" : "주말 오전 11시")
        : both("chronotype", "night") ? "평일 저녁 7시" : both("chronotype", "morning") ? "주말 오전 11시" : "주말 오후 2시" }));
  return { near, area, courses, noDrink: me.drinking === "none" || o.drinking === "none" };
}
function planCard(me, o) {

  const per = 3, pages = Math.max(1, Math.ceil(pl.courses.length / per)), page = S.planPage % pages;
  const shown = pl.courses.slice(page * per, page * per + per);
  return `<div class="plan"><div class="sig-head"><b class="h">${title}</b><button class="btn line sm" data-act="planopen">접기</button></div>

    <span style="font-size:14px">중간 지점 <b>${esc(pl.area)}</b> 근처로 골랐어요. 어떤 데이트가 끌려요?</span>
    <div class="tabs2" role="tablist" aria-label="데이트 분위기">${MOODS.map(([k, label]) => `<button role="tab" aria-selected="${S.planMood === k}" data-act="planmood" data-v="${k}">${label}</button>`).join("")}</div>
    <div class="course-list">${shown.map((c, i) => `<div class="course">
      <div class="course-head"><b>${esc(c.t)}</b><span class="muted">${esc(c.dur)} · ${COURSE_COST[c.cost]}</span></div>
      <span class="course-why">${esc(c.why)}</span>
      <ol class="course-steps">${c.steps.map(st => { const [label, q] = st.split("|");
        return `<li>${q ? `<a href="https://map.naver.com/p/search/${encodeURIComponent(pl.area + " " + q)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label)}</li>`; }).join("")}</ol>
      <span class="muted" style="font-size:12px">${esc(c.note)}</span>
      <div class="course-foot"><span style="font-size:13px">추천 시간 · ${esc(c.time)}</span><button class="btn sm" data-act="propose" data-i="${page * per + i}">이 코스 제안하기</button></div>
    </div>`).join("")}</div>
    <div class="course-foot">${pl.noDrink ? `<span class="muted" style="font-size:12px">두 분 생활 취향에 맞춰 술자리 코스는 뒤로 보냈어요</span>` : "<span></span>"}${pages > 1 ? `<button class="btn line sm" data-act="planmore">다른 코스 보기 (${page + 1}/${pages})</button>` : ""}</div>
  </div>`;
}

function hotPicks(me, o) {
  const mid = { lat: (me.lat + o.lat) / 2, lng: (me.lng + o.lng) / 2 };
  const noDrink = me.drinking === "none" || o.drinking === "none", homey = me.weekend === "home" && o.weekend === "home";
  const scored = HOTSPOTS.map(h => {
    let best = null, bestV = -1;
    const vals = h.tags.map(t => {
      const a = me.interests.includes(t), b = o.interests.includes(t);
      const v = a && b ? 1.2 : a || b ? 0.35 * E.levelOf(a ? me : o, t) : 0;
      if (v > bestV) { bestV = v; best = t; }
      return v;
    }).sort((x, y) => y - x);
    let s = vals[0] + 0.5 * (vals[1] || 0);   // 태그가 많은 곳이 유리하지 않게 잘 맞는 두 개만
    const dMe = E.dist(me, h), dO = E.dist(o, h);
    s -= 0.08 * (dMe + dO) / 2 + 0.05 * Math.abs(dMe - dO);   // 멀수록, 한쪽만 멀수록 뒤로
    if (h.drink && noDrink) s -= 1.5;
    if (h.out && homey) s -= 0.2;
    const both = h.tags.filter(t => me.interests.includes(t) && o.interests.includes(t));
    const one = h.tags.find(t => o.interests.includes(t)) || h.tags.find(t => me.interests.includes(t));
    const why = both.length ? `둘 다 ${josa(both.slice(0, 2).join("·"), "을", "를")} 좋아해서` : one ? `${o.interests.includes(one) ? o.nickname + "님이" : "내가"} ${josa(one, "을", "를")} 좋아해서` : "두 분 중간쯤 요즘 뜨는 곳";
    return { ...h, s, dMe, dO, why, query: `${h.q} ${HOT_Q[best] || ""}`.trim(), fair: Math.abs(dMe - dO) <= 3 };
  }).sort((a, b) => b.s - a.s);
  // 전국이라 다른 도시 핫플이 섞이지 않게: 두 사람 평균 25km 안 → 모자라면 80km 안 → 그래도 모자라면 가까운 순 6곳
  const within = km => scored.filter(h => (h.dMe + h.dO) / 2 <= km);
  const near = within(25).length >= 3 ? within(25) : within(80);
  return near.length >= 3 ? near : scored.slice(0, 6);
}
const km = d => d < 1 ? "1km 안" : `${Math.round(d)}km`;

// 지도 (Leaflet + OpenStreetMap 바탕 지도). 핫플 화면을 처음 열 때만 불러오고,
// 화면을 다시 그려도 지도는 그대로 두고 자리만 옮겨 붙임 (깜빡임·타일 재로딩 없이)
let LMAP = null, mapEl = null, mapKey = "";
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return loadLeaflet.p || (loadLeaflet.p = new Promise((ok, fail) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = ok; js.onerror = () => { loadLeaflet.p = null; fail(); }; document.head.appendChild(js);
  }));
}
function mountHotMap() {
  const slot = document.getElementById("hot-map"), c = S.hotCtx;
  if (!slot || !c) return;
  if (!mapEl) { mapEl = document.createElement("div"); mapEl.className = "hot-map"; mapEl.setAttribute("aria-label", "두 사람 위치와 추천 핫플 지도"); }
  slot.replaceWith(mapEl);
  loadLeaflet().then(() => {
    if (!mapEl.isConnected) return;
    if (!LMAP) {
      LMAP = L.map(mapEl, { zoomControl: false, scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(LMAP);
      LMAP.dul = L.layerGroup().addTo(LMAP);
    }
    LMAP.invalidateSize();
    const { me, o, picks, sel } = c, key = [me.id, o.id, picks.map(h => h.id).join(","), sel].join("|");
    if (key === mapKey) return;
    const moved = !mapKey.startsWith([me.id, o.id, picks.map(h => h.id).join(",")].join("|"));
    mapKey = key;
    const g = LMAP.dul; g.clearLayers();
    const pin = (ll, html, cls, size, z) => L.marker(ll, { icon: L.divIcon({ className: "", html: `<div class="mpin ${cls}">${html}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }), zIndexOffset: z, keyboard: false }).addTo(g);
    L.polyline([[me.lat, me.lng], [o.lat, o.lng]], { color: "#8E91EE", weight: 2, dashArray: "4 6", interactive: false }).addTo(g);
    pin([me.lat, me.lng], esc(me.nickname[0]), "who me", 30, 1500);   // 두 사람 핀은 핫플 핀에 가려지지 않게 맨 위
    pin([o.lat, o.lng], esc(o.nickname[0]), "who them", 30, 1500);
    picks.forEach((h, i) => pin([h.lat, h.lng], `${h.e}<b>${S.hotPage % Math.ceil(HOTSPOTS.length / 3) * 3 + i + 1}</b>`, "spot" + (i === sel ? " on" : ""), 42, i === sel ? 1000 : 500)
      .on("click", () => { S.hotSel = i; render(); }));
    if (moved) LMAP.fitBounds([[me.lat, me.lng], [o.lat, o.lng], ...picks.map(h => [h.lat, h.lng])], { padding: [40, 40], maxZoom: 14 });
    else LMAP.panTo([picks[sel].lat, picks[sel].lng]);
  }).catch(() => { mapEl.innerHTML = `<div class="map-off">지도를 불러오지 못했어요.<br>아래 네이버 지도·카카오맵 버튼으로 볼 수 있어요.</div>`; });
}

    <h4>4. 보관 기간</h4><p>탈퇴하면 프로필, 사진, 보낸 좋아요와 마음 표현, 차단 기록을 바로 지워요. 주고받은 대화는 상대방의 기록이기도 해서 상대 쪽에 남아요. 신고 기록은 분쟁 확인을 위해 처리 후 1년 동안 보관해요.</p>
    <h4>5. 맡기는 곳</h4><p>회원 인증과 데이터 저장은 Google Firebase(Google LLC)를, AI 기능은 Anthropic(Claude API)을 이용해요(2-1 참고). 그 밖의 곳에 개인정보를 팔거나 넘기지 않아요.</p>
    <h4>6. 내 권리</h4><p>언제든 내 정보에서 프로필을 고치거나 탈퇴할 수 있고, 내 정보의 열람·정정·삭제를 요청할 수 있어요.</p>
    <h4>7. 문의</h4><p>개인정보 관련 문의는 ${contact}로 알려주세요.</p></div>`;
}

  } else if (tab === "verify") {

      <div>요청한 자세: <b>${esc(v.pose)}</b></div>

      <div style="display:flex;gap:8px"><button class="btn sm" data-act="adm-verify" data-id="${uid}">같은 사람이에요 · 승인</button><button class="btn line sm" data-act="adm-reject" data-id="${uid}">반려</button></div></div>`; }).join("") : `<div class="empty">${EMPTY_ART}<b>기다리는 인증이 없어요</b></div>`;
  } else {

function homeView(me) {
  const w = world();
  const { recs, rejected } = w.lists[me.id];
  const dp = dailyPicks(me);
  const byRec = Object.fromEntries(recs.map(r => [r.id, r]));
  const shown = dp.ids.filter(id => !dp.passed.includes(id) && byRec[id]).map(id => byRec[id]);
  const remaining = recs.filter(r => !dp.ids.includes(r.id) && !dp.passed.includes(r.id)).length;
  const passed = dp.passed;
  const auto = w.auto[me.id];
  let top = "";
  if (!me.has_photo) top += `<div class="notice warn">프로필 사진이 없어서 다른 사람 추천에 내가 나오지 않아요. <button class="btn sm" data-act="tab" data-v="me">사진 등록하기</button></div>`;
  if (auto) {
    const o = w.byId[auto.partner];
    top += `<div class="match-banner"><div class="pair">${photo(me, "av")}<span class="heart" aria-hidden="true">♥</span>${photo(o, "av")}</div>
      <h3>${esc(o.nickname)}님과 자동 매칭됐어요</h3>
      <p class="muted" style="margin:0;font-size:14px">서로가 서로의 1순위 추천이라 바로 연결됐어요.</p>
      <div class="sig-mini">${SIG_PRE.map(k => { const on = sigOf(me.id, o.id)?.kind === k; return `<button class="sig-opt${on ? " on" : ""}" data-act="sig" data-id="${o.id}" data-k="${k}" aria-pressed="${on}">♥ ${SIG[k]}</button>`; }).join("")}</div>
      ${sigOf(o.id, me.id)?.kind ? `<div class="sig-their">${esc(o.nickname)}님의 마음 · <b>${SIG[sigOf(o.id, me.id).kind]}</b></div>` : ""}
      <div style="display:flex;gap:8px"><button class="btn sm" data-act="openchat" data-id="${o.id}">메시지 보내기</button><button class="btn line sm" data-act="open" data-id="${o.id}">프로필 보기</button></div></div>`;
  }
  for (const o of pendingAfters(me)) top += afterCard(me, o, false);
  for (const m of matchesOf(me.id)) if (afterState(me.id, m.id) === "both" && Date.now() - afterOf(me.id, m.id).at < 3 * 864e5) top += `<div class="after both"><b>애프터 성사! ${esc(w.byId[m.id].nickname)}님도 또 만나고 싶대요</b><button class="btn sm" style="align-self:flex-start" data-act="openchat" data-id="${m.id}">약속 잡으러 가기</button></div>`;
  const searchBar = `<form class="search" id="search-form" role="search"><input type="search" id="q" enterkeyhint="search" placeholder="관심사로 찾기 · 예: 야구 맛집, 주말엔 산 타요" autocomplete="off" value="${esc(S.q)}" aria-label="관심사로 사람 찾기">${S.q ? `<button type="button" class="icon-btn" data-act="clearq" aria-label="검색 지우기">${ICON.close}</button>` : ""}</form>`;
  const title = `<div class="screen-title"><h2>오늘도 좋은 인연이<br>기다리고 있어요 <span class="hrt" aria-hidden="true">♥</span></h2>`;
  const fo = focusOf(me.id);
  if (fo) {
    const o = w.byId[fo.id];
    return `${title}<span class="muted">집중 모드 · 새 추천을 잠시 쉬고 있어요</span></div>${pendingAfters(me).map(x => afterCard(me, x, false)).join("")}
      <div class="match-banner"><div class="pair">${photo(me, "av")}<span class="heart" aria-hidden="true">♥</span>${photo(o, "av")}</div>
        <h3>${esc(o.nickname)}님에게 집중하는 중이에요</h3>
        <p class="muted" style="margin:0;font-size:14px">새 추천을 쉬고, 다른 사람의 추천에도 나오지 않아요. 두 분의 대화와 매칭은 그대로예요.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="openchat" data-id="${o.id}">대화하기</button><button class="btn line sm" data-act="focus-off">집중 모드 끄기</button></div></div>`;
  }
  const nm = matchesOf(me.id).length;
  if (nm >= MATCH_CAP) top += `<div class="notice">지금 <b>${nm}명</b>과 대화 중이에요. 동시에 ${MATCH_CAP}명까지라, 새 좋아요는 한 명과 대화를 마친 뒤에 보낼 수 있어요. <button class="btn line sm" data-act="tab" data-v="match">매칭 정리하기</button></div>`;
  if (S.q.trim()) return searchBar + searchView(me);
  const cards = shown.length ? shown.map((r, i) => recCard(me, w.byId[r.id], r, dp.fresh && dp.fresh.id === r.id ? dp.fresh : null, i)).join("") : (recs.length ? "" : emptyRecs(0, rejected));
  const d = new Date(), dayLabel = `${d.getMonth() + 1}월 ${d.getDate()}일`;
  const extraLeft = Math.max(0, 3 - dp.extra);

      ${remaining && extraLeft ? `<button class="btn line sm" data-act="more">한 명 더 보기 · 오늘 ${extraLeft}번 남음</button>` : ""}
      ${passed.length ? `<button class="btn line sm" data-act="unpass">넘긴 ${passed.length}명 다시 보기</button>` : ""}</div>` : "";
  const fewNote = recs.length && recs.length < REC_LIMIT ? relaxHtml(me, true) : "";
  const unpassNote = !doneNote && passed.length ? `<div class="daily-note"><button class="btn line sm" data-act="unpass">넘긴 ${passed.length}명 다시 보기</button></div>` : "";
  return `${title}<span class="muted">${dayLabel} 오늘의 추천 · 내 등급 ${tierBadge(me)}${w.tierOn ? " · 비슷한 등급끼리 골랐어요" : ""}</span></div>${searchBar}
    ${recs.length ? `<button class="sim-entry" data-act="simopen"><b>만약에?</b><span>관심사를 더 보면, 거리를 덜 보면… 순위가 어떻게 바뀌는지 미리 보기</span>${ICON.back}</button>` : ""}
    ${top}${cards}${doneNote}${unpassNote}${fewNote}`;
}
function searchView(me) {
  const { tags, cats, via, qv, results, pool } = searchPeople(me, S.q);
  if (!tags.length && !cats.length) return `<div class="empty">${EMPTY_ART}<b>맞는 관심사를 못 찾았어요</b>"등산", "카페", "운동"처럼 관심사 이름을 넣어보세요.</div>`;
  const understood = [...tags.map(t => via[t] !== t ? `${t} (${via[t]})` : t), ...cats.map(c => `${c} 전체`)];
  const rows = results.slice(0, 8).map(({ o, exact, cos, rec }) => {
    const tagsHtml = o.interests.map(t => `<span class="chip${exact.includes(t) ? " hit" : ""}">${esc(t)}${E.levelOf(o, t) === 3 ? " ★" : ""}</span>`).join("");
    const g = rec ? `<span class="grade${grade(rec.score)[1] ? " top" : ""}">${S.dev ? f1(rec.score) + "점" : grade(rec.score)[0]}</span>` : `<span>추천 조건 밖</span>`;
    return `<div class="item" data-act="open" data-id="${o.id}">${photo(o, "av")}<div class="meta"><b>${esc(o.nickname)}${vb(o)} <span class="muted" style="font-weight:400;font-size:13px">${o.age}세 · ${esc(o.region.replace("서울 ", ""))}</span></b>
      <div class="near"><span class="near-bar"><i style="width:${Math.max(0, Math.round(cos * 100))}%"></i></span><span class="num">${S.dev ? cos.toFixed(3) : "가까움 " + Math.round(cos * 100) + "%"}</span>${exact.length ? "" : `<span class="muted">· 태그는 달라도 취향이 비슷해요</span>`}</div>
      <div class="chips" style="margin-top:4px">${tagsHtml}</div></div><div class="side">${g}</div></div>`;
  }).join("");

// 8차원 좌표를 2차원 지도로: 점 사이 거리가 가까울수록 취향이 비슷해요
function tasteMap(me, qv, pool, topIds) {
  const people = [me, ...pool];
  const pr = E.project2D(people.map(E.personVec));
  const qp = pr.comps.map(u => qv.reduce((s2, x, i) => s2 + (x - pr.mean[i]) * u[i], 0));
  const all = [...pr.points, qp];
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const W = 340, H = 220, P = 28;
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sx = x => P + (x - minX) / ((maxX - minX) || 1) * (W - 2 * P);
  const sy = y => P + (y - minY) / ((maxY - minY) || 1) * (H - 2 * P);
  const Q = [sx(qp[0]), sy(qp[1])];
  let lines = "", dots = "", labels = "";
  people.forEach((o, i) => {
    const [x, y] = [sx(pr.points[i][0]), sy(pr.points[i][1])];
    const isMe = i === 0, top = topIds.includes(o.id);
    if (top) lines += `<line x1="${Q[0].toFixed(1)}" y1="${Q[1].toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="m-line"/>`;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isMe || top ? 6 : 4}" class="${isMe ? "m-me" : top ? "m-top" : "m-dot"}"/>`;
    if (isMe || top) labels += `<text x="${(x + 9).toFixed(1)}" y="${(y + 4).toFixed(1)}" class="m-lab${isMe ? " me" : ""}">${esc(isMe ? "나" : o.nickname)}</text>`;
  });
  const star = `<path d="M${Q[0]} ${Q[1] - 9} l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6-4.6-4.1 6.1-.6z" class="m-q"/><text x="${(Q[0] + 11).toFixed(1)}" y="${(Q[1] + 4).toFixed(1)}" class="m-lab q">검색어</text>`;
  return `<section class="panel map"><div class="map-head"><b>취향 지도</b><span class="muted">가까울수록 비슷한 취향 · 관심사 8개 축을 2차원으로 펼친 그림</span></div>
    <div class="map-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="검색어와 가까운 사람들의 취향 지도">${lines}${dots}${star}${labels}</svg></div>
    <div class="legend"><span><i class="lg m-q"></i>검색어</span><span><i class="lg m-top"></i>가장 가까운 3명</span><span><i class="lg m-me"></i>나</span><span><i class="lg m-dot"></i>공개한 다른 사람</span></div></section>`;
}
// 개발자 화면: 검색어와 1위의 좌표를 축별로 비교
function axisTable(qv, o) {

function simList(me) {

  const next = E.rescore(w.ctx, me, now, w.byId, simEff(me));
  const before = Object.fromEntries(now.map((r, i) => [r.id, i]));
  const N = Math.min(5, next.length);
  const rows = next.slice(0, N).map((r, i) => {

    const mv = b >= N ? `<span class="mv up">새로 · 원래 ${b + 1}위</span>` : d > 0 ? `<span class="mv up">▲ ${d}</span>` : d < 0 ? `<span class="mv down">▼ ${-d}</span>` : `<span class="mv">그대로</span>`;

  }).join("");
  const out = now.slice(0, N).filter(r => !next.slice(0, N).some(x => x.id === r.id)).map(r => esc(w.byId[r.id].nickname));
  const changedN = next.slice(0, N).filter((r, i) => before[r.id] !== i).length;

async function deleteAccount() {
  const uid = S.uid;
  const mine = col => Object.entries(col).filter(([, d]) => d && d.from === uid).map(([id]) => id);
  const likeIds = mine(S.likes), sigIds = mine(S.signals), blockIds = mine(S.blocks), afterIds = mine(S.afters);
  try {
    if (S.db) {
      for (const id of likeIds) await S.db.doc("likes/" + id).delete();
      for (const id of sigIds) await S.db.doc("signals/" + id).delete();
      for (const id of blockIds) await S.db.doc("blocks/" + id).delete();
      for (const id of afterIds) await S.db.doc("afters/" + id).delete();
      if (myVerif()) await S.db.doc("verifications/" + uid).delete().catch(() => {});
      if (S.fb) await S.db.doc("priv/" + uid).delete().catch(() => {});
      await S.db.doc("users/" + uid).delete();
    }
    if (S.fb) {
      try { await S.fb.auth().currentUser.delete(); }
      catch (e) { await S.fb.auth().signOut().catch(() => {}); }
    }
  } catch (e) { toast("탈퇴하지 못했어요. 잠시 뒤 다시 해주세요"); return; }
  for (const id of likeIds) delete S.likes[id];
  for (const id of sigIds) delete S.signals[id];
  for (const id of blockIds) delete S.blocks[id];
  for (const id of afterIds) delete S.afters[id];
  delete S.verifs[uid]; S.myVerif = null;
  delete S.users[uid]; ver++;
  if (!S.fb) try { localStorage.removeItem("gm-priv:" + uid); } catch (e) {}
  S.confirmDel = false; S.uid = null; ls.set("gm-uid", null); S.authTab = "login"; S.draft = null; S.tab = "home";
  if (S.fb) { location.reload(); return; }
  render(); toast("탈퇴했어요. 그동안 고마웠어요");
}

function weightLabel(v, sum) {

// ---------------- AI 기능 (server/main.py 의 LLM 서버를 부름) ----------------
// 비워 두면 같은 주소의 /api (시연판을 AI 서버에서 열 때). 배포판은 build_deploy.py가 DUL_AI_URL로 넣어 줌
const AI_URL = String(window.DUL_AI_URL || "").replace(/\/$/, "");
const aiState = slot => S.ai[slot] || {};
async function aiFetch(path, body) {
  const headers = { "Content-Type": "application/json" };
  const u = S.fb && S.fb.auth().currentUser;
  if (u) headers.Authorization = "Bearer " + await u.getIdToken();   // 서버가 로그인한 회원인지 확인
  let r;
  try { r = await fetch(`${AI_URL}/api/${path}`, { method: "POST", headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error("AI 서버에 연결하지 못했어요. AI 서버가 켜져 있는지 확인해주세요."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "AI가 답하지 못했어요. 잠시 뒤 다시 해주세요.");
  return j;
}
// 결과는 S.ai[slot]에 담아 두고 화면만 다시 그림 (같은 사람에게 다시 열면 그대로 보임)
async function aiRun(slot, path, body) {
  if (aiState(slot).loading) return;
  S.ai[slot] = { loading: true }; render();
  try { S.ai[slot] = { data: await aiFetch(path, body) }; }
  catch (e) { S.ai[slot] = { error: e.message }; }
  render();
}
function aiStatus(st) {
  if (st.loading) return `<div class="ai-wait" role="status">AI가 생각하는 중이에요</div>`;
  if (st.error) return `<div class="notice warn" style="font-size:13px">${esc(st.error)}</div>`;
  return "";
}
// LLM에 보내는 프로필: 다른 회원에게도 보이는 정보만 (아이디, 생년월일, 좌표, 사진, 종교, 외모는 안 보냄)

  return msgs.filter(m => !m.sig).slice(-30).map(m => ({ who: m.from === me.id ? "me" : "them", text: m.img ? "[사진]" : String(m.text).slice(0, 500) }));

// 위험 신호 1차 확인: 브라우저 안에서 단어만 보고 표시 (대화가 밖으로 나가지 않음). 자세한 판단은 회원이 원할 때만 AI에게
const RISK = [
  { k: "money", label: "금전 요구", high: true, re: /(돈\s?(좀|을|이)?\s?(빌려|보내|부쳐|필요)|송금|입금|계좌|이체|급전|대출|병원비|수술비|합의금|보증금|상품권|기프트\s?카드|문상|빌려\s?줄)/ },
  { k: "invest", label: "투자 권유", high: true, re: /(투자|코인|비트코인|리딩\s?방|수익률|원금\s?보장|고수익|선물\s?거래|재테크|테더|usdt|거래소|마진)/i },
  { k: "threat", label: "협박·위협", high: true, re: /(가만\s?안\s?둬|가만\s?두지\s?않|죽여|유포|퍼뜨릴|퍼트릴|뿌릴\s?거|신상|찾아\s?갈|찾아간다|협박|두고\s?보자|후회하게)/ },
  { k: "personal", label: "개인정보 요구", high: true, re: /(주민\s?번호|인증\s?번호|비밀\s?번호|신분증|여권\s?사진|카드\s?번호|otp)/i },
  { k: "offsite", label: "앱 밖으로 연락 유도", high: false, re: /(텔레그램|위챗|왓츠앱|whatsapp|오픈\s?채팅|라인\s?아이디|https?:\/\/|bit\.ly)/i },
];
function riskScan(msgs, meId) {
  const hits = [];
  let run = 0, maxRun = 0;
  for (const m of msgs) {
    if (m.sig) continue;
    if (m.from === meId) { run = 0; continue; }
    maxRun = Math.max(maxRun, ++run);
    if (m.text) for (const r of RISK) if (r.re.test(m.text)) hits.push({ k: r.k, label: r.label, high: r.high, quote: m.text.slice(0, 100) });
  }
  if (maxRun >= 6) hits.push({ k: "repeat", label: "답 없이 이어지는 메시지", high: false, quote: `답장 없이 ${maxRun}개 연달아` });
  return hits;
}

// ---------------- 렌더 ----------------
let lastScreen = "";
function render() {
  const app = document.getElementById("app");
  const authed = S.uid && world().byId[S.uid];
  const screen = authed ? `${S.tab}|${S.detail}|${S.chat}` : `auth|${S.authTab}`;
  const keep = {};
  if (screen === lastScreen) for (const el of app.querySelectorAll("input[id], textarea[id], select[id]")) {
    if (el.type === "file") continue;
    keep[el.id] = el.type === "checkbox" || el.type === "radio" ? { c: el.checked } : { v: el.value };
  }
  const active = document.activeElement?.id;
  const log = document.getElementById("chat-log");
  const nearBottom = log ? log.scrollHeight - log.scrollTop - log.clientHeight < 80 : true;
  const scrollY = window.scrollY;
  S.enter = screen !== lastScreen;
  if (authed && !isSuspended(S.uid)) checkNewMatch(world().byId[S.uid]);
  if (authed && S.fb && S.usersLoaded && !S.seenSaved && Date.now() - (S.users[S.uid]?.seenAt || 0) > 12 * 36e5) { S.seenSaved = true; setTimeout(() => saveUser(S.uid, { seenAt: Date.now() }), 0); }
  app.innerHTML = (authed ? (isSuspended(S.uid) ? suspendedView() : shell() + (S.hot ? hotView(world().byId[S.uid]) : "") + (S.celebrate ? celebrateView(world().byId[S.uid]) : "")) : authView()) + (S.legal ? legalView() : "");
  if (S.celebrate) { celebFx(S.celebrate.fresh); S.celebrate.fresh = false; }
  if (S.hot) mountHotMap();
  if (S.prefill != null) { const ci = document.getElementById("chat-input"); if (ci) { ci.value = S.prefill; S.prefill = null; ci.focus({ preventScroll: true }); } }
  if (authed && !isSuspended(S.uid)) browserNotify(world().byId[S.uid]);
  if (screen === lastScreen) {
    for (const [id, st] of Object.entries(keep)) { const el = document.getElementById(id); if (!el) continue; if ("c" in st) el.checked = st.c; else el.value = st.v; }
    window.scrollTo(0, scrollY);
  }
  if (active) { const el = document.getElementById(active); if (el && el.type !== "file") el.focus({ preventScroll: true }); }
  const nlog = document.getElementById("chat-log");
  if (nlog && (nearBottom || screen !== lastScreen)) nlog.scrollTop = nlog.scrollHeight;
  if (S.chat && authed) markRead(pk(S.uid, S.chat));
  lastScreen = screen;
  document.body.classList.toggle("locked", anyOpen());
  syncBack();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const me = S.uid;
  switch (act) {
    case "authtab": S.authTab = t.dataset.v; S.authError = ""; render(); break;
    case "demo": if (REAL) break;
      if (S.fb && S.fb.auth().currentUser && !S.fb.auth().currentUser.isAnonymous) { ls.set("gm-uid", id); S.fb.auth().signOut().finally(() => location.reload()); break; }
      login(id); break;
    case "tab": S.tab = t.dataset.v; S.detail = null; S.chat = null; S.sigOpen = false; if (t.dataset.v === "home" && S.tab === "home") S.q = S.q; render(); window.scrollTo(0, 0); break;
    case "dev": S.dev = !S.dev; ls.set("gm-dev", S.dev); render(); break;
    case "open": S.detail = id; render(); break;
    case "close": S.detail = null; render(); break;
    case "openchat": S.chat = id; S.detail = null; S.sigOpen = false; render(); break;
    case "closechat": S.chat = null; S.sigOpen = false; S.planOpen = false; S.planMood = "auto"; S.planPage = 0; S.aiOpen = false; render(); break;
    // ---------- AI ----------
    case "ai-match": {

      const r = full(me, w.lists[me].recs.find(x => x.id === id));
      aiRun("match:" + pk(me, id), "match-insight", { me: aiPerson(w.byId[me]), other: aiPerson(o, w.byId[me]),
        reasons: r ? r.reasons.map(reasonText).filter(Boolean).slice(0, 12) : [], score: r ? Math.round(r.score) : null });
      break;
    }
    case "ai-open": S.aiOpen = !S.aiOpen; render(); break;
    case "ai-tab": S.aiTab = t.dataset.v; render(); break;
    case "ai-tone": S.aiTone = t.dataset.v; render(); break;
    case "ai-reply": case "ai-topics": case "ai-safety": {
      const w = world(), meP = w.byId[me], o = w.byId[S.chat]; if (!o) break;
      const key = pk(me, o.id), log = aiLog(meP, o), msgs = S.chats[key]?.messages || [];
      if (act === "ai-reply") aiRun("reply:" + key, "chat-coach", { me: aiPerson(meP), other: aiPerson(o, meP), messages: log, tone: S.aiTone,
        stale: !!msgs.length && Date.now() - msgs[msgs.length - 1].at > 864e5 });
      else if (act === "ai-topics") { const plan = msgs.filter(m => m.text?.startsWith("[데이트 제안]")).pop();
        aiRun("topics:" + key, "first-meet", { me: aiPerson(meP), other: aiPerson(o, meP), plan: plan ? plan.text.slice(0, 200) : "" }); }
      else { if (!log.some(m => m.who === "them")) return toast("아직 상대가 보낸 메시지가 없어요");
        aiRun("safety:" + key, "safety", { other_nickname: o.nickname, messages: log,
          rule_hits: riskScan(msgs, me).map(h => ({ label: h.label, quote: h.quote })).slice(0, 20) }); }
      break;
    }
    case "ai-use": { const inp = document.getElementById("chat-input"); if (inp) { inp.value = t.dataset.text; inp.focus(); } break; }
    case "ai-safe-open": S.aiOpen = true; S.aiTab = "safety"; render(); break;
    case "ai-safe-hide": S.riskSeen[pk(me, S.chat)] = +t.dataset.n; render(); break;
    case "ai-report": {
      const d = aiState("safety:" + pk(me, id)).data;
      const top = d?.signals.find(s => s.type in SIGNAL_REASON);
      S.reportPreset = top ? SIGNAL_REASON[top.type] : REPORT_REASONS.length - 1;
      S.reportDetail = d ? `[AI 점검 참고] ${d.summary}`.slice(0, 500) : "";

    case "ai-plan": {

    sendMsg(pk(S.uid, S.chat), S.uid, text);
    botAnswer(S.uid, S.chat);
    document.getElementById("chat-input")?.focus();
  }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "verif-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    try { const url = await resizeImage(file, { max: 720, quality: 0.72 }); setVerif(S.uid, { uid: S.uid, src: url, pose: poseFor(S.uid), at: Date.now(), status: "pending" }); toast("인증 사진을 보냈어요. 운영자가 확인할게요"); }
    catch (err) { toast("이미지 파일만 올릴 수 있어요"); }
    return;
  }
  if (el.id === "chat-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!S.canWrite) return toast("보기 전용이라 보낼 수 없어요");
    try { const url = await resizeImage(file, { max: 720, quality: 0.72 }); sendImage(pk(S.uid, S.chat), S.uid, url); }
    catch (err) { toast("이미지 파일만 보낼 수 있어요"); }
    return;
  }
  if (el.dataset && el.dataset.met) {
    if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
    setSignal(S.uid, el.dataset.met, { met: el.checked, metAt: el.checked ? Date.now() : null });
    toast(el.checked ? "만난 뒤의 마음을 표현할 수 있어요" : "만나기 전 단계로 돌렸어요");
    return;
  }
  if (el.id === "su-photo" || el.id === "me-photo") {
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      const url = await shrinkPhoto(file);
      if (el.id === "su-photo") { S.signup.photo = url; render(); }
      else { if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요"); saveUser(S.uid, { photo: url }); toast("사진을 등록했어요"); }
    } catch (err) { toast("이미지 파일만 올릴 수 있어요"); }
    return;
  }
  if (el.id === "me-pub") {
    if (!S.canWrite) return toast("보기 전용이라 저장할 수 없어요");
    saveUser(S.uid, { edits: { ...(S.users[S.uid]?.edits || {}), searchable: el.checked } });
    toast(el.checked ? "검색에 공개했어요" : "검색에서 숨겼어요");
    return;
  }
  if (el.id === "set-related") { saveUser(S.uid, { settings: { ...plain(settingsOf(S.uid)), related: el.checked } }); return; }
  if (el.dataset.w) {
    const s = plain(settingsOf(S.uid));
    s.weights = { ...E.baseWeights(world().byId[S.uid], s) };
    s.weights[el.dataset.w] = +el.value;
    saveUser(S.uid, { settings: s });
  }
});
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") { const v = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = v; render(); }, 180); return; }
  const sk = e.target.dataset?.sw;
  if (sk && S.sim) {
    S.sim.W[sk] = +e.target.value;
    const sum = E.KEYS.reduce((t, kk) => t + S.sim.W[kk], 0) || 1;
    for (const kk of E.KEYS) { const lab = document.querySelector(`[data-swv="${kk}"]`); if (lab) lab.textContent = weightLabel(S.sim.W[kk], sum); }
    const box = document.getElementById("sim-list"); if (box) box.innerHTML = simList(world().byId[S.uid]);
    return;
  }
  const k = e.target.dataset?.w;
  if (!k) return;
  const ws = { ...E.baseWeights(world().byId[S.uid], settingsOf(S.uid)), [k]: +e.target.value };
  const sum = E.KEYS.reduce((t, kk) => t + ws[kk], 0) || 1;
  for (const kk of E.KEYS) { const lab = document.querySelector(`[data-wv="${kk}"]`); if (lab) lab.textContent = weightLabel(ws[kk], sum); }
});
// 맨 위에 열린 것 하나 닫기 (Esc, 핸드폰 뒤로 가기 공통)
function closeTop() {
  if (S.celebrate) S.celebrate = null;
  else if (S.hot) S.hot = null;
  else if (S.sim) S.sim = null;
  else if (S.legal || S.report || S.menu || S.notifOpen) { S.legal = S.report = S.menu = null; S.notifOpen = false; S.menuEnd = false; }
  else if (S.lightbox) S.lightbox = null;
  else if (S.admin && !S.chat && !S.detail) S.admin = false;
  else if (S.chat) S.chat = null;
  else if (S.detail) S.detail = null;
  else return false;
  render();
  return true;
}
const anyOpen = () => !!(S.uid && (S.celebrate || S.hot || S.sim || S.legal || S.report || S.menu || S.notifOpen || S.lightbox || S.admin || S.chat || S.detail));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTop(); });

// 안드로이드 뒤로 가기: 시트가 열려 있으면 앱을 나가지 않고 시트만 닫음
// 시트가 열릴 때 방문 기록을 하나 쌓고, 뒤로 가기(popstate)가 오면 맨 위 시트를 닫음
let backPushed = false, skipPop = false;
function syncBack() {
  try {
    const open = anyOpen();
    if (open && !backPushed) { history.pushState({ dulSheet: 1 }, ""); backPushed = true; }
    else if (!open && backPushed) { backPushed = false; skipPop = true; history.back(); }   // X 버튼으로 닫았으면 쌓아 둔 기록도 지움
  } catch (e) { /* 기록을 못 쓰는 곳(미리보기 등)에서는 그냥 둠 */ }
}
window.addEventListener("popstate", () => {
  if (skipPop) { skipPop = false; return; }
  backPushed = false;
  closeTop();   // 아직 열린 시트가 남으면 render → syncBack이 기록을 다시 쌓음
});

// 키보드가 올라오면 실제로 보이는 높이를 CSS 변수로 (아이폰은 키보드가 화면을 덮어서)
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => {
    const r = document.documentElement.style;
    r.setProperty("--vvh", vv.height + "px");
    r.setProperty("--vvt", vv.offsetTop + "px");
    const log = document.getElementById("chat-log");
    if (log && document.activeElement?.closest?.(".composer")) log.scrollTop = log.scrollHeight;   // 입력 중이면 마지막 메시지가 보이게
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  fit();
}

// ---------------- 움직이는 배경 (WebGL) ----------------
// 오로라처럼 천천히 흐르는 파스텔 빛 + 반짝이, 손가락이 닿는 곳에 빛이 따라옴. 게임 엔진 없이 셰이더 하나로 (몇 KB).
// 화면 해상도의 절반으로 초당 30번까지만 그리고, 탭이 안 보이면 멈춤. '동작 줄이기' 설정이면 한 장만. WebGL이 없으면 원래 그라데이션.
(function bgGL() {
  const cv = document.createElement("canvas"); cv.id = "bg-gl"; cv.setAttribute("aria-hidden", "true");
  let gl = null; try { gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" }); } catch (e) {}
  if (!gl) return;
  const FS = `precision mediump float;
uniform vec2 r; uniform float t; uniform vec2 p; uniform vec3 c1, c2, c3, bg;
float h(vec2 q) { return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 q) { vec2 i = floor(q), f = fract(q); f = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 q) { float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * n(q); q *= 2.03; a *= .5; } return s; }
void main() {
  vec2 uv = gl_FragCoord.xy / r, q = uv * vec2(r.x / r.y, 1.) * 1.7;
  float tt = t * .05;
  vec2 w = vec2(fbm(q + tt), fbm(q + vec2(5.2, 1.3) - tt));
  float f = fbm(q + 2.2 * w + vec2(tt * .7, -tt * .4));
  vec3 col = mix(c1, c2, smoothstep(.25, .8, f));
  col = mix(col, c3, smoothstep(.5, .95, w.y) * .8);
  vec2 d = (uv - p) * vec2(r.x / r.y, 1.);
  col += c3 * .35 * exp(-dot(d, d) * 9.);
  vec2 cell = gl_FragCoord.xy / (34. * r.y / 900.), id = floor(cell), fr = fract(cell) - .5;
  float s = h(id), tw = step(.975, s) * (.5 + .5 * sin(t * 1.7 + s * 60.));
  col += tw * smoothstep(.16, 0., length(fr)) * .7;
  gl_FragColor = vec4(mix(bg, col, .8), 1.);
}`;
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; for (const k of ["r", "t", "p", "c1", "c2", "c3", "bg"]) U[k] = gl.getUniformLocation(pr, k);
  // 라이트: 라벤더·연핑크·인디고 / 다크: 남색·자주·보라
  const PAL = { light: [[.80, .79, 1], [.98, .80, .88], [.55, .57, .94], [.95, .95, 1]], dark: [[.13, .14, .40], [.33, .15, .32], [.40, .42, .90], [.05, .05, .13]] };
  const isDark = () => { const th = document.documentElement.dataset.theme; return th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let px = .5, py = .7, tx = .5, ty = .7, last = 0;
  const aim = e => { tx = e.clientX / innerWidth; ty = 1 - e.clientY / innerHeight; };
  addEventListener("pointermove", aim, { passive: true }); addEventListener("pointerdown", aim, { passive: true });
  const t0 = performance.now();
  const draw = now => {
    px += (tx - px) * .05; py += (ty - py) * .05;
    const c = PAL[isDark() ? "dark" : "light"];
    gl.uniform2f(U.r, cv.width, cv.height); gl.uniform1f(U.t, (now - t0) / 1000); gl.uniform2f(U.p, px, py);
    gl.uniform3fv(U.c1, c[0]); gl.uniform3fv(U.c2, c[1]); gl.uniform3fv(U.c3, c[2]); gl.uniform3fv(U.bg, c[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  const fit = () => { const k = Math.min(devicePixelRatio || 1, 2) * .5; cv.width = Math.round(innerWidth * k); cv.height = Math.round(innerHeight * k); gl.viewport(0, 0, cv.width, cv.height); draw(performance.now()); };
  document.body.prepend(cv); document.documentElement.classList.add("gl");
  addEventListener("resize", fit); fit();
  if (reduce) { matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => draw(performance.now())); return; }
  const loop = now => { if (!document.hidden && now - last > 33) { last = now; draw(now); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();

// ---------------- 시작 ----------------
function subscribe(db, fail) {
  const watch = (name, apply) => db.collection(name).onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    apply(m); changed(name === "users" || name === "blocks" || name === "moderation");
    if (name === "signals" || name === "afters") scheduleLearning();
  }, fail);
  watch("users", m => { S.users = m; S.usersLoaded = true; });
  watch("likes", m => { S.likes = m; });
  watch("chatimgs", m => { S.imgs = { ...S.imgs, ...m }; });
  watch("signals", m => { S.signals = m; });
  watch("afters", m => { S.afters = m; });
  watch("chats", m => { S.chats = m; });
  watch("blocks", m => { S.blocks = m; ver++; });
  watch("reports", m => { S.reports = m; });
  watch("moderation", m => { S.mod = m; ver++; });
  watch("verifications", m => { S.verifs = m; });
}
// Firebase: 회원 프로필은 전체(추천 계산용), 좋아요·마음 표현·채팅·사진은 내가 당사자인 것만 받아요
function subscribeFB(uid) {
  S.subscribed = true;
  const db = S.db;
  const fail = e => { console.warn(e); if (e && e.code === "permission-denied") toast("데이터를 불러올 권한이 없어요. 다시 로그인해주세요"); };
  const parts = {};
  const merged = name => Object.assign({}, ...Object.entries(parts).filter(([k]) => k.startsWith(name + ":")).map(([, v]) => v));
  const watch = (key, q, apply, recalc) => q.onSnapshot(snap => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data();
    parts[key] = m; apply(key.split(":")[0]); changed(recalc);
  }, fail);
  watch("users:all", db.collection("users"), () => { S.users = merged("users"); S.usersLoaded = true; }, true);
  watch("likes:from", db.collection("likes").where("from", "==", uid), n => { S.likes = merged(n); });
  watch("likes:to", db.collection("likes").where("to", "==", uid), n => { S.likes = merged(n); });
  watch("signals:from", db.collection("signals").where("from", "==", uid), n => { S.signals = merged(n); scheduleLearning(); });
  watch("signals:to", db.collection("signals").where("to", "==", uid), n => { S.signals = merged(n); });
  // 애프터 체크: 내 답만 구독. 상대 답은 pollAfters()가 규칙이 허락할 때(둘 다 '예')만 가져옴
  watch("afters:from", db.collection("afters").where("from", "==", uid), n => { S.afters = { ...Object.fromEntries(Object.entries(S.afters).filter(([, a]) => a.from !== uid)), ...merged(n) }; scheduleLearning(); setTimeout(pollAfters, 0); });
  watch("blocks:from", db.collection("blocks").where("from", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("blocks:to", db.collection("blocks").where("to", "==", uid), n => { S.blocks = merged(n); }, true);
  watch("moderation:all", db.collection("moderation"), n => { S.mod = merged(n); }, true);
  // 내 사진 인증 상태, 관리자 여부
  db.doc("verifications/" + uid).get().then(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; if (ok) { S.myVerif = sn.data(); render(); } }).catch(() => {});
  db.doc("admins/" + uid).get().then(sn => {
    const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists;
    if (!ok) return;
    S.isAdmin = true; render();
    watch("reports:all", db.collection("reports"), n => { S.reports = merged(n); });
    watch("verifications:all", db.collection("verifications"), n => { S.verifs = merged(n); });
  }).catch(() => {});
  db.doc("priv/" + uid).onSnapshot(sn => { const ok = typeof sn.exists === "function" ? sn.exists() : sn.exists; S.priv = ok ? sn.data() : {}; S.privLoaded = true; render(); }, fail);
  watch("chats:mine", db.collection("chats").where("pair", "array-contains", uid), n => { S.chats = merged(n); });
  watch("chatimgs:mine", db.collection("chatimgs").where("pair", "array-contains", uid), n => { S.imgs = { ...S.imgs, ...merged(n) }; });
}
async function init() {
  const fb = FB();
  if (fb) {
    S.fb = fb; S.booting = true; S.mode = "connecting"; render();
    let user = null;
    try {
      user = await new Promise(res => { const un = fb.auth().onAuthStateChanged(u => { un(); res(u); }); });
      S.db = fb.firestore(); S.mode = "db";
      if (user && user.isAnonymous) { await fb.auth().signOut(); user = null; }   // 예전 버전의 익명 세션 정리
      if (user) {
        if (await ownDocExists(user.uid)) { S.booting = false; login(user.uid); return; }
        await fb.auth().signOut().catch(() => {});   // 초기화로 프로필이 없어진 옛 계정
      }
    } catch (e) { S.mode = "memory"; S.authError = "로그인 서버에 연결하지 못했어요. 잠시 뒤 다시 들어와주세요."; }
    S.uid = null; ls.set("gm-uid", null); S.booting = false; render();
    return;
  }
  render();
  const c = window.claude;
  S.isAdmin = true;   // 시연판: 누구나 관리자 화면을 볼 수 있음
  if (!c || typeof c.use !== "function") { S.mode = "memory"; render(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) {}
  if (user) { try { if (await user.can("data.write") === false) S.canWrite = false; } catch (e) {} }
  if (!db) { S.mode = "memory"; render(); return; }
  S.db = db; S.mode = "db";
  subscribe(db, e => { if (e && e.code === "revoked") { S.db = null; S.mode = "memory"; render(); } });
  render();
}
init();
</script>
